/* ---------- mappe da battaglia: griglia, pedine, nebbia, muri ---------- */
const CELL_M = 1.5;
const TOKEN_SIZES = [[0.5,"Minuscola"],[1,"Piccola o Media"],[2,"Grande"],[3,"Enorme"],[4,"Mastodontica"]];
const FOG_MODES = [["none","Nessuna"],["manual","A mano (pennello del master)"],["walls","Automatica con i muri"]];
const ENEMY_COLOR = "#9b2c2c";

function rayHit(ox, oy, dx, dy, s){
  const sx = s[2]-s[0], sy = s[3]-s[1]; const den = dx*sy - dy*sx; if (Math.abs(den) < 1e-12) return Infinity;
  const ax = s[0]-ox, ay = s[1]-oy; const t = (ax*sy - ay*sx)/den, u = (ax*dy - ay*dx)/den;
  return (t >= 0 && u >= -1e-9 && u <= 1+1e-9) ? t : Infinity;
}
/* poligono di visibilità da (ox,oy), in unità di griglia; R limita la distanza */
function visPoly(ox, oy, segs, cols, rows, R){
  let x0 = 0, y0 = 0, x1 = cols, y1 = rows;
  if (R){ x0 = Math.max(0, ox-R); y0 = Math.max(0, oy-R); x1 = Math.min(cols, ox+R); y1 = Math.min(rows, oy+R); }
  const S = [[x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]];
  for (const s of segs){ if (Math.max(s[0],s[2]) < x0 || Math.min(s[0],s[2]) > x1 || Math.max(s[1],s[3]) < y0 || Math.min(s[1],s[3]) > y1) continue; S.push(s); }
  const angs = [];
  for (const s of S){ for (const [px,py] of [[s[0],s[1]],[s[2],s[3]]]){ const a = Math.atan2(py-oy, px-ox); angs.push(a-1e-4, a, a+1e-4); } }
  angs.sort((a,b)=>a-b);
  const pts = []; let last = null;
  for (const a of angs){ if (last !== null && a-last < 1e-7) continue; last = a;
    const dx = Math.cos(a), dy = Math.sin(a); let tm = Infinity;
    for (const s of S){ const t = rayHit(ox, oy, dx, dy, s); if (t < tm) tm = t; }
    if (tm < Infinity) pts.push([ox+dx*tm, oy+dy*tm]); }
  return pts;
}
function inPoly(x, y, P){ let c = false; for (let i = 0, j = P.length-1; i < P.length; j = i++){
  const [xi,yi] = P[i], [xj,yj] = P[j]; if (((yi > y) !== (yj > y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-12) + xi)) c = !c; } return c; }
const sceneDims = (g, W, H) => { const size = Math.max(4, Number(g?.size)||70), offX = Number(g?.offX)||0, offY = Number(g?.offY)||0;
  return {size, offX, offY, cols: Math.max(1, Math.round(g?.cols || (W-offX)/size)), rows: Math.max(1, Math.round(g?.rows || (H-offY)/size))}; };
const cellDist = (a, b) => Math.max(Math.abs(a[0]-b[0]), Math.abs(a[1]-b[1]));
const snapTok = (v, size) => (size >= 1 && Math.round(size) % 2 === 0) ? Math.round(v) : Math.floor(v) + 0.5;
/* lo stato della nebbia del master in un punto: 1 scoperto, -1 coperto, 0 mai toccato (ripercorre le operazioni) */
function manualState(ops, x, y){ let on = 0;
  for (const o of ops || []){ const t = o[0];
    if (t === "A") on = 1; else if (t === "Z") on = 0;
    else if (t === "c" || t === "h"){ if (Math.hypot(x-o[1], y-o[2]) <= o[3]) on = (t === "c") ? 1 : -1; }
    else if (t === "r" || t === "H"){ const xa = Math.min(o[1], o[1]+o[3]), xb = Math.max(o[1], o[1]+o[3]), ya = Math.min(o[2], o[2]+o[4]), yb = Math.max(o[2], o[2]+o[4]);
      if (x >= xa && x <= xb && y >= ya && y <= yb) on = (t === "r") ? 1 : -1; } }
  return on; }
const LIGHT_OPTS = [[0,"no"],[3,"3 m"],[6,"6 m"],[12,"12 m (torcia, Luce)"],[18,"18 m (lanterna)"],[36,"36 m"]];

/* legge un file Universal VTT (.dd2vtt / .uvtt / .df2vtt) esportato da Dungeondraft, Dungeon Alchemist e simili */
function parseUvtt(j){
  const res = j.resolution || {}; const ppg = Number(res.pixels_per_grid) || 70;
  const ox = Number(res.map_origin?.x)||0, oy = Number(res.map_origin?.y)||0;
  const cols = Math.round(Number(res.map_size?.x)||0), rows = Math.round(Number(res.map_size?.y)||0);
  if (!j.image || !cols || !rows) throw new Error("il file non contiene immagine e dimensioni della mappa");
  const r3 = v => Math.round(v*1000)/1000;
  const walls = [];
  for (const line of [...(j.line_of_sight||[]), ...(j.objects_line_of_sight||[])]){
    for (let i = 1; i < (line||[]).length; i++){ const a = line[i-1], b = line[i]; walls.push([r3(a.x-ox), r3(a.y-oy), r3(b.x-ox), r3(b.y-oy), 0]); } }
  const doors = {};
  for (const p of j.portals || []){ const b = p.bounds || []; if (b.length < 2) continue;
    walls.push([r3(b[0].x-ox), r3(b[0].y-oy), r3(b[1].x-ox), r3(b[1].y-oy), 1]); doors[walls.length-1] = p.closed === false; }
  const lights = (j.lights || []).map(l => [r3((l.position?.x||0)-ox), r3((l.position?.y||0)-oy), r3(Number(l.range)||4)]).filter(l => l[2] > 0);
  const b64 = String(j.image).replace(/^data:[^,]*,/, ""); const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const type = u8[0] === 0x89 ? "image/png" : (u8[0] === 0xff ? "image/jpeg" : "image/webp");
  const ext = type.split("/")[1].replace("jpeg","jpg");
  return {grid:{size:ppg, offX:0, offY:0, cols, rows, show:true}, walls, doors, lights,
    dark: j.environment && j.environment.baked_lighting === false, blob: new Blob([u8], {type}), ext};
}

const AREA_SHAPES = [["sfera","Sfera / cerchio"],["cono","Cono"],["linea","Linea"],["cubo","Cubo / quadrato"]];
const AREA_NAMES = {sfera:"Sfera", cono:"Cono", linea:"Linea", cubo:"Cubo"};
const AURA_COLORS = [["#d8a442","oro"],["#3f8fd6","blu"],["#3f8f6b","verde"],["#c0392b","rosso"],["#8e5bd6","viola"],["#e8e8e8","bianco"]];
const fmtM = (m) => String(Math.round(m*10)/10).replace(".",",")+" m";
function areaGeom(a){
  const L = a.size / CELL_M, c = Math.cos(a.ang||0), s = Math.sin(a.ang||0);
  if (a.shape === "sfera") return {kind:"circle", cx:a.x, cy:a.y, r:L};
  if (a.shape === "cubo"){ const sx = c >= -1e-9 ? 1 : -1, sy = s >= -1e-9 ? 1 : -1; const x0 = Math.min(a.x, a.x+sx*L), y0 = Math.min(a.y, a.y+sy*L);
    return {kind:"poly", P:[[x0,y0],[x0+L,y0],[x0+L,y0+L],[x0,y0+L]]}; }
  const ex = a.x + c*L, ey = a.y + s*L;
  if (a.shape === "cono"){ const h = L/2; return {kind:"poly", P:[[a.x,a.y],[ex - s*h, ey + c*h],[ex + s*h, ey - c*h]]}; }
  const w = (a.width || CELL_M) / CELL_M / 2;
  return {kind:"poly", P:[[a.x - s*w, a.y + c*w],[ex - s*w, ey + c*w],[ex + s*w, ey - c*w],[a.x + s*w, a.y - c*w]]};
}
const inArea = (gm, x, y) => gm.kind === "circle" ? Math.hypot(x-gm.cx, y-gm.cy) <= gm.r + 1e-6 : inPoly(x, y, gm.P);
function areaCells(gm, cols, rows){ let xa, xb, ya, yb;
  if (gm.kind === "circle"){ xa = gm.cx-gm.r; xb = gm.cx+gm.r; ya = gm.cy-gm.r; yb = gm.cy+gm.r; }
  else { xa = Math.min(...gm.P.map(p=>p[0])); xb = Math.max(...gm.P.map(p=>p[0])); ya = Math.min(...gm.P.map(p=>p[1])); yb = Math.max(...gm.P.map(p=>p[1])); }
  const out = [];
  for (let cy = Math.max(0, Math.floor(ya)); cy < Math.min(rows, Math.ceil(yb)); cy++)
    for (let cx = Math.max(0, Math.floor(xa)); cx < Math.min(cols, Math.ceil(xb)); cx++) if (inArea(gm, cx+0.5, cy+0.5)) out.push([cx, cy]);
  return out; }
const areaLabel = (a) => `${AREA_NAMES[a.shape]||"Area"} ${fmtM(a.size)}${a.shape === "linea" ? " × "+fmtM(a.width||CELL_M) : ""}`;

function BattleLayer({scene, st, tokens, W, H, M, me, chars, fighters, combat, peek, tool, brushR, showWalls, imgRef, ctlRef, selTok, setSelTok, ops, onErr, areas=[], areaSpec, names={}}){
  const D = sceneDims(scene.grid, W, H);
  const fogC = useRef(null);
  const [drag, setDrag] = useState(null);       // {id, x, y, sx, sy}
  const [ruler, setRuler] = useState(null);     // {a:[x,y], b:[x,y]}
  const [rect, setRect] = useState(null);       // anteprima area da scoprire/coprire
  const [draft, setDraft] = useState(null);     // area dell'incantesimo in preparazione
  const [pending, setPending] = useState([]);   // operazioni del pennello non ancora salvate
  const g = useRef(null); const saveT = useRef(0); const sent = useRef(new Set());
  const fogOps = useMemo(()=>[...(st?.fog||[]), ...pending], [st?.fog, pending]);
  const mode = st?.fog_mode || "none";
  const doors = st?.doors || {};
  const locks = st?.locks || {}; const lockOf = i => Number(locks[i]) || 0;   // 1 a chiave, 2 segreta
  const charOwner = useMemo(()=>Object.fromEntries(chars.map(c=>[c.id, c.owner])), [chars]);
  const isParty = tk => tk.char_id && charOwner[tk.char_id] && !tk.hidden;
  const canMove = tk => M || (tk.char_id && charOwner[tk.char_id] === me.id);
  const pos = tk => drag && drag.id === tk.id ? [drag.x, drag.y] : [tk.x, tk.y];

  /* muri attivi (le porte aperte non bloccano) e luci */
  const segs = useMemo(()=> (scene.walls||[]).filter((w,i)=> !(w[4] === 1 && doors[i])), [scene.walls, JSON.stringify(doors)]);
  /* luci della mappa e luci portate dalle pedine (raggio in metri dal bordo della pedina) */
  const litKey = JSON.stringify(tokens.filter(tk => !tk.hidden && tk.light > 0).map(tk => [...pos(tk), tk.light/CELL_M + (Number(tk.size)||1)/2]));
  const lightPolys = useMemo(()=> mode === "walls" && st?.dark ? [...(scene.lights||[]), ...JSON.parse(litKey)].map(l => ({l, P: visPoly(l[0], l[1], segs, D.cols, D.rows, l[2])})) : [], [segs, mode, st?.dark, scene.lights, D.cols, D.rows, litKey]);
  const party = tokens.filter(isParty);
  const partyKey = JSON.stringify(party.map(tk => [tk.id, ...pos(tk), tk.vision||0]));
  const vision = useMemo(()=> mode !== "walls" ? [] : party.map(tk => { const [x,y] = pos(tk);
    return {x, y, dv: (Number(tk.vision)||0)/CELL_M, P: visPoly(x, y, segs, D.cols, D.rows, null)}; }), [partyKey, segs, mode, D.cols, D.rows]);
  const seesPoint = (x, y) => vision.some(v => inPoly(x, y, v.P) && (!st?.dark || (v.dv && Math.hypot(x-v.x, y-v.y) <= v.dv) ||
    lightPolys.some(lp => Math.hypot(x-lp.l[0], y-lp.l[1]) <= lp.l[2] && inPoly(x, y, lp.P))));
  const explored = useMemo(()=> new Set(st?.explored || []), [st?.explored]);
  /* con la nebbia automatica le aree coperte dal master restano coperte anche se i PG le vedrebbero */
  const visibleToPlayers = (x, y) => { if (mode === "none") return true; const ms = manualState(fogOps, x, y);
    return ms === 1 || (mode === "walls" && ms === 0 && seesPoint(x, y)); };

  /* celle esplorate: chi muove le pedine del gruppo (o il master) le segna */
  useEffect(()=>{
    if (mode !== "walls" || !vision.length) return;
    if (!M && !party.some(tk => charOwner[tk.char_id] === me.id)) return;
    const timer = setTimeout(()=>{ const fresh = [];
      for (const v of vision){ let xa = D.cols, xb = 0, ya = D.rows, yb = 0;
        for (const [px,py] of v.P){ xa = Math.min(xa,px); xb = Math.max(xb,px); ya = Math.min(ya,py); yb = Math.max(yb,py); }
        for (let cy = Math.max(0, Math.floor(ya)); cy < Math.min(D.rows, Math.ceil(yb)); cy++)
          for (let cx = Math.max(0, Math.floor(xa)); cx < Math.min(D.cols, Math.ceil(xb)); cx++){
            const id = cy*D.cols + cx; if (explored.has(id) || sent.current.has(id)) continue;
            if (seesPoint(cx+0.5, cy+0.5) && manualState(fogOps, cx+0.5, cy+0.5) !== -1){ fresh.push(id); sent.current.add(id); } } }
      if (fresh.length) ops.markExplored(fresh.slice(0, 20000)); }, 900);
    return ()=>clearTimeout(timer);
  },[vision, lightPolys, explored]);
  useEffect(()=>{ sent.current = new Set(); },[scene.plane, (st?.explored||[]).length === 0]);

  /* disegno della nebbia */
  useEffect(()=>{
    const c = fogC.current; if (!c || mode === "none") return;
    const k = Math.min(1, 2048 / W); const cw = Math.round(W*k), ch = Math.round(H*k);
    if (c.width !== cw || c.height !== ch){ c.width = cw; c.height = ch; }
    const ctx = c.getContext("2d"); const S = D.size*k, ox = D.offX*k, oy = D.offY*k;
    const X = x => ox + x*S, Y = y => oy + y*S;
    ctx.globalCompositeOperation = "source-over"; ctx.clearRect(0,0,cw,ch);
    ctx.fillStyle = "rgb(6,8,10)"; ctx.fillRect(0,0,cw,ch);
    if (mode === "walls" && explored.size){
      ctx.globalCompositeOperation = "destination-out";
      for (const id of explored){ const cx = id % D.cols, cy = Math.floor(id / D.cols); ctx.fillRect(X(cx)-0.5, Y(cy)-0.5, S+1, S+1); }
      ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "rgba(6,8,10,.62)";
      for (const id of explored){ const cx = id % D.cols, cy = Math.floor(id / D.cols); ctx.fillRect(X(cx)-0.5, Y(cy)-0.5, S+1, S+1); }
    }
    if (mode === "walls"){ ctx.globalCompositeOperation = "destination-out"; ctx.fillStyle = "#000";
      const path = P => { ctx.beginPath(); P.forEach(([x,y],i)=> i ? ctx.lineTo(X(x),Y(y)) : ctx.moveTo(X(x),Y(y))); ctx.closePath(); };
      for (const v of vision){ ctx.save(); path(v.P); ctx.clip();
        if (!st?.dark) ctx.fillRect(0,0,cw,ch);
        else { if (v.dv){ ctx.beginPath(); ctx.arc(X(v.x), Y(v.y), v.dv*S, 0, Math.PI*2); ctx.fill(); }
          for (const lp of lightPolys){ ctx.save(); path(lp.P); ctx.clip(); ctx.beginPath(); ctx.arc(X(lp.l[0]), Y(lp.l[1]), lp.l[2]*S, 0, Math.PI*2); ctx.fill(); ctx.restore(); } }
        ctx.restore(); } }
    for (const o of fogOps){ const t = o[0];
      if (t === "A"){ ctx.clearRect(0,0,cw,ch); continue; }
      if (t === "Z"){ ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "rgb(6,8,10)"; ctx.fillRect(0,0,cw,ch); continue; }
      ctx.globalCompositeOperation = (t === "c" || t === "r") ? "destination-out" : "source-over"; ctx.fillStyle = "rgb(6,8,10)";
      ctx.beginPath(); if (t === "c" || t === "h") ctx.arc(X(o[1]), Y(o[2]), o[3]*S, 0, Math.PI*2); else ctx.rect(X(o[1]), Y(o[2]), o[3]*S, o[4]*S); ctx.fill(); }
    ctx.globalCompositeOperation = "source-over";
  },[mode, fogOps, vision, lightPolys, explored, W, H, D.size, D.offX, D.offY, st?.dark]);

  /* comandi col puntatore (chiamati dalla mappa) */
  const toGrid = (e) => { const r = imgRef.current.getBoundingClientRect(); const px = (e.clientX - r.left)/r.width*W, py = (e.clientY - r.top)/r.height*H;
    return [(px - D.offX)/D.size, (py - D.offY)/D.size]; };
  const flush = (list) => { clearTimeout(saveT.current);
    saveT.current = setTimeout(async ()=>{ const all = [...(st?.fog||[]), ...list].slice(-4000);
      const m = await ops.setState({fog: all}); if (m) onErr(m); setPending([]); }, 350); };
  ctlRef.current = {
    down(e){
      const tokEl = e.target.closest && e.target.closest("[data-tok]"); const doorEl = e.target.closest && e.target.closest("[data-door]");
      const p = toGrid(e);
      if (doorEl){ g.current = {door: Number(doorEl.getAttribute("data-door"))}; return true; }
      if (tool === "ruler"){ const a = [Math.floor(p[0])+0.5, Math.floor(p[1])+0.5]; g.current = {ruler:true}; setRuler({a, b:a}); return true; }
      if (tool === "area" && areaSpec){ const o = [Math.round(p[0]), Math.round(p[1])]; g.current = {area:true, o};
        setDraft({plane: scene.plane, shape: areaSpec.shape, x:o[0], y:o[1], ang:0, size: areaSpec.size || CELL_M, width: areaSpec.shape === "linea" ? (areaSpec.width || CELL_M) : null, created_by: me.id}); return true; }
      if (M && (tool === "reveal" || tool === "hide")){ const op = [tool === "reveal" ? "c" : "h", +p[0].toFixed(2), +p[1].toFixed(2), brushR];
        g.current = {brush: op[0], last: p, list: [op]}; setPending(x => [...x, op]); return true; }
      if (M && (tool === "rect" || tool === "rectHide")){ g.current = {rect: tool === "rect" ? "r" : "H", a: [Math.round(p[0]), Math.round(p[1])]}; setRect({a: g.current.a, b: g.current.a}); return true; }
      if (tokEl){ const tk = tokens.find(x => x.id === tokEl.getAttribute("data-tok")); if (!tk) return false;
        g.current = {tok: tk.id, can: canMove(tk), sx: tk.x, sy: tk.y, gx: p[0], gy: p[1], moved: false}; return true; }
      return false; },
    move(e){ const s = g.current; if (!s) return; const p = toGrid(e);
      if (s.ruler) setRuler(r => r && {...r, b:[Math.floor(p[0])+0.5, Math.floor(p[1])+0.5]});
      else if (s.area){ const dx = p[0]-s.o[0], dy = p[1]-s.o[1];
        setDraft(d => d && {...d, ang: (dx || dy) ? Math.atan2(dy, dx) : d.ang,
          size: areaSpec.size || Math.max(1, Math.round(d.shape === "cubo" ? Math.max(Math.abs(dx), Math.abs(dy)) : Math.hypot(dx, dy)))*CELL_M}); }
      else if (s.brush){ if (Math.hypot(p[0]-s.last[0], p[1]-s.last[1]) >= Math.max(0.3, brushR*0.4)){ const op = [s.brush, +p[0].toFixed(2), +p[1].toFixed(2), brushR]; s.last = p; s.list.push(op); setPending(x => [...x, op]); } }
      else if (s.rect) setRect({a: s.a, b: [Math.round(p[0]), Math.round(p[1])]});
      else if (s.tok && s.can){ const dx = p[0]-s.gx, dy = p[1]-s.gy; if (!s.moved && Math.hypot(dx,dy) < 0.15) return; s.moved = true;
        setDrag({id: s.tok, x: s.sx+dx, y: s.sy+dy, sx: s.sx, sy: s.sy}); } },
    async up(e){ const s = g.current; g.current = null; if (!s) return;
      if (s.door !== undefined){
        if (M && tool === "locks"){ const m = await ops.setLock(s.door, (lockOf(s.door)+1) % 3); if (m) onErr(m); return; }
        if (!M && lockOf(s.door)){ onErr("Questa porta è chiusa a chiave: serve una chiave, un incantesimo o una prova (chiedi al master)."); return; }
        const m = await ops.toggleDoor(s.door); if (m) onErr(m); return; }
      if (s.ruler) return;
      if (s.area){ const d = draft; setDraft(null); if (!d) return;
        const m = await ops.addArea({shape:d.shape, x:d.x, y:d.y, ang:+(d.ang||0).toFixed(4), size:d.size, width:d.width}); if (m) onErr(m); return; }
      if (s.brush){ flush(s.list); return; }
      if (s.rect){ const p = toGrid(e); const b = [Math.round(p[0]), Math.round(p[1])]; setRect(null);
        const w = b[0]-s.a[0], h = b[1]-s.a[1]; if (!w || !h) return; const op = [s.rect, s.a[0], s.a[1], w, h]; setPending(x => [...x, op]); flush([op]); return; }
      if (s.tok){ const tk = tokens.find(x => x.id === s.tok);
        if (!s.moved || !tk){ setSelTok(s.tok); return; }
        const p = toGrid(e); const nx = clamp(snapTok(s.sx + p[0]-s.gx, tk.size), 0, D.cols), ny = clamp(snapTok(s.sy + p[1]-s.gy, tk.size), 0, D.rows);
        setDrag({id: tk.id, x: nx, y: ny, sx: s.sx, sy: s.sy});
        const m = await ops.moveToken(tk.id, nx, ny); if (m) onErr(m);
        setTimeout(()=>setDrag(d => d && d.id === tk.id ? null : d), 600); } },
  };
  useEffect(()=>()=>clearTimeout(saveT.current),[]);
  useEffect(()=>{ if (tool !== "ruler") setRuler(null); if (tool !== "area") setDraft(null); },[tool]);

  const pctX = x => (D.offX + x*D.size)/W*100, pctY = y => (D.offY + y*D.size)/H*100;
  const fighterOf = tk => tk.combatant_id ? fighters.find(f => f.id === tk.combatant_id) : (tk.char_id ? fighters.find(f => f.char_id === tk.char_id) : null);
  const turnId = combat?.active ? combat.turn_id : null;
  const doorMarks = (scene.walls||[]).map((w,i)=>[w,i]).filter(([w,i]) => w[4] === 1);
  const shown = tokens.filter(tk => M || (!tk.hidden && (isParty(tk) || canMove(tk) || visibleToPlayers(...pos(tk)))));
  const doorSeen = (w) => { const mx = (w[0]+w[2])/2, my = (w[1]+w[3])/2, L = Math.hypot(w[2]-w[0], w[3]-w[1]) || 1, nx = -(w[3]-w[1])/L*0.3, ny = (w[2]-w[0])/L*0.3;
    return visibleToPlayers(mx+nx, my+ny) || visibleToPlayers(mx-nx, my-ny); };
  const allAreas = draft ? [...areas, {...draft, id:"draft"}] : areas;
  const areaInfo = allAreas.map(a => { const gm = areaGeom(a); const col = a.color || (a.created_by ? colorFor(a.created_by) : "#d8a442");
    return {a, gm, col, cells: areaCells(gm, D.cols, D.rows), inside: tokens.filter(tk => (M || !tk.hidden) && inArea(gm, ...pos(tk))).length}; });
  const dragTok = drag && tokens.find(x => x.id === drag.id);
  const dist = drag ? Math.round(cellDist([drag.sx, drag.sy], [snapTok(drag.x, dragTok?.size||1), snapTok(drag.y, dragTok?.size||1)])) : 0;
  return html`<div className="bt">
    ${scene.grid?.show !== false && html`<svg className="bt-grid" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id=${"gp-"+scene.plane} width=${D.size} height=${D.size} x=${D.offX} y=${D.offY} patternUnits="userSpaceOnUse">
        <path d=${`M ${D.size} 0 L 0 0 0 ${D.size}`} fill="none" stroke="rgba(0,0,0,.38)" strokeWidth=${Math.max(1, D.size/60)}/></pattern></defs>
      <rect x=${D.offX} y=${D.offY} width=${D.cols*D.size} height=${D.rows*D.size} fill=${`url(#gp-${scene.plane})`}/></svg>`}
    ${mode !== "none" && html`<canvas className="bt-fog" ref=${fogC} style=${{opacity: M && !peek ? .5 : 1}} aria-hidden="true"></canvas>`}
    ${(areaInfo.length > 0 || shown.some(tk => tk.aura > 0)) && html`<svg className="bt-areas" viewBox=${`0 0 ${D.cols} ${D.rows}`} preserveAspectRatio="none" aria-hidden="true"
      style=${{left:pctX(0)+"%", top:pctY(0)+"%", width:(D.cols*D.size/W*100)+"%", height:(D.rows*D.size/H*100)+"%"}}>
      ${shown.filter(tk => tk.aura > 0).map(tk => { const [x,y] = pos(tk); const col = tk.aura_color || "#d8a442";
        return html`<circle key=${"au"+tk.id} cx=${x} cy=${y} r=${(Number(tk.size)||1)/2 + tk.aura/CELL_M} fill=${col} fillOpacity=".14" stroke=${col} strokeWidth=".06" strokeDasharray=".25 .15"/>`; })}
      ${areaInfo.map(({a, gm, col, cells}) => html`<g key=${a.id}>
        ${cells.map(([cx,cy]) => html`<rect key=${cx+"_"+cy} x=${cx} y=${cy} width="1" height="1" fill=${col} fillOpacity=".3"/>`)}
        ${gm.kind === "circle" ? html`<circle cx=${gm.cx} cy=${gm.cy} r=${gm.r} fill=${col} fillOpacity=".08" stroke=${col} strokeWidth=".1"/>`
          : html`<polygon points=${gm.P.map(p=>p.join(",")).join(" ")} fill=${col} fillOpacity=".08" stroke=${col} strokeWidth=".1" strokeLinejoin="round"/>`}
        <circle cx=${a.x} cy=${a.y} r=".14" fill=${col}/></g>`)}</svg>`}
    ${areaInfo.map(({a, inside}) => html`<div key=${"al"+a.id} className="bt-dist bt-alabel" style=${{left:pctX(a.x)+"%", top:pctY(a.y)+"%"}}>${areaLabel(a)}${inside ? " · "+inside+(inside===1?" pedina":" pedine") : ""}</div>`)}
    ${M && showWalls && (scene.walls||[]).length > 0 && html`<svg className="bt-walls" viewBox=${`0 0 ${D.cols} ${D.rows}`} preserveAspectRatio="none" aria-hidden="true"
      style=${{left:pctX(0)+"%", top:pctY(0)+"%", width:(D.cols*D.size/W*100)+"%", height:(D.rows*D.size/H*100)+"%"}}>
      ${(scene.walls||[]).map((w,i)=> w[4] === 1 ? null : html`<line key=${i} x1=${w[0]} y1=${w[1]} x2=${w[2]} y2=${w[3]}/>`)}</svg>`}
    ${doorMarks.filter(([w,i]) => M || (doorSeen(w) && !(lockOf(i) === 2 && !doors[i]))).map(([w,i])=>{ const lk = lockOf(i);
      const title = M && tool === "locks" ? `${["Porta normale","Chiusa a chiave","Segreta (i giocatori non la vedono)"][lk]}: tocca per cambiare`
        : doors[i] ? (lk && !M ? "Porta aperta (chiusa a chiave: solo il master la chiude)" : "Porta aperta: tocca per chiudere")
        : lk === 2 ? "Porta segreta chiusa: i giocatori non la vedono" : lk ? (M ? "Chiusa a chiave: tu puoi aprirla, i giocatori no" : "Porta chiusa a chiave") : "Porta chiusa: tocca per aprire";
      return html`<button type="button" key=${"d"+i} data-door=${i}
      className=${"bt-door"+(doors[i]?" open":"")+(lk===1?" locked":"")+(lk===2?" secret":"")} title=${title} aria-label=${title}
      style=${{left:pctX((w[0]+w[2])/2)+"%", top:pctY((w[1]+w[3])/2)+"%"}}>${doors[i] ? "◫" : lk === 1 ? "🔒" : lk === 2 ? "S" : "▮"}</button>`; })}
    ${shown.map(tk => { const [x,y] = pos(tk); const f = fighterOf(tk); const pc = !!(tk.char_id && charOwner[tk.char_id]);
      const col = tk.color || (pc ? colorFor(charOwner[tk.char_id]) : ENEMY_COLOR); const sz = Number(tk.size)||1;
      return html`<div key=${tk.id} data-tok=${tk.id} title=${tk.name}
        className=${"bt-tok"+(tk.hidden?" hid":"")+(tk.light>0?" lit":"")+(selTok===tk.id?" sel":"")+(f && turnId===f.id?" turn":"")+(canMove(tk)?" mine":"")+(f && !pc ? " hp-"+(f.hp_state||"illeso").replace(/\s+/g,"-") : "")}
        style=${{left:pctX(x)+"%", top:pctY(y)+"%", width:(sz*D.size/W*100)+"%", "--c":col}}>
        <span className="bt-in">${initialsOf(tk.name)}</span></div>`; })}
    ${drag && html`<div className="bt-dist" style=${{left:pctX(drag.x)+"%", top:pctY(drag.y)+"%"}}>${String(dist*CELL_M).replace(".",",")} m</div>`}
    ${ruler && html`<svg className="bt-ruler" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true">
      <line x1=${D.offX+ruler.a[0]*D.size} y1=${D.offY+ruler.a[1]*D.size} x2=${D.offX+ruler.b[0]*D.size} y2=${D.offY+ruler.b[1]*D.size} strokeWidth=${Math.max(2, D.size/14)}/></svg>
      <div className="bt-dist" style=${{left:pctX(ruler.b[0])+"%", top:pctY(ruler.b[1])+"%"}}>${String(cellDist(ruler.a, ruler.b)*CELL_M).replace(".",",")} m · ${cellDist(ruler.a, ruler.b)} quad.</div>`}
    ${rect && html`<div className="bt-rect" style=${{left:pctX(Math.min(rect.a[0],rect.b[0]))+"%", top:pctY(Math.min(rect.a[1],rect.b[1]))+"%",
      width:(Math.abs(rect.b[0]-rect.a[0])*D.size/W*100)+"%", height:(Math.abs(rect.b[1]-rect.a[1])*D.size/H*100)+"%"}}></div>`}
  </div>`;
}

function BattleTools({scene, st, tokens, chars, fighters, names, M, me, tool, setTool, brushR, setBrushR, showWalls, setShowWalls, selTok, setSelTok, ops, onImport, busy, W, H, areas=[], areaSpec, setAreaSpec}){
  const [open, setOpen] = useState("");     // "" | "grid" | "token"
  const [nt, setNt] = useState({name:"", size:1, hidden:false, vision:0});
  const D = sceneDims(scene.grid, W||1, H||1);
  const charOwner = Object.fromEntries(chars.map(c=>[c.id, c.owner]));
  const tk = tokens.find(x => x.id === selTok);
  const pcs = chars.filter(c => c.owner);
  const center = [Math.floor(D.cols/2)+0.5, Math.floor(D.rows/2)+0.5];
  const placeRow = (n) => Array.from({length:n}, (_,i)=>[clamp(center[0] + (i - Math.floor(n/2)), 0.5, D.cols-0.5), center[1]]);
  const addParty = async () => { const missing = pcs.filter(c => !tokens.some(t => t.char_id === c.id)); if (!missing.length) return;
    const P = placeRow(missing.length);
    await ops.addTokens(missing.map((c,i)=>({name: norm(c).name || "PG", char_id: c.id, size: 1, x: P[i][0], y: P[i][1], vision: 0}))); };
  const addFoes = async () => { const fs = fighters.filter(f => !f.char_id && f.kind !== "evento" && !tokens.some(t => t.combatant_id === f.id)); if (!fs.length) return;
    const P = placeRow(fs.length);
    await ops.addTokens(fs.map((f,i)=>({name: f.name || "Avversario", combatant_id: f.id, hidden: !!f.hidden, size: 1, x: P[i][0], y: Math.min(D.rows-0.5, P[i][1]+2)}))); };
  const setGrid = (patch) => { const gr = {...(scene.grid||{}), ...patch};
    if (!(scene.walls||[]).length && ("size" in patch || "offX" in patch || "offY" in patch)){ delete gr.cols; delete gr.rows; }
    ops.setScene({grid: gr}); };
  const mode = st?.fog_mode || "none";
  const T = (k, l, title) => html`<button type="button" className="btn small" aria-pressed=${tool===k} title=${title||l} onClick=${()=>setTool(tool===k ? null : k)}>${l}</button>`;
  return html`<div className="bt-tools">
    <div className="row" style=${{gap:6}}>
      ${T(null, "✋ Sposta", "Trascina le pedine (le tue; il master tutte) e la mappa")}
      ${T("ruler", "📏 Righello", "Misura in metri: 1 quadretto = 1,5 m, anche in diagonale")}
      ${T("area", "◎ Area", "Sfera, cono, linea o cubo di un incantesimo: trascina dal punto d’origine")}
      ${tool === "area" && html`<select className="field" style=${{width:"auto",padding:"3px 6px"}} aria-label="Forma" value=${areaSpec.shape} onChange=${e=>setAreaSpec({...areaSpec, shape:e.target.value})}>
          ${AREA_SHAPES.map(([k,l])=>html`<option key=${k} value=${k}>${l}</option>`)}</select>
        <select className="field" style=${{width:"auto",padding:"3px 6px"}} aria-label=${areaSpec.shape==="sfera" ? "Raggio" : areaSpec.shape==="cubo" ? "Lato" : "Lunghezza"} value=${areaSpec.size} onChange=${e=>setAreaSpec({...areaSpec, size:Number(e.target.value)})}>
          <option value="0">${areaSpec.shape==="sfera" ? "raggio" : areaSpec.shape==="cubo" ? "lato" : "lunghezza"}: trascinando</option>
          ${[1.5,3,4.5,6,9,12,18,27,36].map(m=>html`<option key=${m} value=${m}>${areaSpec.shape==="sfera" ? "raggio" : areaSpec.shape==="cubo" ? "lato" : "lunghezza"} ${fmtM(m)}</option>`)}</select>
        ${areaSpec.shape === "linea" && html`<select className="field" style=${{width:"auto",padding:"3px 6px"}} aria-label="Larghezza" value=${areaSpec.width} onChange=${e=>setAreaSpec({...areaSpec, width:Number(e.target.value)})}>
          ${[1.5,3,4.5,6].map(m=>html`<option key=${m} value=${m}>larga ${fmtM(m)}</option>`)}</select>`}`}
      ${M && mode !== "none" && html`<span className="bt-sep"></span>${T("reveal","Scopri","Pennello: scopri la nebbia")}${T("rect","Scopri area","Trascina per scoprire un rettangolo")}${T("hide","Copri","Pennello: rimetti la nebbia (anche sopra la nebbia automatica)")}${T("rectHide","Copri area","Trascina per coprire un rettangolo: resta coperto anche se i personaggi lo vedrebbero")}
        <label className="row" style=${{gap:4,fontSize:".85rem"}}>Pennello<select className="field" style=${{width:"auto",padding:"3px 6px"}} value=${brushR} onChange=${e=>setBrushR(Number(e.target.value))}>
          ${[0.5,1,2,3,5].map(r=>html`<option key=${r} value=${r}>${String(r*2*CELL_M).replace(".",",")} m</option>`)}</select></label>`}
      ${M && (scene.walls||[]).some(w=>w[4]===1) && html`<span className="bt-sep"></span>${T("locks","🔒 Porte","Tocca una porta per cambiarla: normale → chiusa a chiave → segreta")}`}
    </div>
    ${M && html`<div className="row" style=${{gap:8,fontSize:".88rem"}}>
      <label className="row" style=${{gap:4}}>Nebbia<select id="bt-fog" className="field" style=${{width:"auto",padding:"3px 6px"}} value=${mode} onChange=${e=>ops.setState({fog_mode:e.target.value})}>
        ${FOG_MODES.filter(([k]) => k !== "walls" || (scene.walls||[]).length).map(([k,l])=>html`<option key=${k} value=${k}>${l}</option>`)}</select></label>
      ${mode !== "none" && html`<button type="button" className="btn small" onClick=${()=>ops.setState({fog:[["A"]]})}>Scopri tutto</button><button type="button" className="btn small" onClick=${()=>ops.setState({fog:[]})}>Copri tutto</button>`}
      ${mode === "walls" && html`<button type="button" className="btn small" onClick=${()=>ops.setState({explored:[]})} title="Dimentica le zone già viste">Azzera esplorato</button>
        <label className="row" style=${{gap:6}}><input id="bt-dark" type="checkbox" checked=${!!st?.dark} onChange=${e=>ops.setState({dark:e.target.checked})}/>Ambiente buio (servono luci o scurovisione)</label>`}
      ${(scene.walls||[]).length > 0 && html`<label className="row" style=${{gap:6}}><input id="bt-walls" type="checkbox" checked=${showWalls} onChange=${e=>setShowWalls(e.target.checked)}/>Mostra muri</label>`}
    </div>
    <div className="row" style=${{gap:6}}>
      <button type="button" className="btn small" disabled=${!pcs.some(c=>!tokens.some(t=>t.char_id===c.id))} onClick=${addParty}>+ Pedine del gruppo</button>
      <button type="button" className="btn small" disabled=${!fighters.some(f=>!f.char_id && f.kind !== "evento" && !tokens.some(t=>t.combatant_id===f.id))} onClick=${addFoes} title="Crea le pedine degli avversari in Iniziativa">+ Avversari dall’iniziativa</button>
      <button type="button" className="btn small" aria-pressed=${open==="token"} onClick=${()=>setOpen(open==="token"?"":"token")}>+ Pedina</button>
      <button type="button" className="btn small" aria-pressed=${open==="grid"} onClick=${()=>setOpen(open==="grid"?"":"grid")}>Griglia</button>
      <span className="spacer"></span>
      <button type="button" className="btn small" disabled=${busy} onClick=${onImport} title="File .dd2vtt di Dungeondraft (o .uvtt / .df2vtt): immagine, griglia, muri, porte e luci">${busy ? "Importazione…" : "Importa da Dungeondraft"}</button>
    </div>
    ${open==="token" && html`<form className="row bt-form" onSubmit=${async e=>{ e.preventDefault(); if (!nt.name.trim()) return;
        await ops.addTokens([{name:nt.name.trim(), size:nt.size, hidden:nt.hidden, vision:nt.vision||null, x:center[0], y:center[1]}]); setNt({...nt, name:""}); }}>
      <input id="nt-name" className="field" style=${{flex:"1 1 160px"}} placeholder="Nome (es. Goblin 1)" value=${nt.name} onChange=${e=>setNt({...nt, name:e.target.value})}/>
      <select className="field" style=${{width:"auto"}} aria-label="Taglia" value=${nt.size} onChange=${e=>setNt({...nt, size:Number(e.target.value)})}>${TOKEN_SIZES.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select>
      <label className="row" style=${{gap:6}}><input type="checkbox" checked=${nt.hidden} onChange=${e=>setNt({...nt, hidden:e.target.checked})}/>nascosta</label>
      <button className="btn small primary" disabled=${!nt.name.trim()}>Aggiungi al centro</button></form>`}
    ${open==="grid" && html`<div className="row bt-form" style=${{fontSize:".88rem"}}>
      <label className="lab" style=${{width:110}}>Quadretto (px)<${Num} value=${D.size} min=${4} max=${1000} onChange=${v=>setGrid({size:v})}/></label>
      <label className="lab" style=${{width:100}}>Sposta X (px)<${Num} value=${D.offX} min=${-1000} max=${1000} onChange=${v=>setGrid({offX:v})}/></label>
      <label className="lab" style=${{width:100}}>Sposta Y (px)<${Num} value=${D.offY} min=${-1000} max=${1000} onChange=${v=>setGrid({offY:v})}/></label>
      <label className="row" style=${{gap:6}}><input type="checkbox" checked=${scene.grid?.show !== false} onChange=${e=>setGrid({show:e.target.checked})}/>Mostra griglia</label>
      <span className="muted">${D.cols} × ${D.rows} quadretti · immagine ${W}×${H} px</span></div>`}`}
    ${areas.length > 0 && html`<div className="row" style=${{gap:6,fontSize:".85rem"}}><span className="muted">Aree:</span>
      ${areas.map(a => html`<span key=${a.id} className="chip" style=${{borderColor: a.color || colorFor(a.created_by)}}>${areaLabel(a)}${names[a.created_by] ? " · "+names[a.created_by] : ""}
        ${(M || a.created_by === me.id) && html` <button type="button" className="xbtn" aria-label="Togli l’area" onClick=${()=>ops.deleteArea(a.id)}>×</button>`}</span>`)}
      ${M && areas.length > 1 && html`<button type="button" className="btn small" onClick=${()=>areas.forEach(a=>ops.deleteArea(a.id))}>Togli tutte</button>`}</div>`}
    ${tk && html`<div className="bt-sel">
      <span className="bt-sw" style=${{background: tk.color || (tk.char_id && charOwner[tk.char_id] ? colorFor(charOwner[tk.char_id]) : ENEMY_COLOR)}}></span>
      ${M ? html`<input className="field" style=${{flex:"1 1 140px"}} aria-label="Nome della pedina" value=${tk.name} onChange=${e=>ops.updateToken(tk.id,{name:e.target.value}, true)}/>`
          : html`<b style=${{flex:"1 1 auto"}}>${tk.name}</b>`}
      ${M && html`<select className="field" style=${{width:"auto"}} aria-label="Taglia" value=${tk.size} onChange=${e=>ops.updateToken(tk.id,{size:Number(e.target.value)})}>${TOKEN_SIZES.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select>
        <label className="row" style=${{gap:4,fontSize:".85rem"}} title="Scurovisione in metri (conta negli ambienti bui)">Scurovisione<select className="field" style=${{width:"auto",padding:"3px 6px"}} value=${tk.vision||0} onChange=${e=>ops.updateToken(tk.id,{vision:Number(e.target.value)||null})}>
          ${[0,9,18,36].map(v=>html`<option key=${v} value=${v}>${v ? v+" m" : "no"}</option>`)}</select></label>
        <label className="row" style=${{gap:4,fontSize:".85rem"}}><input type="checkbox" checked=${tk.hidden} onChange=${e=>ops.updateToken(tk.id,{hidden:e.target.checked})}/>nascosta</label>
        <button type="button" className="btn small danger" onClick=${()=>{ ops.deleteToken(tk.id); setSelTok(null); }}>Togli</button>`}
      ${(M || (tk.char_id && charOwner[tk.char_id] === me.id)) && html`<label className="row" style=${{gap:4,fontSize:".85rem"}} title="Aura o emanazione attorno alla pedina (es. Guardiani spirituali, Aura di protezione)">Aura
        <select className="field" style=${{width:"auto",padding:"3px 6px"}} value=${tk.aura||0} onChange=${e=>ops.setAura(tk.id, Number(e.target.value), tk.aura_color||"#d8a442")}>
          ${[0,1.5,3,4.5,6,9,18].map(v=>html`<option key=${v} value=${v}>${v ? fmtM(v) : "no"}</option>`)}</select>
        ${tk.aura > 0 && html`<select className="field" style=${{width:"auto",padding:"3px 6px"}} aria-label="Colore dell’aura" value=${tk.aura_color||"#d8a442"} onChange=${e=>ops.setAura(tk.id, tk.aura, e.target.value)}>
          ${AURA_COLORS.map(([c,l])=>html`<option key=${c} value=${c}>${l}</option>`)}</select>`}</label>
        <label className="row" style=${{gap:4,fontSize:".85rem"}} title="Raggio della luce portata (intensa + fioca): illumina gli ambienti bui">Luce
        <select className="field" style=${{width:"auto",padding:"3px 6px"}} value=${tk.light||0} onChange=${e=>ops.setLight(tk.id, Number(e.target.value))}>
          ${LIGHT_OPTS.concat(LIGHT_OPTS.some(([v])=>v===(tk.light||0)) ? [] : [[tk.light, fmtM(tk.light)]]).map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select></label>`}
      <button type="button" className="iconbtn" aria-label="Chiudi" onClick=${()=>setSelTok(null)}>×</button></div>`}
    ${tool === "locks" && html`<p className="muted" style=${{margin:0,fontSize:".82rem"}}>Tocca una porta per cambiarla: ▮ normale (la apre chiunque) → 🔒 chiusa a chiave (la apri solo tu) → S segreta (i giocatori non la vedono finché non la apri). Per aprirla o chiuderla torna su “✋ Sposta”.</p>`}
    ${tool === "area" && html`<p className="muted" style=${{margin:0,fontSize:".82rem"}}>Trascina dal punto d’origine nella direzione voluta: la sfera parte da un incrocio della griglia, cono e linea dal punto in cui tocchi. Sono evidenziati i quadretti colpiti (centro dentro l’area) e quante pedine ci sono. L’area resta visibile a tutti finché chi l’ha messa (o il master) non la toglie.</p>`}
    ${!M && tool !== "area" && html`<p className="muted" style=${{margin:0,fontSize:".82rem"}}>Trascina la tua pedina: si aggancia al quadretto e tutti la vedono muovere. Il righello misura in metri; “Area” mostra sfere, coni e linee degli incantesimi. Toccando la tua pedina puoi darle un’aura o una luce (lanterna, torcia).</p>`}
  </div>`;
}

/* ---------- mappa ---------- */
function MapView({me, party, mapUrls, names, onMove, onClearTrail, onUpload, pins, pinOps, cfgOps, scenes={}, sceneStates={}, tokens=[], areas=[], sceneOps, chars=[], fighters=[], combat}){
  const [tool, setTool] = useState(null); const [brushR, setBrushR] = useState(1); const [showWalls, setShowWalls] = useState(true);
  const [areaSpec, setAreaSpec] = useState({shape:"sfera", size:0, width:1.5});
  const [selTok, setSelTok] = useState(null); const [dims, setDims] = useState(null); const ctl = useRef(null); const uvIn = useRef(null);
  const [adding, setAdding] = useState(null);         // nuova mappa {name, dark}
  const [renaming, setRenaming] = useState(null);     // nuovo nome della mappa aperta
  const [cfgBusy, setCfgBusy] = useState(false);
  const [planeSel, setPlane] = useState(party?.plane || lsGet("plane", PLANES[0][0]));
  const plane = PLANE_NAME[planeSel] ? planeSel : PLANES[0][0];
  const [mode, setMode] = useState(null);           // null | "move" | "pin"
  const [pending, setPending] = useState(null);     // posizione del gruppo da confermare
  const [draft, setDraft] = useState(null);         // nuovo segnaposto {x,y}
  const [selId, setSelId] = useState(null);
  const [editing, setEditing] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [label, setLabel] = useState("");
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [hiddenKinds, setHiddenKinds] = useState(()=>lsGet("pinfilter", []));
  const [peek, setPeek] = useState(false);          // il master vede il buio come i giocatori
  const vp = useRef(null), layer = useRef(null), img = useRef(null), fileIn = useRef(null), dark = useRef(null);
  const t = useRef({s:1,x:0,y:0});
  const ptrs = useRef(new Map()); const gesture = useRef(null);
  const src = mapUrls[plane];
  const srcKey = src ? src.split("?")[0] : "";
  const M = me.isMaster;
  useEffect(()=>lsSet("plane",plane),[plane]);
  useEffect(()=>lsSet("pinfilter",hiddenKinds),[hiddenKinds]);
  useEffect(()=>{ setLoaded(false); setPending(null); setDraft(null); setSelId(null); setRenaming(null); setSelTok(null); setTool(null); },[srcKey, plane]);
  const scene = scenes[plane]; const sst = sceneStates[plane]; const battle = !!scene?.battle;
  const planeTokens = tokens.filter(t=>t.plane===plane);
  const planeAreas = areas.filter(a=>a.plane===plane);
  const bOps = sceneOps ? {
    setScene: (patch) => sceneOps.setScene(plane, patch), setState: (patch) => sceneOps.setState(plane, patch),
    addTokens: (rows) => sceneOps.addTokens(plane, rows), updateToken: sceneOps.updateToken, deleteToken: sceneOps.deleteToken,
    moveToken: sceneOps.moveToken, markExplored: (cells) => sceneOps.markExplored(plane, cells), toggleDoor: (i) => sceneOps.toggleDoor(plane, i),
    addArea: (row) => sceneOps.addArea(plane, row), deleteArea: sceneOps.deleteArea, setAura: sceneOps.setAura, setLight: sceneOps.setLight,
    setLock: (i, v) => { const L = {...(sst?.locks||{})}; if (v) L[i] = v; else delete L[i]; return sceneOps.setState(plane, {locks: L}); } } : null;
  const setBattle = async (on) => { setErr("");
    const m = await bOps.setScene({battle:on, ...(scene ? {} : {grid:{size: dims ? Math.max(20, Math.round(dims[0]/30)) : 70, offX:0, offY:0, show:true}})});
    if (m) { setErr(m); return; }
    if (on && !sst){ const m2 = await bOps.setState({fog_mode:"none"}); if (m2) setErr(m2); } };
  const importUvtt = async (file) => { if (!file) return; setBusy("imp"); setErr("");
    try { const u = parseUvtt(JSON.parse(await file.text()));
      const f = new File([u.blob], `dd-${plane}.${u.ext}`, {type: u.blob.type});
      const m = await onUpload(plane, f); if (m) throw new Error(m);
      const m1 = await bOps.setScene({battle:true, grid:u.grid, walls:u.walls, lights:u.lights}); if (m1) throw new Error(m1);
      const m2 = await bOps.setState({doors:u.doors, fog_mode: u.walls.length ? "walls" : "manual", dark: !!u.dark, explored:[], fog:[]}); if (m2) throw new Error(m2);
      if (Object.keys(sst?.locks||{}).length) await bOps.setState({locks:{}});
    } catch(e){ setErr("Importazione non riuscita: "+e.message); }
    setBusy(""); if (uvIn.current) uvIn.current.value = ""; };

  const planePins = pins.filter(p=>p.plane===plane);
  const shownPins = planePins.filter(p=>!hiddenKinds.includes(p.kind));
  const sel = pins.find(p=>p.id===selId);
  const canEditPin = p => p && (M || p.created_by===me.id);

  const apply = () => { const el = layer.current; if(!el) return; const {s,x,y} = t.current;
    el.style.transform = `translate(${x}px,${y}px) scale(${s})`; el.style.setProperty("--inv", String(1/s)); };
  const fit = () => { const v = vp.current, l = layer.current; if(!v||!l) return;
    const W = v.clientWidth, H = v.clientHeight, h = l.offsetHeight || 1; const s = Math.min(1, H/h);
    t.current = {s, x:(W - W*s)/2, y:(H - h*s)/2}; apply(); };
  const zoomAt = (f, px, py) => { const o = t.current; const s = clamp(o.s*f, 0.2, 10);
    t.current = {s, x: px - (px-o.x)*(s/o.s), y: py - (py-o.y)*(s/o.s)}; apply(); };
  const zoomBtn = f => { const v = vp.current; zoomAt(f, v.clientWidth/2, v.clientHeight/2); };
  const centerOn = (nx, ny) => { const v=vp.current, l=layer.current; if(!v||!l) return; const o=t.current; const s=Math.max(o.s,1.5);
    t.current = {s, x: v.clientWidth/2 - nx*l.offsetWidth*s, y: v.clientHeight/2 - ny*l.offsetHeight*s}; apply(); };

  useEffect(()=>{ const v = vp.current; if(!v) return;
    const onWheel = e => { if(!layer.current) return; e.preventDefault(); const r=v.getBoundingClientRect(); zoomAt(e.deltaY<0?1.15:1/1.15, e.clientX-r.left, e.clientY-r.top); };
    v.addEventListener("wheel", onWheel, {passive:false});
    const onResize = () => fit(); window.addEventListener("resize", onResize);
    return ()=>{ v.removeEventListener("wheel", onWheel); window.removeEventListener("resize", onResize); };
  },[srcKey]);

  /* buio del Sottosuolo */
  const isDeep = planeDark(plane) && !battle;
  const lightsKey = JSON.stringify([isDeep, loaded, peek, M, planePins.filter(p=>PIN_LIGHT.has(p.kind)&&p.done).map(p=>[p.x,p.y]), party?.plane===plane ? [party.x,party.y] : null]);
  useEffect(()=>{
    const c = dark.current, im = img.current; if (!c || !im || !isDeep || !loaded) return;
    const W = 900, H = Math.max(1, Math.round(W * (im.naturalHeight||1) / (im.naturalWidth||1)));
    c.width = W; c.height = H; const ctx = c.getContext("2d");
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(5,7,9,${M && !peek ? 0.55 : 0.95})`; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "destination-out";
    const hole = (x,y,r) => { const g = ctx.createRadialGradient(x*W,y*H,0,x*W,y*H,r*W);
      g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(.55,"rgba(0,0,0,.9)"); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x*W,y*H,r*W,0,Math.PI*2); ctx.fill(); };
    planePins.filter(p=>PIN_LIGHT.has(p.kind) && p.done).forEach(p=>hole(p.x,p.y,0.1));
    if (party && party.plane===plane && typeof party.x==="number") hole(party.x, party.y, 0.035);
    ctx.globalCompositeOperation = "source-over";
  },[lightsKey]);

  const toNorm = (e) => { const r = img.current.getBoundingClientRect(); return {x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.height}; };
  const down = e => { if (e.target.closest(".mapctl")) return;
    if (battle && dims && ctl.current && ptrs.current.size === 0 && ctl.current.down(e)){ vp.current.setPointerCapture?.(e.pointerId); gesture.current = {battle:true}; return; }
    vp.current.setPointerCapture?.(e.pointerId);
    ptrs.current.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pinEl = e.target.closest("[data-pin]");
    gesture.current = {x:e.clientX, y:e.clientY, moved:false, multi: ptrs.current.size>1, pin: pinEl ? pinEl.getAttribute("data-pin") : null}; };
  const move = e => { if (gesture.current?.battle){ ctl.current?.move(e); return; } const P = ptrs.current; if(!P.has(e.pointerId)) return; const prev = P.get(e.pointerId);
    const cur = {x:e.clientX,y:e.clientY};
    if (P.size===1){ t.current.x += cur.x-prev.x; t.current.y += cur.y-prev.y; apply(); }
    else if (P.size===2){ const [a,b] = [...P.entries()].map(([id,p])=> id===e.pointerId?cur:p); const [pa,pb]=[...P.values()];
      const d0 = Math.hypot(pa.x-pb.x,pa.y-pb.y), d1 = Math.hypot(a.x-b.x,a.y-b.y);
      const r = vp.current.getBoundingClientRect(); if (d0>0) zoomAt(d1/d0, (a.x+b.x)/2-r.left, (a.y+b.y)/2-r.top);
      if (gesture.current) gesture.current.multi = true; }
    P.set(e.pointerId,cur);
    const g = gesture.current; if (g && Math.hypot(cur.x-g.x,cur.y-g.y)>6) g.moved = true; };
  const up = e => { if (gesture.current?.battle){ gesture.current = null; ctl.current?.up(e); return; } const P = ptrs.current; P.delete(e.pointerId); const g = gesture.current;
    if (P.size!==0) return; gesture.current = null;
    if (!g || g.moved || g.multi || !img.current) return;
    const n = toNorm(e); const inside = n.x>=0 && n.x<=1 && n.y>=0 && n.y<=1;
    if (mode==="move" && inside){ setPending(n); setLabel(party?.plane===plane ? (party?.label||"") : ""); return; }
    if (mode==="pin" && inside){ setDraft(n); setSelId(null); return; }
    if (g.pin){ setSelId(g.pin); setEditing(false); setConfirmDel(false); return; }
    setSelId(null); };

  const savePos = async () => { if(!pending) return; setBusy("pos"); setErr("");
    const msg = await onMove({plane, x:pending.x, y:pending.y, label:label.trim()});
    if (msg) setErr(msg); else { setPending(null); setMode(null); }
    setBusy(""); };
  const upload = async (file) => { if(!file) return; setBusy("up"); setErr("");
    const msg = await onUpload(plane, file); if (msg) setErr(msg);
    setBusy(""); if (fileIn.current) fileIn.current.value = ""; };
  const savePin = async (f) => { setBusy("pin"); setErr("");
    const row = {kind:f.kind, label:f.label.trim(), note:f.note.trim(), done:!!f.done, hidden: M && !!f.hidden};
    const msg = editing && sel ? await pinOps.update(sel.id, row) : await pinOps.add({...row, plane, x:draft.x, y:draft.y});
    setBusy(""); if (msg) { setErr(msg); return; }
    setDraft(null); setEditing(false); if (!sel) setMode(null); };
  const toggleKind = k => setHiddenKinds(x => x.includes(k) ? x.filter(y=>y!==k) : [...x,k]);

  const here = party && party.plane===plane && typeof party.x==="number";
  const trailPts = (party?.trail||[]).filter(p=>p.plane===plane);
  const line = [...trailPts, ...(here?[party]:[])];
  const byName = party?.by ? (names[party.by] || "") : "";
  const kindsHere = PIN_KINDS.filter(([k])=>planePins.some(p=>p.kind===k));
  const deepLit = planePins.filter(p=>PIN_LIGHT.has(p.kind)&&p.done).length, deepAll = planePins.filter(p=>PIN_LIGHT.has(p.kind)).length;
  const setModeTo = m => { setMode(mode===m ? null : m); setPending(null); setDraft(null); };

  return html`<div>
    <div className="party-head">
      <div><div className="eyebrow">${CFG.name}</div><h2>${PLANES.length>1 ? "Mappe" : (PLANE_NAME[plane] && PLANE_NAME[plane]!=="Mondo" ? PLANE_NAME[plane] : "Mappa del mondo")}</h2></div>
      <span className="spacer"></span>
      ${PLANES.length>1 && html`<div className="planes" role="group" aria-label="Piano">${PLANES.map(([k,n])=>html`<button type="button" key=${k} aria-pressed=${plane===k} onClick=${()=>setPlane(k)}>
        ${party?.plane===k && typeof party.x==="number" && html`<span className="here" title="Il gruppo è qui"></span>`}${planeDark(k) ? html`<span className="darkdot" title="Al buio"></span>` : null}${n}</button>`)}</div>`}
      ${M && cfgOps && !adding && renaming===null && html`<button type="button" className="btn small" title="Rinomina questa mappa" onClick=${()=>setRenaming(PLANE_NAME[plane]||"")}>✎ Rinomina</button>`}
      ${M && cfgOps && !adding && renaming===null && html`<button type="button" className="btn small" onClick=${()=>setAdding({name:"", dark:false})}>+ Mappa</button>`}
    </div>
    ${M && cfgOps && renaming!==null && html`<form className="pincard addmap" onSubmit=${async e=>{ e.preventDefault(); const nm = renaming.trim(); if (!nm) return;
        setCfgBusy(true); const m = await cfgOps.renamePlane(plane, nm); setCfgBusy(false);
        if (m) setErr(m); else setRenaming(null); }}>
      <div className="eyebrow">Rinomina la mappa</div>
      <div className="row">
        <input id="renmap-name" className="field" style=${{flex:"1 1 220px"}} maxLength="40" value=${renaming} onChange=${e=>setRenaming(e.target.value)} autoFocus/>
        <button className="btn primary" disabled=${cfgBusy || !renaming.trim() || renaming.trim()===PLANE_NAME[plane]}>Salva</button>
        <button type="button" className="btn" onClick=${()=>setRenaming(null)}>Annulla</button>
      </div>
      <p className="muted" style=${{margin:0,fontSize:".82rem"}}>Cambia solo il nome: immagine, segnaposti e posizione del gruppo restano.</p>
    </form>`}
    ${M && cfgOps && adding && html`<form className="pincard addmap" onSubmit=${async e=>{ e.preventDefault(); const nm = adding.name.trim(); if (!nm) return;
        setCfgBusy(true); const r = await cfgOps.addPlane(nm, adding.dark); setCfgBusy(false);
        if (r.error) setErr(r.error); else { setAdding(null); setPlane(r.key); } }}>
      <div className="eyebrow">Nuova mappa</div>
      <div className="row">
        <input id="newmap-name" className="field" style=${{flex:"1 1 220px"}} placeholder="Nome (es. Città sommersa, Piano dei sogni, Dungeon 1)" value=${adding.name} onChange=${e=>setAdding({...adding, name:e.target.value})} autoFocus/>
        <label className="row" style=${{gap:6,flexWrap:"nowrap"}}><input id="newmap-dark" type="checkbox" checked=${adding.dark} onChange=${e=>setAdding({...adding, dark:e.target.checked})}/>al buio</label>
        <button className="btn primary" disabled=${cfgBusy || !adding.name.trim()}>Aggiungi</button>
        <button type="button" className="btn" onClick=${()=>setAdding(null)}>Annulla</button>
      </div>
      <p className="muted" style=${{margin:0,fontSize:".82rem"}}>Dopo averla aggiunta carichi l’immagine. Riordinare o togliere le mappe: ⚙ Campagna → Mappe.</p>
    </form>`}

    <div className=${"mapbox"+(mode?" moving":"")} ref=${vp} onPointerDown=${src?down:null} onPointerMove=${src?move:null} onPointerUp=${src?up:null} onPointerCancel=${src?up:null}>
      ${src ? html`
        <div className="layer" ref=${layer}>
          <img key=${plane} ref=${img} src=${src} alt=${"Mappa: "+PLANE_NAME[plane]} draggable="false" onLoad=${e=>{ setDims([e.target.naturalWidth, e.target.naturalHeight]); setLoaded(true); requestAnimationFrame(fit);}}
            onError=${()=>setErr("Immagine della mappa non trovata: il master può ricaricarla.")}/>
          ${isDeep && !battle && html`<canvas className="dark" ref=${dark} aria-hidden="true"></canvas>`}
          ${!battle && line.length>1 && html`<svg className="trail" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points=${line.map(p=>(p.x*100)+","+(p.y*100)).join(" ")}/></svg>`}
          ${!battle && trailPts.map((p,i)=>html`<span key=${i} className="tdot" title=${p.label||""} style=${{left:p.x*100+"%",top:p.y*100+"%"}}></span>`)}
          ${shownPins.map(p=>html`<span key=${p.id} data-pin=${p.id} className=${"pin"+(p.id===selId?" sel":"")+(p.hidden?" hid":"")+(PIN_LIGHT.has(p.kind)&&p.done?" lit":"")} style=${{left:p.x*100+"%",top:p.y*100+"%"}} title=${p.label||PIN_NAME[p.kind]}>
              <${Glyph} kind=${p.kind} done=${p.done}/>${p.label && html`<span className="pin-lbl">${p.label}</span>`}</span>`)}
          ${draft && html`<span className="pin draft" style=${{left:draft.x*100+"%",top:draft.y*100+"%"}}><${Glyph} kind="nota"/></span>`}
          ${battle && dims && loaded && html`<${BattleLayer} scene=${scene} st=${sst} tokens=${planeTokens} W=${dims[0]} H=${dims[1]} M=${M} me=${me} chars=${chars} fighters=${fighters} combat=${combat}
            peek=${peek} tool=${tool} brushR=${brushR} showWalls=${showWalls} imgRef=${img} ctlRef=${ctl} selTok=${selTok} setSelTok=${setSelTok} ops=${bOps} onErr=${setErr}
            areas=${planeAreas} areaSpec=${areaSpec} names=${names}/>`}
          ${here && !pending && !battle && html`<div className="marker" style=${{left:party.x*100+"%",top:party.y*100+"%"}}>
            <span className="ring"></span><span className="m"><${Mark} size=${38}/></span>${party.label && html`<span className="lbl">${party.label}</span>`}</div>`}
          ${pending && html`<div className="marker pending" style=${{left:pending.x*100+"%",top:pending.y*100+"%"}}><span className="m"><${Mark} size=${38}/></span></div>`}
        </div>
        <div className="mapctl">
          <button type="button" className="iconbtn" aria-label="Ingrandisci" onClick=${()=>zoomBtn(1.3)}>+</button>
          <button type="button" className="iconbtn" aria-label="Riduci" onClick=${()=>zoomBtn(1/1.3)}>−</button>
          <button type="button" className="iconbtn" aria-label="Mostra tutta la mappa" title="Mostra tutta" onClick=${fit}>⤢</button>
          ${here && html`<button type="button" className="iconbtn" aria-label="Centra sul gruppo" title="Centra sul gruppo" onClick=${()=>centerOn(party.x,party.y)}>◎</button>`}
        </div>
        ${battle && tool==="ruler" && html`<div className="maphint">Trascina sulla mappa per misurare.</div>`}
        ${battle && tool==="area" && html`<div className="maphint">Trascina dal punto d’origine dell’area.</div>`}

    <div className="mapfoot">

      ${src && html`<button type="button" className="btn" aria-pressed=${mode==="pin"} onClick=${()=>setModeTo("pin")}>${mode==="pin"?"Annulla segnaposto":"+ Segnaposto"}</button>`}

      ${kindsHere.map(([k,n])=>html`<button type="button" key=${k} className="kchip" aria-pressed=${!hiddenKinds.includes(k)} onClick=${()=>toggleKind(k)}><${Glyph} kind=${k} size=${16}/>${n} <span className="muted">${planePins.filter(p=>p.kind===k).length}</span></button>`)}

      ${M && bOps && html`<label className="row" style=${{gap:6,fontSize:".85rem"}} title="Griglia, pedine, righello e nebbia"><input id="map-battle" type="checkbox" checked=${battle} disabled=${!src}

      ${M && cfgOps && !battle && html`<label className="row" style=${{gap:6,fontSize:".85rem"}}><input id="map-dark" type="checkbox" checked=${isDeep} disabled=${cfgBusy}
        onChange=${async e=>{ setCfgBusy(true); const m = await cfgOps.setDark(plane, e.target.checked); setCfgBusy(false); if (m) setErr(m); }}/>Mappa al buio</label>`}
      ${isDeep && M && src && html`<label className="row" style=${{gap:6,fontSize:".85rem"}}><input id="peek" type="checkbox" checked=${peek} onChange=${e=>setPeek(e.target.checked)}/>Vedi il buio come i giocatori</label>`}
    </div>`}
    ${battle && bOps && html`<${BattleTools} scene=${scene} st=${sst} tokens=${planeTokens} chars=${chars} fighters=${fighters} names=${names} M=${M} me=${me}
      tool=${tool} setTool=${setTool} brushR=${brushR} setBrushR=${setBrushR} showWalls=${showWalls} setShowWalls=${setShowWalls} selTok=${selTok} setSelTok=${setSelTok}
      ops=${bOps} busy=${busy==="imp"} onImport=${()=>uvIn.current?.click()} W=${dims?.[0]} H=${dims?.[1]} areas=${planeAreas} areaSpec=${areaSpec} setAreaSpec=${setAreaSpec}/>`}
    ${M && bOps && !battle && html`<p className="muted" style=${{margin:"8px 0 0",fontSize:".85rem"}}>Per i combattimenti spunta “Mappa da battaglia”, oppure <button type="button" className="linkish" style=${{textDecoration:"underline"}} disabled=${busy==="imp"} onClick=${()=>uvIn.current?.click()}>${busy==="imp" ? "importazione in corso…" : "importa un file .dd2vtt di Dungeondraft"}</button> in questa mappa (immagine, griglia, muri, porte e luci).</p>`}
    ${isDeep && !battle && M && deepAll===0 && html`<p className="muted" style=${{margin:"8px 0 0",fontSize:".85rem"}}>Mappa al buio: i giocatori vedono solo la piccola luce del gruppo. Per illuminare una zona metti un segnaposto ${PIN_KINDS.filter(k=>PIN_LIGHT.has(k[0])).map(k=>"“"+k[1]+"”").join(" o ")||"che fa luce"} e segnalo come ${(PIN_KINDS.find(k=>PIN_LIGHT.has(k[0]))?.[2]||"fatto").toLowerCase()}.</p>`}
    ${err && html`<p className="notice" role="alert" style=${{marginTop:10,borderColor:"var(--heart)"}}>${err} <button type="button" className="btn small" onClick=${()=>setErr("")}>Chiudi</button></p>`}
  </div>`;
}

/* ---------- accesso ---------- */
const AUTH_ERR = (m) => {
  const s = String(m||"");
  if (/invalid login/i.test(s)) return "Email o password sbagliate.";
  if (/already registered|already been registered/i.test(s)) return "Questa email è già registrata: usa “Accedi”.";
  if (/password.*(6|characters|short)/i.test(s)) return "La password deve avere almeno 6 caratteri.";
  if (/email not confirmed/i.test(s)) return "Email non ancora confermata. Chiedi al master di disattivare la conferma email in Supabase, oppure apri il link che ti è arrivato.";
  if (/rate limit/i.test(s)) return "Troppi tentativi ravvicinati: riprova tra qualche minuto.";
  if (/fetch|network/i.test(s)) return "Server non raggiungibile: controlla la connessione.";
  return s || "Qualcosa non ha funzionato, riprova.";
};

let BRAND = "";
function Gate({children}){
  return html`<div className="gate"><div className="gate-box">
    <div className="brand"><${Mark} size=${34}/><span>${BRAND || "Taccuino"}</span></div>${children}</div></div>`;
}

function Login({sb}){
  const [mode, setMode] = useState("in");
  const [email, setEmail] = useState(""); const [pw, setPw] = useState(""); const [name, setName] = useState("");
  const [err, setErr] = useState(""); const [info, setInfo] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async (e) => { e.preventDefault(); setErr(""); setInfo(""); setBusy(true);
    try {
      if (mode==="in"){ const {error} = await sb.auth.signInWithPassword({email:email.trim(), password:pw}); if (error) setErr(AUTH_ERR(error.message)); }
      else { const {data, error} = await sb.auth.signUp({email:email.trim(), password:pw, options:{data:{name:name.trim()}}});
        if (error) setErr(AUTH_ERR(error.message));
        else if (!data.session) setInfo("Account creato. Conferma l’indirizzo dal link che ti è arrivato per email, poi accedi."); }
    } catch(ex){ setErr(AUTH_ERR(ex.message)); }
    setBusy(false); };
  return html`<${Gate}>
    <div className="gate-card">
      <div className="gate-tabs" role="group" aria-label="Accesso">
        <button type="button" aria-pressed=${mode==="in"} onClick=${()=>{setMode("in"); setErr("");}}>Accedi</button>
        <button type="button" aria-pressed=${mode==="up"} onClick=${()=>{setMode("up"); setErr("");}}>Registrati</button>
      </div>
      <form onSubmit=${submit}>
        ${mode==="up" && html`<label className="lab">Il tuo nome (lo vedrà il gruppo)<input id="su-name" className="field" required value=${name} onChange=${e=>setName(e.target.value)} autoComplete="nickname"/></label>`}
        <label className="lab">Email<input id="li-email" className="field" type="email" required value=${email} onChange=${e=>setEmail(e.target.value)} autoComplete="email"/></label>
        <label className="lab">Password<input id="li-pw" className="field" type="password" required minLength="6" value=${pw} onChange=${e=>setPw(e.target.value)} autoComplete=${mode==="in"?"current-password":"new-password"}/></label>
        ${err && html`<p className="err" role="alert">${err}</p>`}
        ${info && html`<p className="ok" role="status">${info}</p>`}
        <button className="btn primary" disabled=${busy}>${busy ? "Un momento…" : mode==="in" ? "Accedi" : "Crea l’account"}</button>
      </form>
    </div>
    <p className="muted" style=${{textAlign:"center",margin:0,fontSize:".9rem"}}>${mode==="in" ? "Prima volta? Scegli “Registrati”: dopo ti verrà chiesto il codice del gruppo." : "Serve solo per riconoscerti e salvare la tua scheda."}</p>
  <//>`;
}

function Join({sb, user, onJoined}){
  const [name, setName] = useState(user.user_metadata?.name || "");
  const [code, setCode] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async (e) => { e.preventDefault(); setErr(""); setBusy(true);
    const {data, error} = await sb.rpc("join_campaign", {p_code: code.trim(), p_name: name.trim()});
    setBusy(false);
    if (error) setErr(AUTH_ERR(error.message)); else if (!data) setErr("Codice del gruppo sbagliato. Chiedilo al master."); else onJoined();
  };
  return html`<${Gate}>
    <div className="gate-card">
      <h3>Unisciti al gruppo</h3>
      <p className="muted" style=${{margin:0}}>Inserisci il codice che ti ha dato il master. Serve una volta sola.</p>
      <form onSubmit=${submit}>
        <label className="lab">Il tuo nome<input id="jn-name" className="field" required value=${name} onChange=${e=>setName(e.target.value)}/></label>
        <label className="lab">Codice del gruppo<input id="jn-code" className="field" required value=${code} onChange=${e=>setCode(e.target.value)} autoComplete="off"/></label>
        ${err && html`<p className="err" role="alert">${err}</p>`}
        <button className="btn primary" disabled=${busy}>${busy?"Un momento…":"Entra"}</button>
      </form>
    </div>
    <button type="button" className="btn small" style=${{justifySelf:"center"}} onClick=${()=>sb.auth.signOut()}>Esci da ${user.email}</button>
  <//>`;
}

/* ---------- dati condivisi ---------- */
const rowToChar = (r) => ({...(r.data||{}), id:r.id, owner:r.owner});

function useCampaign(sb, active){
  const [chars, setChars] = useState([]);
  const [party, setParty] = useState(null);
  const [maps, setMaps] = useState({});
  const [members, setMembers] = useState([]);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState("");
  const [rolls, setRolls] = useState([]);
  const [combat, setCombat] = useState({active:false, round:0, turn_id:null});
  const [fighters, setFighters] = useState([]);
  const [secrets, setSecrets] = useState({});
  const [pins, setPins] = useState([]);
  const [world, setWorld] = useState(null);
  const [handouts, setHandouts] = useState([]);
  const [codex, setCodex] = useState([]);
  const [codexSecrets, setCodexSecrets] = useState({});
  const [journal, setJournal] = useState([]);
  const [sounds, setSounds] = useState([]);
  const [audio, setAudio] = useState(null);
  const [recipes, setRecipes] = useState([]);
  const [spellsCustom, setSpellsCustom] = useState([]);
  const [config, setConfig] = useState(undefined);
  const [scenes, setScenes] = useState({}); const [sceneStates, setSceneStates] = useState({}); const [tokens, setTokens] = useState([]); const [areas, setAreas] = useState([]);
  const [clocks, setClocks] = useState([]); const [clocksErr, setClocksErr] = useState("");
  const loadClocks = useCallback(async()=>{ const {data, error} = await sb.from("clocks").select("*").order("sort");
    if (error){ setClocksErr(error.message); return; } setClocksErr("");
    setClocks([...data].sort((a,b)=>(a.sort-b.sort) || String(a.created_at).localeCompare(String(b.created_at)))); },[sb]);
  const loadAreas = useCallback(async()=>{ const {data, error} = await sb.from("areas").select("*"); if (!error) setAreas(data); },[sb]);
  const loadScenes = useCallback(async()=>{ loadAreas(); const [a, b, c] = await Promise.all([sb.from("scenes").select("*"), sb.from("scene_state").select("*"), sb.from("tokens").select("*")]);
    if (!a.error) setScenes(Object.fromEntries(a.data.map(r=>[r.plane, r]))); if (!b.error) setSceneStates(Object.fromEntries(b.data.map(r=>[r.plane, r]))); if (!c.error) setTokens(c.data); },[sb]);
  const loadTokens = useCallback(async()=>{ const {data, error} = await sb.from("tokens").select("*"); if (!error) setTokens(data); },[sb]);
  const tokT = useRef(0);
  const loadConfig = useCallback(async()=>{ const {data, error} = await sb.from("campaign").select("config").eq("id",1).maybeSingle(); if (!error) setConfig(data?.config || null); else setConfig(null); },[sb]);
  const loadSpells = useCallback(async()=>{ const {data, error} = await sb.from("spells_custom").select("*"); if (!error) setSpellsCustom(data); },[sb]);
  const onNewRoll = useRef(null);
  const loadAudio = useCallback(async()=>{
    const [s, a, r] = await Promise.all([sb.from("sounds").select("*"), sb.from("audio_state").select("*").eq("id",1).maybeSingle(), sb.from("recipes").select("*")]);
    if (!s.error) setSounds(s.data); if (!a.error && a.data) setAudio(a.data); if (!r.error) setRecipes(r.data);
  },[sb]);
  const loadChron = useCallback(async()=>{
    const [h, c, cs, j] = await Promise.all([sb.from("handouts").select("*"), sb.from("codex").select("*"), sb.from("codex_secrets").select("*"), sb.from("journal").select("*")]);
    if (!h.error) setHandouts(h.data); if (!c.error) setCodex(c.data);
    if (!cs.error) setCodexSecrets(Object.fromEntries(cs.data.map(x=>[x.id,x]))); if (!j.error) setJournal(j.data);
  },[sb]);
  const loadPins = useCallback(async()=>{ const {data, error} = await sb.from("pins").select("*"); if (!error) setPins(data); },[sb]);
  const loadWorld = useCallback(async()=>{ const {data, error} = await sb.from("world").select("*").eq("id",1).maybeSingle(); if (!error && data) setWorld(data); },[sb]);

  const addRoll = useCallback((r)=>{ setRolls(x=> x.some(y=>y.id===r.id) ? x : [r, ...x].slice(0,80)); },[]);
  const loadFighters = useCallback(async()=>{
    const [f, s] = await Promise.all([sb.from("combatants").select("*"), sb.from("combatant_secrets").select("*")]);
    if (!f.error) setFighters(f.data);
    if (!s.error) setSecrets(Object.fromEntries(s.data.map(x=>[x.id,x])));
  },[sb]);

  const loadAll = useCallback(async () => {
    const [c,p,m,mb,r,cb] = await Promise.all([
      sb.from("characters").select("id,owner,data,updated_at"),
      sb.from("party").select("state").eq("id",1).maybeSingle(),
      sb.from("maps").select("plane,path"),
      sb.from("members").select("user_id,name"),
      sb.from("rolls").select("*").order("id",{ascending:false}).limit(60),
      sb.from("combat").select("*").eq("id",1).maybeSingle()]);
    const e = c.error||p.error||m.error||mb.error||r.error||cb.error;
    if (e) setError("Non riesco a leggere i dati del gruppo: "+e.message+(r.error||cb.error?" (hai eseguito fase1.sql?)":""));
    else setError("");
    if (!c.error) setChars(c.data.map(rowToChar));
    if (!p.error) setParty(p.data?.state || null);
    if (!m.error) setMaps(Object.fromEntries(m.data.map(x=>[x.plane,x.path])));
    if (!mb.error) setMembers(mb.data);
    if (!r.error) setRolls(r.data);
    if (!cb.error && cb.data) setCombat(cb.data);
    await Promise.all([loadFighters(), loadPins(), loadWorld(), loadChron(), loadAudio(), loadSpells(), loadConfig(), loadScenes(), loadClocks()]);
    setReady(true);
  },[sb, loadFighters, loadPins, loadWorld, loadChron, loadAudio, loadSpells, loadConfig, loadScenes, loadClocks]);

  useEffect(()=>{ if (!active) return;
    loadAll();
    const ch = sb.channel("taccuino")
      .on("postgres_changes",{event:"*",schema:"public",table:"characters"}, (pl)=>{
        if (pl.eventType==="DELETE") setChars(x=>x.filter(c=>c.id!==pl.old.id));
        else { const n = rowToChar(pl.new); setChars(x=> x.some(c=>c.id===n.id) ? x.map(c=>c.id===n.id?n:c) : [...x,n]); } })
      .on("postgres_changes",{event:"*",schema:"public",table:"party"}, (pl)=>{ if (pl.new) setParty(pl.new.state||null); })
      .on("postgres_changes",{event:"*",schema:"public",table:"maps"}, ()=>{ sb.from("maps").select("plane,path").then(({data})=>data && setMaps(Object.fromEntries(data.map(x=>[x.plane,x.path])))); })
      .on("postgres_changes",{event:"*",schema:"public",table:"members"}, ()=>{ sb.from("members").select("user_id,name").then(({data})=>data && setMembers(data)); })
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"rolls"}, (pl)=>{ addRoll(pl.new); onNewRoll.current && onNewRoll.current(pl.new); })
      .on("postgres_changes",{event:"*",schema:"public",table:"combat"}, (pl)=>{ if (pl.new && pl.new.id) setCombat(pl.new); })
      .on("postgres_changes",{event:"*",schema:"public",table:"combatants"}, ()=>loadFighters())
      .on("postgres_changes",{event:"*",schema:"public",table:"combatant_secrets"}, ()=>loadFighters())
      .on("postgres_changes",{event:"*",schema:"public",table:"pins"}, ()=>loadPins())
      .on("postgres_changes",{event:"*",schema:"public",table:"world"}, (pl)=>{ if (pl.new && pl.new.id) setWorld(pl.new); })
      .on("postgres_changes",{event:"*",schema:"public",table:"handouts"}, ()=>loadChron())
      .on("postgres_changes",{event:"*",schema:"public",table:"codex"}, ()=>loadChron())
      .on("postgres_changes",{event:"*",schema:"public",table:"codex_secrets"}, ()=>loadChron())
      .on("postgres_changes",{event:"*",schema:"public",table:"journal"}, ()=>loadChron())
      .on("postgres_changes",{event:"*",schema:"public",table:"sounds"}, ()=>loadAudio())
      .on("postgres_changes",{event:"*",schema:"public",table:"recipes"}, ()=>loadAudio())
      .on("postgres_changes",{event:"*",schema:"public",table:"spells_custom"}, ()=>loadSpells())
      .on("postgres_changes",{event:"*",schema:"public",table:"scenes"}, (pl)=>{ if (pl.eventType==="DELETE") setScenes(x=>{ const y={...x}; delete y[pl.old?.plane]; return y; });
          else if (pl.new && pl.new.plane && pl.new.walls !== undefined) setScenes(x=>({...x, [pl.new.plane]: pl.new})); else loadScenes(); })
      .on("postgres_changes",{event:"*",schema:"public",table:"scene_state"}, (pl)=>{ if (pl.eventType==="DELETE") setSceneStates(x=>{ const y={...x}; delete y[pl.old?.plane]; return y; });
          else if (pl.new && pl.new.plane && pl.new.fog !== undefined) setSceneStates(x=>({...x, [pl.new.plane]: pl.new})); else loadScenes(); })
      .on("postgres_changes",{event:"*",schema:"public",table:"areas"}, (pl)=>{
          if (pl.eventType==="DELETE") setAreas(x=>x.filter(a=>a.id!==pl.old?.id));
          else if (pl.new && pl.new.id) setAreas(x=> x.some(a=>a.id===pl.new.id) ? x.map(a=>a.id===pl.new.id ? pl.new : a) : [...x, pl.new]); })
      .on("postgres_changes",{event:"*",schema:"public",table:"tokens"}, (pl)=>{
          if (pl.eventType==="DELETE") setTokens(x=>x.filter(t=>t.id!==pl.old?.id));
          else if (pl.new && pl.new.id) setTokens(x=> x.some(t=>t.id===pl.new.id) ? x.map(t=>t.id===pl.new.id ? pl.new : t) : [...x, pl.new]);
          clearTimeout(tokT.current); tokT.current = setTimeout(loadTokens, 700); })
      .on("postgres_changes",{event:"*",schema:"public",table:"clocks"}, ()=>loadClocks())
      .on("postgres_changes",{event:"*",schema:"public",table:"campaign"}, (pl)=>{ if (pl.new && pl.new.id) setConfig(pl.new.config || null); })
      .on("postgres_changes",{event:"*",schema:"public",table:"audio_state"}, (pl)=>{ if (pl.new && pl.new.id) setAudio(pl.new); })
      .subscribe();
    const onVis = () => { if (document.visibilityState==="visible") loadAll(); };
    document.addEventListener("visibilitychange", onVis);
    /* un orologio nascosto dal master non arriva in tempo reale ai giocatori: ricontrollo ogni tanto */
    const clkT = setInterval(()=>{ if (document.visibilityState==="visible") loadClocks(); }, 30000);
    return ()=>{ sb.removeChannel(ch); document.removeEventListener("visibilitychange", onVis); clearInterval(clkT); };
  },[sb, active, loadAll]);

  return {chars, setChars, party, setParty, maps, members, ready, error, reload:loadAll,
    rolls, addRoll, onNewRoll, combat, setCombat, fighters, secrets, loadFighters,
    pins, loadPins, world, setWorld, handouts, codex, codexSecrets, journal, loadChron, sounds, audio, recipes, loadAudio, spellsCustom, loadSpells, config, setConfig, scenes, setScenes, sceneStates, setSceneStates, tokens, setTokens, loadScenes, loadTokens, areas, setAreas, loadAreas, clocks, setClocks, loadClocks, clocksErr};
}

function useSignedUrls(sb, maps){
  const [urls, setUrls] = useState({});
  const key = JSON.stringify(maps);
  useEffect(()=>{ let off = false;
    (async()=>{ const out = {};
      for (const [plane, path] of Object.entries(maps)){
        const {data} = await sb.storage.from("mappe").createSignedUrl(path, 60*60*12);
        if (data?.signedUrl) out[plane] = data.signedUrl;
      }
      if (!off) setUrls(out); })();
    return ()=>{ off = true; };
  },[sb, key]);
  return urls;
}

/* ---------- orologio di gioco e clima ---------- */
const pad2 = n => String(n).padStart(2,"0");
const fmtTime = m => `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
const dayPart = m => { const h = m/60; return h>=5&&h<7?"Alba":h>=7&&h<12?"Mattina":h>=12&&h<18?"Pomeriggio":h>=18&&h<21?"Sera":"Notte"; };
const isDaytime = m => m >= 360 && m < 1140;

/* pericoli del clima: kind = caldo | freddo | null, più una nota di gioco */
function climate(w){
  if (!w || !CFG.modules.clima) return {kind:null, notes:[]};
  const r = REGION[w.region]; if (!r) return {kind:null, notes:[]};
  const kind = r.climate==="caldo" ? "caldo" : r.climate==="freddo" ? "freddo" : r.climate==="giornonotte" ? (isDaytime(w.minutes) ? "caldo" : "freddo") : null;
  const notes = []; if (r.note) notes.push(r.note);
  const wn = (r.w.find(x=>x[0]===w.weather)||[])[2]; if (wn) notes.push(wn);
  return {kind, notes};
}
const HAZ_LABEL = {caldo:"Caldo estremo", freddo:"Freddo estremo"};
const isProtected = (s, kind, w) => !!((s.hy.gear && s.hy.gear[kind]) || (s.hy.mealProtect === kind && mealActive(s.hy.mealUntil, w)));
const unprotected = (chars, haz, w) => !haz.kind ? [] : chars.filter(c=>!isProtected(norm(c), haz.kind, w));

function WorldStrip({world, chars, me}){
  if (!world) return null;
  const haz = climate(world);
  const mine = chars.filter(c=>c.owner===me.id);
  const exposed = unprotected(mine, haz, world);
  return html`<div className="worldbar"><div className="tb-in">
    <span><b>Giorno ${world.day}</b> · <span className="mono">${fmtTime(world.minutes)}</span> ${dayPart(world.minutes)}</span>
    ${CFG.modules.clima && REGIONS.length>0 && html`<span className="muted">·</span><span>${world.region||"—"}</span><span className="muted">·</span><span>${world.weather}</span>`}
    ${haz.kind && html`<span className="chip bad">${HAZ_LABEL[haz.kind]}: TS Costituzione ogni ora</span>`}
    ${haz.notes.map(n=>html`<span key=${n} className="chip">${n}</span>`)}
    ${exposed.map(c=>html`<span key=${c.id} className="chip bad">${c.name||"Il tuo PG"} non è vestito per il ${haz.kind}</span>`)}
  </div></div>`;
}

/* ---------- orologi di scena (si riempiono durante una scena: crollo, inseguimento, rituale…) ---------- */
function ClockFace({n, f, size=26, label}){
  const r = 10.5, c = 12; const pt = a => `${(c + r*Math.cos(a)).toFixed(3)} ${(c + r*Math.sin(a)).toFixed(3)}`;
  const full = f >= n;
  return html`<svg className=${"clkface"+(full?" full":"")} viewBox="0 0 24 24" width=${size} height=${size} role="img" aria-label=${label || `${f} tacche su ${n}`}>
    ${Array.from({length:n}, (_,i)=>{ const a0 = -Math.PI/2 + i*2*Math.PI/n, a1 = a0 + 2*Math.PI/n;
      return html`<path key=${i} className=${i < f ? "on" : ""} d=${`M${c} ${c} L${pt(a0)} A${r} ${r} 0 0 1 ${pt(a1)} Z`}/>`; })}
    <circle cx=${c} cy=${c} r=${r} className="rim"/></svg>`;
}
function ClocksBar({clocks, me, ops}){
  const M = me.isMaster; const list = clocks.filter(k => M || k.visible);
  if (!list.length) return null;
  return html`<div className="clockbar"><div className="tb-in">
    ${list.map(k => html`<span key=${k.id} className=${"clk"+(k.filled >= k.segments ? " full" : "")+(k.visible ? "" : " hid")} title=${k.note || k.name}>
      <${ClockFace} n=${k.segments} f=${k.filled} label=${`${k.name}: ${k.filled} su ${k.segments}`}/>
      <b>${k.name}</b><span className="mono">${k.filled}/${k.segments}</span>
      ${k.note && html`<span className="muted clk-note">${k.note}</span>`}
      ${!k.visible && html`<span className="chip">nascosto</span>`}
      ${M && ops && html`<button type="button" className="btn small" aria-label=${"Togli una tacca a "+k.name} disabled=${k.filled<=0} onClick=${()=>ops.step(k,-1)}>−</button><button type="button" className="btn small" aria-label=${"Aggiungi una tacca a "+k.name} disabled=${k.filled>=k.segments} onClick=${()=>ops.step(k,1)}>+</button>`}
    </span>`)}
  </div></div>`;
}

    <div className="clk-list">${clocks.map(k => html`<div key=${k.id} className=${"clk-row"+(k.visible?"":" hid")}>

      <div className="clk-main">

        <input className="field" aria-label="Nota (la vedono tutti se l’orologio è visibile)" placeholder="Nota per tutti (es. a 4 tacche l’isola sussulta)" defaultValue=${k.note} key=${"t"+k.note} onBlur=${e=>{ const v = e.target.value.trim().slice(0,200); if (v !== k.note) run(()=>ops.update(k.id, {note:v})); }}/>
        <div className="row" style=${{gap:6,fontSize:".85rem"}}>

          <b className="mono">${k.filled}/${k.segments}</b>

          <label className="row" style=${{gap:4}}>Tacche<select className="field" style=${{width:"auto",padding:"3px 6px"}} value=${k.segments} onChange=${e=>{ const n = Number(e.target.value); run(()=>ops.update(k.id, {segments:n, filled:Math.min(k.filled, n)})); }}>

          <span className="spacer"></span>

        </div></div></div>`)}</div>
    <form className="row" style=${{gap:6,alignItems:"flex-end"}} onSubmit=${async e=>{ e.preventDefault(); if (!form.name.trim()) return; setBusy(true);
