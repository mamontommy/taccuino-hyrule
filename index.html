  <//>`;
}

/* ---------- dati condivisi ---------- */
const rowToChar = (r) => ({...(r.data||{}), id:r.id, owner:r.owner});

function useCampaign(sb, active){
  const [chars, setChars] = useState([]);
  const [party, setParty] = useState(null);
  const [maps, setMaps] = useState({});
  const [members, setMembers] = useState([]);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState("");
  const [rolls, setRolls] = useState([]);
  const [combat, setCombat] = useState({active:false, round:0, turn_id:null});
  const [fighters, setFighters] = useState([]);
  const [secrets, setSecrets] = useState({});
  const [pins, setPins] = useState([]);
  const [world, setWorld] = useState(null);
  const [handouts, setHandouts] = useState([]);
  const [codex, setCodex] = useState([]);
  const [codexSecrets, setCodexSecrets] = useState({});
  const [journal, setJournal] = useState([]);
  const [sounds, setSounds] = useState([]);
  const [audio, setAudio] = useState(null);
  const [recipes, setRecipes] = useState([]);
  const [spellsCustom, setSpellsCustom] = useState([]);
  const loadSpells = useCallback(async()=>{ const {data, error} = await sb.from("spells_custom").select("*"); if (!error) setSpellsCustom(data); },[sb]);
  const onNewRoll = useRef(null);
  const loadAudio = useCallback(async()=>{
    const [s, a, r] = await Promise.all([sb.from("sounds").select("*"), sb.from("audio_state").select("*").eq("id",1).maybeSingle(), sb.from("recipes").select("*")]);
    if (!s.error) setSounds(s.data); if (!a.error && a.data) setAudio(a.data); if (!r.error) setRecipes(r.data);
  },[sb]);
  const loadChron = useCallback(async()=>{
    const [h, c, cs, j] = await Promise.all([sb.from("handouts").select("*"), sb.from("codex").select("*"), sb.from("codex_secrets").select("*"), sb.from("journal").select("*")]);
    if (!h.error) setHandouts(h.data); if (!c.error) setCodex(c.data);
    if (!cs.error) setCodexSecrets(Object.fromEntries(cs.data.map(x=>[x.id,x]))); if (!j.error) setJournal(j.data);
  },[sb]);
  const loadPins = useCallback(async()=>{ const {data, error} = await sb.from("pins").select("*"); if (!error) setPins(data); },[sb]);
  const loadWorld = useCallback(async()=>{ const {data, error} = await sb.from("world").select("*").eq("id",1).maybeSingle(); if (!error && data) setWorld(data); },[sb]);

  const addRoll = useCallback((r)=>{ setRolls(x=> x.some(y=>y.id===r.id) ? x : [r, ...x].slice(0,80)); },[]);
  const loadFighters = useCallback(async()=>{
    const [f, s] = await Promise.all([sb.from("combatants").select("*"), sb.from("combatant_secrets").select("*")]);
    if (!f.error) setFighters(f.data);
    if (!s.error) setSecrets(Object.fromEntries(s.data.map(x=>[x.id,x])));
  },[sb]);

  const loadAll = useCallback(async () => {
    const [c,p,m,mb,r,cb] = await Promise.all([
      sb.from("characters").select("id,owner,data,updated_at"),
      sb.from("party").select("state").eq("id",1).maybeSingle(),
      sb.from("maps").select("plane,path"),
      sb.from("members").select("user_id,name"),
      sb.from("rolls").select("*").order("id",{ascending:false}).limit(60),
      sb.from("combat").select("*").eq("id",1).maybeSingle()]);
    const e = c.error||p.error||m.error||mb.error||r.error||cb.error;
    if (e) setError("Non riesco a leggere i dati del gruppo: "+e.message+(r.error||cb.error?" (hai eseguito fase1.sql?)":""));
    else setError("");
    if (!c.error) setChars(c.data.map(rowToChar));
    if (!p.error) setParty(p.data?.state || null);
    if (!m.error) setMaps(Object.fromEntries(m.data.map(x=>[x.plane,x.path])));
    if (!mb.error) setMembers(mb.data);
    if (!r.error) setRolls(r.data);
    if (!cb.error && cb.data) setCombat(cb.data);
    await Promise.all([loadFighters(), loadPins(), loadWorld(), loadChron(), loadAudio(), loadSpells()]);
    setReady(true);
  },[sb, loadFighters, loadPins, loadWorld, loadChron, loadAudio, loadSpells]);

  useEffect(()=>{ if (!active) return;
    loadAll();
    const ch = sb.channel("taccuino")
      .on("postgres_changes",{event:"*",schema:"public",table:"characters"}, (pl)=>{
        if (pl.eventType==="DELETE") setChars(x=>x.filter(c=>c.id!==pl.old.id));
        else { const n = rowToChar(pl.new); setChars(x=> x.some(c=>c.id===n.id) ? x.map(c=>c.id===n.id?n:c) : [...x,n]); } })
      .on("postgres_changes",{event:"*",schema:"public",table:"party"}, (pl)=>{ if (pl.new) setParty(pl.new.state||null); })
      .on("postgres_changes",{event:"*",schema:"public",table:"maps"}, ()=>{ sb.from("maps").select("plane,path").then(({data})=>data && setMaps(Object.fromEntries(data.map(x=>[x.plane,x.path])))); })
      .on("postgres_changes",{event:"*",schema:"public",table:"members"}, ()=>{ sb.from("members").select("user_id,name").then(({data})=>data && setMembers(data)); })
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"rolls"}, (pl)=>{ addRoll(pl.new); onNewRoll.current && onNewRoll.current(pl.new); })
      .on("postgres_changes",{event:"*",schema:"public",table:"combat"}, (pl)=>{ if (pl.new && pl.new.id) setCombat(pl.new); })
      .on("postgres_changes",{event:"*",schema:"public",table:"combatants"}, ()=>loadFighters())
      .on("postgres_changes",{event:"*",schema:"public",table:"combatant_secrets"}, ()=>loadFighters())
      .on("postgres_changes",{event:"*",schema:"public",table:"pins"}, ()=>loadPins())
      .on("postgres_changes",{event:"*",schema:"public",table:"world"}, (pl)=>{ if (pl.new && pl.new.id) setWorld(pl.new); })
      .on("postgres_changes",{event:"*",schema:"public",table:"handouts"}, ()=>loadChron())
      .on("postgres_changes",{event:"*",schema:"public",table:"codex"}, ()=>loadChron())
      .on("postgres_changes",{event:"*",schema:"public",table:"codex_secrets"}, ()=>loadChron())
      .on("postgres_changes",{event:"*",schema:"public",table:"journal"}, ()=>loadChron())
      .on("postgres_changes",{event:"*",schema:"public",table:"sounds"}, ()=>loadAudio())
      .on("postgres_changes",{event:"*",schema:"public",table:"recipes"}, ()=>loadAudio())
      .on("postgres_changes",{event:"*",schema:"public",table:"spells_custom"}, ()=>loadSpells())
      .on("postgres_changes",{event:"*",schema:"public",table:"audio_state"}, (pl)=>{ if (pl.new && pl.new.id) setAudio(pl.new); })
      .subscribe();
    const onVis = () => { if (document.visibilityState==="visible") loadAll(); };
    document.addEventListener("visibilitychange", onVis);
    return ()=>{ sb.removeChannel(ch); document.removeEventListener("visibilitychange", onVis); };
  },[sb, active, loadAll]);

  return {chars, setChars, party, setParty, maps, members, ready, error, reload:loadAll,
    rolls, addRoll, onNewRoll, combat, setCombat, fighters, secrets, loadFighters,
    pins, loadPins, world, setWorld, handouts, codex, codexSecrets, journal, loadChron, sounds, audio, recipes, loadAudio, spellsCustom, loadSpells};
}

function useSignedUrls(sb, maps){
  const [urls, setUrls] = useState({});
  const key = JSON.stringify(maps);
  useEffect(()=>{ let off = false;
    (async()=>{ const out = {};
      for (const [plane, path] of Object.entries(maps)){
        const {data} = await sb.storage.from("mappe").createSignedUrl(path, 60*60*12);
        if (data?.signedUrl) out[plane] = data.signedUrl;
      }
      if (!off) setUrls(out); })();
    return ()=>{ off = true; };
  },[sb, key]);
  return urls;
}

/* ---------- orologio di gioco e clima ---------- */
const REGIONS = [
  {k:"Hyrule Centrale", w:[["Sereno",4],["Nuvoloso",3],["Pioggia",2],["Foschia della Tenebra",1]]},
  {k:"Necluda",         w:[["Sereno",5],["Nuvoloso",3],["Pioggia",2]]},
  {k:"Faron",           w:[["Afa",3],["Pioggia",3],["Temporale",3]]},
  {k:"Lanayru",         w:[["Pioggia",4],["Nuvoloso",3],["Sereno",2]]},
  {k:"Eldin",           w:[["Calore estremo",5],["Pioggia di cenere",2]]},
  {k:"Akkala",          w:[["Sereno",4],["Vento d’autunno",3],["Pioggia",2]]},
  {k:"Hebra",           w:[["Freddo estremo",4],["Bufera di neve",3]]},
  {k:"Gerudo",          w:[["Sereno",5],["Tempesta di sabbia",2]]},
  {k:"Grande Foresta",  w:[["Nebbia fitta",5],["Pioggia",2]]},
  {k:"Isole Celesti",   w:[["Sereno",3],["Venti forti",4],["Nubi basse",2]]},
  {k:"Sottosuolo",      w:[["Buio totale",1]]},
];
const REGION = Object.fromEntries(REGIONS.map(r=>[r.k,r]));
const pad2 = n => String(n).padStart(2,"0");
const fmtTime = m => `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
const dayPart = m => { const h = m/60; return h>=5&&h<7?"Alba":h>=7&&h<12?"Mattina":h>=12&&h<18?"Pomeriggio":h>=18&&h<21?"Sera":"Notte"; };
const isDaytime = m => m >= 360 && m < 1140;

/* pericoli del clima: kind = caldo | freddo | null, più una nota di gioco */
function climate(w){
  if (!w) return {kind:null, notes:[]};
  const notes = []; let kind = null;
  if (w.region==="Eldin"){ kind="caldo"; notes.push("Oggetti infiammabili a rischio"); }
  if (w.region==="Hebra"){ kind="freddo"; if (w.weather==="Bufera di neve") notes.push("Rischio valanghe"); }
  if (w.region==="Gerudo"){ kind = isDaytime(w.minutes) ? "caldo" : "freddo"; }
  if (w.region==="Faron" && w.weather==="Temporale") notes.push("Fulmini: attenzione alle armature di metallo");
  if (w.region==="Lanayru" && w.weather==="Pioggia") notes.push("Pareti scivolose");
  if (w.region==="Grande Foresta" && w.weather==="Nebbia fitta") notes.push("La nebbia disorienta");
  if (w.region==="Isole Celesti" && w.weather==="Venti forti") notes.push("Venti forti: attenzione ai bordi");
  if (w.region==="Hyrule Centrale" && w.weather==="Foschia della Tenebra") notes.push("La Tenebra si addensa");
  if (w.region==="Sottosuolo") notes.push("Buio totale: servono luce o scurovisione");
  return {kind, notes};
}
const HAZ_LABEL = {caldo:"Caldo estremo", freddo:"Freddo estremo"};
const isProtected = (s, kind, w) => !!((s.hy.gear && s.hy.gear[kind]) || (s.hy.mealProtect === kind && mealActive(s.hy.mealUntil, w)));
const unprotected = (chars, haz, w) => !haz.kind ? [] : chars.filter(c=>!isProtected(norm(c), haz.kind, w));

function WorldStrip({world, chars, me}){
  if (!world) return null;
  const haz = climate(world);
  const mine = chars.filter(c=>c.owner===me.id);
  const exposed = unprotected(mine, haz, world);
  return html`<div className="worldbar"><div className="tb-in">

      <label className="lab" style=${{width:90}}>Giorno<${Num} id="w-day" value=${world.day} min=${1} onChange=${v=>save({day:v})}/></label>

      <button className="btn small" style=${{alignSelf:"end"}}>Imposta</button>
    </form>
    <div className="row">
      <label className="lab" style=${{flex:"1 1 160px"}}>Regione<select id="w-region" className="field" value=${world.region} onChange=${e=>{ const r=e.target.value; save({region:r, weather:rollWeather(r)}); }}>
        ${REGIONS.map(r=>html`<option key=${r.k} value=${r.k}>${r.k}</option>`)}</select></label>
      <label className="lab" style=${{flex:"1 1 160px"}}>Meteo<select id="w-weather" className="field" value=${world.weather} onChange=${e=>save({weather:e.target.value})}>
        ${[...new Set([...(REGION[world.region]?.w||[]).map(x=>x[0]), world.weather])].map(w=>html`<option key=${w} value=${w}>${w}</option>`)}</select></label>
      <button type="button" className="btn small" style=${{alignSelf:"end"}} onClick=${()=>save({weather:rollWeather(world.region)})}>Tira il meteo</button>

    ${haz.kind && html`<p className="muted" style=${{margin:0,fontSize:".88rem"}}>${exposed.length ? "Senza abbigliamento adatto: "+exposed.map(c=>c.name||"PG").join(", ")+". Tiro salvezza su Costituzione ogni ora; chi è vestito bene ha vantaggio." : "Tutto il gruppo è vestito per il "+haz.kind+": vantaggio ai tiri salvezza contro il clima."}</p>`}

/* ---------- backup ---------- */
function BackupPanel({sb, camp}){
  const [msg, setMsg] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const [pending, setPending] = useState(null); const fileIn = useRef(null);
  const download = async () => { setErr(""); setMsg(""); setBusy(true);
    try {
      const q = async (t, sel="*") => { const {data, error} = await sb.from(t).select(sel); if (error) throw new Error(t+": "+error.message); return data; };
      const [characters, party, maps, pins, world, members, handouts, codex, codex_secrets, journal, recipes, sounds, spells_custom] = await Promise.all([
        q("characters","id,owner,data,updated_at"), q("party","state"), q("maps","plane,path"), q("pins"), q("world"), q("members","user_id,name"),
        q("handouts"), q("codex"), q("codex_secrets"), q("journal"), q("recipes"), q("sounds"), q("spells_custom")]);
      const backup = {app:"taccuino-hyrule", version:3, exported_at:new Date().toISOString(),
        characters, party: party[0]?.state || null, maps, pins, world: world[0] || null, members, handouts, codex, codex_secrets, journal, recipes, sounds, spells_custom};
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
      const d = new Date(); const name = `taccuino-backup-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      setMsg(`Backup scaricato: ${characters.length} schede, ${pins.length} segnaposti, ${codex.length} voci del codex, ${journal.length} sessioni del diario, ${handouts.length} handout, ${spells_custom.length} incantesimi del gruppo.`);
    } catch(e){ setErr("Backup non riuscito: "+e.message); }
    setBusy(false); };
  const readFile = async (file) => { setErr(""); setMsg(""); setPending(null); if (!file) return;
    try { const b = JSON.parse(await file.text()); if (b.app!=="taccuino-hyrule" || !Array.isArray(b.characters)) throw new Error("non è un backup del Taccuino");
      setPending({b, name:file.name}); }
    catch(e){ setErr("File non valido: "+e.message); }
    if (fileIn.current) fileIn.current.value = ""; };
  const restore = async () => { const b = pending.b; setBusy(true); setErr(""); setMsg(""); const problems = [];
    let okChars = 0;
    for (const c of b.characters){
      let r = await sb.from("characters").upsert({id:c.id, owner:c.owner, data:c.data, updated_at:c.updated_at||new Date().toISOString()});
      if (r.error && c.owner){ r = await sb.from("characters").upsert({id:c.id, owner:null, data:c.data}); if (!r.error) problems.push(`${c.data?.name||"una scheda"} è tornata senza proprietario (account non trovato)`); }
      if (r.error) problems.push(`${c.data?.name||"una scheda"}: ${r.error.message}`); else okChars++;
    }
    if (Array.isArray(b.pins) && b.pins.length){ const {error} = await sb.from("pins").upsert(b.pins.map(p=>({...p, created_by:p.created_by||null})));
      if (error){ const {error:e2} = await sb.from("pins").upsert(b.pins.map(p=>({...p, created_by:null}))); if (e2) problems.push("segnaposti: "+e2.message); } }
    if (b.party !== undefined){ const {error} = await sb.from("party").update({state:b.party}).eq("id",1); if (error) problems.push("posizione: "+error.message); }
    if (b.world){ const {day, minutes, region, weather} = b.world; const {error} = await sb.from("world").update({day, minutes, region, weather}).eq("id",1); if (error) problems.push("orologio: "+error.message); }
    if (Array.isArray(b.maps) && b.maps.length){ const {error} = await sb.from("maps").upsert(b.maps); if (error) problems.push("mappe: "+error.message); }
    const up = async (table, rows, label, fix) => { if (!Array.isArray(rows) || !rows.length) return;
      let {error} = await sb.from(table).upsert(rows); if (error && fix){ ({error} = await sb.from(table).upsert(rows.map(fix))); }
      if (error) problems.push(label+": "+error.message); };
    await up("handouts", b.handouts, "handout");
    await up("codex", b.codex, "codex");
    await up("codex_secrets", b.codex_secrets, "note segrete del codex");
    await up("journal", b.journal, "diario", r=>({...r, author:null}));
    await up("recipes", b.recipes, "ricettario");
    await up("sounds", b.sounds, "suoni");
    await up("spells_custom", b.spells_custom, "incantesimi del gruppo", r=>({...r, created_by:null}));
    await camp.reload(); setBusy(false); setPending(null);
    setMsg(`Ripristinate ${okChars} schede su ${b.characters.length}.` + (problems.length ? " Attenzione: "+problems.join("; ")+"." : ""));
  };
  return html`<section className="panel">
    <div className="panel-h"><h3>Backup</h3></div>
    <p className="muted" style=${{margin:0,fontSize:".88rem"}}>Salva sul tuo computer schede, posizione del gruppo, segnaposti, orologio, codex, diario, handout, ricettario, incantesimi aggiunti dal gruppo ed elenco dei suoni. Fallo prima di ogni aggiornamento importante. Immagini e file audio restano su Supabase e non sono nel file.</p>
    <div className="row">
      <button type="button" className="btn primary" disabled=${busy} onClick=${download}>Scarica backup</button>
      <button type="button" className="btn" disabled=${busy} onClick=${()=>fileIn.current?.click()}>Ripristina da file…</button>
      <input ref=${fileIn} id="bk-file" type="file" accept="application/json,.json" hidden onChange=${e=>readFile(e.target.files[0])}/>
    </div>
    ${pending && html`<div className="confirm" style=${{display:"grid",gap:8}}>
      <span><b>${pending.name}</b> del ${new Date(pending.b.exported_at).toLocaleString("it")}: ${pending.b.characters.length} schede, ${(pending.b.pins||[]).length} segnaposti. Il ripristino sovrascrive le schede con lo stesso identificativo e la posizione del gruppo; quelle nuove create dopo il backup restano.</span>
      <span className="row"><button type="button" className="btn small danger" disabled=${busy} onClick=${restore}>${busy?"Ripristino…":"Ripristina"}</button><button type="button" className="btn small" onClick=${()=>setPending(null)}>Annulla</button></span>
    </div>`}
    ${err && html`<p className="err" role="alert">${err}</p>`}
    ${msg && html`<p className="muted" role="status" style=${{margin:0}}>${msg}</p>`}
  </section>`;
}

function useHandoutUrls(sb, handouts){
  const [urls, setUrls] = useState({});
  const key = handouts.filter(h=>h.image_path).map(h=>h.id+":"+h.image_path+":"+h.revealed).join("|");
  useEffect(()=>{ let off = false;
    (async()=>{ const out = {};
      for (const h of handouts.filter(h=>h.image_path)){
        const {data} = await sb.storage.from("handouts").createSignedUrl(h.image_path, 60*60*12);
        if (data?.signedUrl) out[h.id] = data.signedUrl;
      }
      if (!off) setUrls(out); })();
    return ()=>{ off = true; };
  },[sb, key]);
  return urls;
}

function JournalTab({sb, me, journal, names, world, reload}){
  const M = me.isMaster;

  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false); const [confirmDel, setConfirmDel] = useState(false);
  const list = [...journal].sort((a,b)=> (b.session_no??0)-(a.session_no??0) || b.created_at.localeCompare(a.created_at));
  const nextNo = (journal.reduce((m,j)=>Math.max(m, j.session_no||0), 0)) + 1;
  const today = new Date().toISOString().slice(0,10);
  const save = async (f) => { setBusy(true); setErr("");
    const row = {session_no:f.session_no||null, title:f.title.trim(), played_on:f.played_on||null, body:f.body, visible:f.visible, updated_at:new Date().toISOString()};
    const r = f.id ? await sb.from("journal").update(row).eq("id", f.id).select("id") : await sb.from("journal").insert({...row, author:me.id}).select("id");
    setBusy(false);
    if (r.error || !r.data?.length) { setErr("Non salvato"+(r.error?": "+r.error.message:": puoi modificare solo le voci che hai scritto tu.")); return; }
    setEditing(null); setOpenId(r.data[0].id); reload(); };
  const del = async (j) => { const {error} = await sb.from("journal").delete().eq("id", j.id); if (error) setErr(error.message); setConfirmDel(false); setOpenId(null); reload(); };
  const open = journal.find(j=>j.id===openId);

  if (editing) return html`<form className="panel" onSubmit=${e=>{e.preventDefault(); save(editing);}}>
    <h3>${editing.id ? "Modifica la voce" : "Nuova voce del diario"}</h3>

      <label className="lab" style=${{flex:"0 0 110px"}}>Sessione n.<${Num} id="jr-no" value=${editing.session_no||0} min=${0} onChange=${v=>setEditing(x=>({...x,session_no:v}))}/></label>
      <label className="lab" style=${{flex:"0 0 170px"}}>Giocata il<input id="jr-date" type="date" className="field" value=${editing.played_on||""} onChange=${e=>setEditing({...editing,played_on:e.target.value})}/></label>
      <label className="lab grow">Titolo<input id="jr-title" className="field" value=${editing.title} placeholder="es. L’isola caduta" onChange=${e=>setEditing({...editing,title:e.target.value})}/></label>
    </div>
    <label className="lab">Cosa è successo<textarea id="jr-body" className="field" style=${{minHeight:260}} value=${editing.body} placeholder="Racconta la sessione: dove siete andati, chi avete incontrato, cosa avete scoperto, cosa resta in sospeso." onChange=${e=>setEditing({...editing,body:e.target.value})}></textarea></label>
    ${M && html`<label className="row" style=${{gap:6}}><input id="jr-vis" type="checkbox" checked=${editing.visible} onChange=${e=>setEditing({...editing,visible:e.target.checked})}/>Visibile al gruppo (togli la spunta per tenerla come bozza)</label>`}
    <div className="row"><span className="spacer"></span><button type="button" className="btn" onClick=${()=>setEditing(null)}>Annulla</button><button className="btn primary" disabled=${busy}>Salva</button></div>
    ${err && html`<p className="err" role="alert">${err}</p>`}
  </form>`;

  return html`<div className="jr-layout">
    <aside className="jr-list">
      <button type="button" className="btn primary" onClick=${()=>setEditing({session_no:nextNo, played_on:today, title:"", body:"", visible:true})}>+ Scrivi la sessione ${nextNo}</button>
      ${list.length===0 && html`<p className="muted">Il diario è vuoto. Dopo ogni sessione, il master o un giocatore a turno racconta cosa è successo.</p>`}
      ${list.map(j=>html`<button type="button" key=${j.id} className="jr-item" aria-current=${j.id===openId} onClick=${()=>{ setOpenId(j.id); setConfirmDel(false); }}>
        <span className="eyebrow">${j.session_no?"Sessione "+j.session_no:"Senza numero"}${j.played_on?" · "+fmtDate(j.played_on):""}${!j.visible?" · bozza":""}</span>
        <b>${j.title || "Senza titolo"}</b><span className="muted" style=${{fontSize:".82rem"}}>di ${names[j.author]||"qualcuno"}</span></button>`)}
    </aside>
    <section className="panel jr-read">
      ${!open ? html`<p className="muted" style=${{margin:0}}>${list.length ? "Scegli una sessione dall’elenco per leggerla." : "Qui comparirà il racconto delle vostre sessioni."}</p>`
      : html`<div className="eyebrow">${open.session_no?"Sessione "+open.session_no:""}${open.played_on?" · "+fmtDate(open.played_on):""} · scritta da ${names[open.author]||"qualcuno"}</div>
        <h2>${open.title || "Senza titolo"}</h2>

        ${canEdit(open) && html`<div className="row"><button type="button" className="btn small" onClick=${()=>setEditing({...open})}>Modifica</button><span className="spacer"></span>

const SPELL_SCHOOLS = ["Abiurazione","Ammaliamento","Divinazione","Evocazione","Illusione","Invocazione","Necromanzia","Trasmutazione"];
const SPELL_CLASSES = ["Bardo","Chierico","Druido","Mago","Paladino","Ranger","Stregone","Warlock"];
const SRD_NOTE = "Questo lavoro include materiale tratto dal System Reference Document 5.2 (“SRD 5.2”) di Wizards of the Coast LLC, disponibile su https://www.dndbeyond.com/srd. L’SRD 5.2 è concesso in licenza Creative Commons Attribuzione 4.0 Internazionale (https://creativecommons.org/licenses/by/4.0/legalcode). Testi tradotti in italiano e adattati (unità in metri) per il Taccuino.";
const SpellsCtx = React.createContext(null);
let SRD_CACHE = null, SRD_PROMISE = null;
function loadSrd(){
  if (!SRD_PROMISE) SRD_PROMISE = fetch("spells.json").then(r=>{ if (!r.ok) throw new Error("errore "+r.status); return r.json(); })
    .then(j=>(SRD_CACHE = Array.isArray(j) ? j : j.spells)).catch(e=>{ SRD_PROMISE = null; throw e; });
  return SRD_PROMISE;
}
const fold = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`]/g,"'").toLowerCase().replace(/\s+/g," ").trim();
const spellLevelLabel = (s) => s.level===0 ? `Trucchetto${s.school?" di "+s.school:""}` : `${s.school||"Incantesimo"} di ${s.level}° livello`;
const spellSummary = (s) => [String(s.casting||"").split(",")[0], s.range, String(s.duration||"").replace(/^Concentrazione, f/,"F")].filter(Boolean).join(" · ");

function useSpellBook(customRows){
  const [srd, setSrd] = useState(SRD_CACHE); const [err, setErr] = useState("");
  useEffect(()=>{ if (srd) return; let off = false;
    loadSrd().then(x=>{ if (!off) setSrd(x); }).catch(e=>{ if (!off) setErr("Compendio non disponibile: "+e.message); });
    return ()=>{ off = true; }; },[]);
  return useMemo(()=>{
    const base = (srd||[]).map(s=>({...s, key:s.idx, f:fold(s.name), fe:fold(s.name_en)}));
    const custom = (customRows||[]).map(s=>({...s, key:"c:"+s.id, custom:true, f:fold(s.name), fe:""}));
    const all = [...base, ...custom].sort((a,b)=>a.level-b.level || a.name.localeCompare(b.name,"it"));
    const byKey = new Map(all.map(s=>[s.key,s])); const byName = new Map();
    for (const s of [...base, ...custom]){ if (s.fe) byName.set(s.fe, s); byName.set(s.f, s); }
    const find = (x) => (x && ((x.ref && byKey.get(x.ref)) || byName.get(fold(x.name)))) || null;
    const search = (q, n=8) => { const t = fold(q); if (!t) return [];
      const score = s => s.f.startsWith(t) ? 0 : s.f.includes(" "+t) ? 1 : s.fe.startsWith(t) ? 2 : s.f.includes(t) ? 3 : s.fe.includes(t) ? 4 : 9;
      return all.map(s=>[score(s),s]).filter(([k])=>k<9).sort((a,b)=>a[0]-b[0] || a[1].name.localeCompare(b[1].name,"it")).slice(0,n).map(x=>x[1]); };
    return {all, find, search, byKey, ready: !!srd, err};
  },[srd, customRows, err]);
}

function SpellBody({s, names}){
  const comp = s.components + (s.material ? ` (${s.material})` : "");
  const para = (t, i) => { const m = /^([A-ZÀ-Ý0-9][^.:]{1,38})([.:]) (.+)$/s.exec(t);
    return i>0 && m && m[1].split(" ").length<=4 && m[1].length<=32 ? html`<p key=${i}><b>${m[1]}${m[2]}</b> ${m[3]}</p>` : html`<p key=${i}>${t}</p>`; };
  return html`<div className="sp-body">
    <div className="eyebrow">${spellLevelLabel(s)}${s.ritual?" (rituale)":""}</div>
    <dl className="sp-meta">
      <div><dt>Tempo di lancio</dt><dd>${s.casting||"—"}</dd></div>
      <div><dt>Gittata</dt><dd>${s.range||"—"}</dd></div>
      <div><dt>Componenti</dt><dd>${comp||"—"}</dd></div>
      <div><dt>Durata</dt><dd>${s.duration||"—"}</dd></div>
    </dl>
    <div className="sp-desc">${String(s.description||"").split("\n").filter(Boolean).map(para)}</div>
    ${s.higher && html`<div className="sp-desc">${s.level===0 ? String(s.higher).split("\n").map((t,k)=>para(t,k+1)) : html`<p><b>Usando uno slot di livello superiore.</b> ${s.higher}</p>`}</div>`}
    <div className="sp-foot">${s.classes?.length ? html`<span>Classi: ${s.classes.join(", ")}</span>` : null}
      <span className="muted">${s.custom ? "Aggiunto dal gruppo"+(names?.[s.created_by] ? " · "+names[s.created_by] : "") : "SRD 5.2 · CC BY 4.0"}</span></div>
  </div>`;
}

function SpellModal({s, onClose, names, children}){
  useEffect(()=>{ const k = e => { if (e.key==="Escape") onClose(); }; window.addEventListener("keydown", k); return ()=>window.removeEventListener("keydown", k); },[]);
  return ReactDOM.createPortal(html`<div className="modal-back" role="dialog" aria-modal="true" aria-label=${s.name} onClick=${e=>{ if (e.target===e.currentTarget) onClose(); }}>
    <div className="modal sp-modal">
      <div className="row" style=${{alignItems:"baseline"}}><h2 style=${{flex:"1 1 auto",margin:0}}>${s.name}</h2>
        ${s.name_en && html`<span className="muted" style=${{fontSize:".85rem"}}>${s.name_en}</span>`}</div>
      <${SpellBody} s=${s} names=${names}/>
      <div className="row">${children}<span className="spacer"></span><button type="button" className="btn primary" onClick=${onClose} autoFocus>Chiudi</button></div>
    </div></div>`, document.body);
}

const canHover = () => { try { return window.matchMedia("(hover: hover) and (pointer: fine)").matches; } catch(e){ return false; } };

function SpellName({x, ro, onType, onPick}){
  const book = useContext(SpellsCtx);
  const [open, setOpen] = useState(false); const [hi, setHi] = useState(0);
  const [pop, setPop] = useState(null); const [modal, setModal] = useState(false);
  const wrap = useRef(null); const inp = useRef(null); const tm = useRef(0);
  const match = book ? book.find(x) : null;
  const rawSugg = !ro && open && book && x.name.trim().length>=2 ? book.search(x.name, 8) : [];
  const sugg = (rawSugg.length===1 && match && rawSugg[0].key===match.key && fold(x.name)===rawSugg[0].f) ? [] : rawSugg;
  const pick = (s) => { onPick(s); setOpen(false); };
  const showPop = () => { clearTimeout(tm.current);
    tm.current = setTimeout(()=>{ if (!wrap.current || document.activeElement===inp.current) return;
      const r = wrap.current.getBoundingClientRect(); const w = Math.min(440, window.innerWidth-32);
      const left = Math.max(16, Math.min(r.left, window.innerWidth - w - 16));
      const below = window.innerHeight - r.bottom > 320 || r.top < window.innerHeight/2;
      setPop(below ? {left, top:r.bottom+6, w} : {left, bottom:window.innerHeight - r.top + 6, w}); }, 350); };
  const hidePop = () => { clearTimeout(tm.current); tm.current = setTimeout(()=>setPop(null), 180); };
  useEffect(()=>()=>clearTimeout(tm.current),[]);
  const onKey = (e) => {
    if (!sugg.length) return;
    if (e.key==="ArrowDown"){ e.preventDefault(); setHi(h=>(h+1)%sugg.length); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); setHi(h=>(h-1+sugg.length)%sugg.length); }
    else if (e.key==="Enter"){ e.preventDefault(); pick(sugg[Math.min(hi, sugg.length-1)]); }
    else if (e.key==="Escape"){ setOpen(false); } };
  const lid = "sp-sug-"+x.id;
  return html`<div className="sp-name" ref=${wrap} onMouseEnter=${()=>{ if (match && canHover()) showPop(); }} onMouseLeave=${hidePop}>
    <input ref=${inp} id=${"sp-n-"+x.id} className="field" value=${x.name||""} placeholder="Incantesimo (scrivi per cercare)" aria-label="Nome incantesimo"
      role="combobox" aria-expanded=${sugg.length>0} aria-controls=${lid} aria-autocomplete="list" autoComplete="off"
      onFocus=${()=>{ setOpen(true); setPop(null); }} onBlur=${()=>setTimeout(()=>setOpen(false),120)} onKeyDown=${onKey}
      onChange=${e=>{ onType(e.target.value); setOpen(true); setHi(0); }}/>
    ${match && html`<span role="button" tabIndex="0" className="sp-info" title="Cosa fa" aria-label=${"Descrizione di "+match.name}
      onClick=${()=>{ setPop(null); setModal(true); }} onKeyDown=${e=>{ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); setModal(true); } }}>i</span>`}
    ${sugg.length>0 && html`<ul className="sp-sug" id=${lid} role="listbox">${sugg.map((s,k)=>html`<li key=${s.key} role="option" aria-selected=${k===hi}
      onMouseDown=${e=>{ e.preventDefault(); pick(s); }} onMouseEnter=${()=>setHi(k)}>
      <span className="sp-lv">${s.level===0?"T":s.level}</span><span className="sp-sn"><b>${s.name}</b><span className="muted">${s.custom?"homebrew":s.name_en} · ${s.school}</span></span></li>`)}</ul>`}
    ${pop && match && ReactDOM.createPortal(html`<div className="sp-pop" style=${{left:pop.left, top:pop.top, bottom:pop.bottom, width:pop.w}}
      onMouseEnter=${()=>clearTimeout(tm.current)} onMouseLeave=${hidePop}>
      <h3 style=${{margin:0}}>${match.name}</h3><${SpellBody} s=${match}/></div>`, document.body)}
    ${modal && match && html`<${SpellModal} s=${match} onClose=${()=>setModal(false)}/>`}
  </div>`;
}

const SILENT_WAV = "data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
function fadeVol(el, from, to, ms, done){
  const t0 = performance.now(); el.volume = Math.max(0, Math.min(1, from));
  const step = (t) => { const k = Math.min(1, (t - t0) / ms); el.volume = Math.max(0, Math.min(1, from + (to - from) * k));
    if (k < 1) requestAnimationFrame(step); else if (done) done(); };
  requestAnimationFrame(step);
}

/* ---------- YouTube ---------- */
function parseYtTime(s){ if (!s) return 0; if (/^\d+$/.test(s)) return Number(s);
  const m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(s); return m ? (Number(m[1]||0)*3600 + Number(m[2]||0)*60 + Number(m[3]||0)) : 0; }
function parseYtLink(input){
  const u = String(input||"").trim(); if (!u) return null;
  if (/^[\w-]{11}$/.test(u)) return {v:u};
  let url; try { url = new URL(/^https?:\/\//i.test(u) ? u : "https://"+u); } catch(e){ return null; }
  const host = url.hostname.replace(/^www\.|^m\.|^music\./,"");
  if (!["youtube.com","youtu.be","youtube-nocookie.com"].includes(host)) return null;
  let v = "";
  if (host==="youtu.be") v = url.pathname.slice(1).split("/")[0];
  else { const m = /^\/(?:shorts|embed|live|v)\/([\w-]{11})/.exec(url.pathname); v = m ? m[1] : (url.searchParams.get("v")||""); }
  if (v && !/^[\w-]{11}$/.test(v)) v = "";
  const list = (url.searchParams.get("list")||"").replace(/[^\w-]/g,"");
  const t = parseYtTime(url.searchParams.get("t") || url.searchParams.get("start") || "");
  if (!v && !list) return null;
  const out = {}; if (v) out.v = v; if (list) out.list = list; if (t) out.t = t; return out;
}
const ytToString = (p) => new URLSearchParams(Object.entries(p).map(([k,v])=>[k,String(v)])).toString();
const ytRead = (s) => { const q = new URLSearchParams(s||""); return {v:q.get("v")||"", list:q.get("list")||"", t:Number(q.get("t")||0)}; };
const ytWatchUrl = (s) => { const p = ytRead(s); return p.v ? `https://www.youtube.com/watch?v=${p.v}${p.list?"&list="+p.list:""}` : `https://www.youtube.com/playlist?list=${p.list}`; };

let YT_PROMISE = null;
function loadYT(){
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (!YT_PROMISE) YT_PROMISE = new Promise((res, rej) => {
    const fail = (e) => { YT_PROMISE = null; rej(e); };
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch(e){} res(window.YT); };
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.async = true;
    s.onerror = () => fail(new Error("rete")); document.head.appendChild(s);
    setTimeout(()=>{ if (!(window.YT && window.YT.Player)) fail(new Error("tempo scaduto")); }, 20000);
  });
  return YT_PROMISE;
}

/* Riquadro di YouTube: deve restare visibile (regole di YouTube), almeno 200×200. */
function YtPlayer({sound, level, startedAt, stopping, onStopped, onStatus}){
  const host = useRef(null); const api = useRef(null); const lv = useRef(level);
  const [msg, setMsg] = useState(""); const [side, setSide] = useState(()=>lsGet("ytSide","right"));
  useEffect(()=>lsSet("ytSide", side),[side]);
  useEffect(()=>{
    let dead = false, p = null, started = false, timer = 0, fadeT = 0, cur = 0;
    const prm = ytRead(sound.youtube);
    const setV = (v) => { cur = Math.max(0, Math.min(1, v)); try { p && p.setVolume(Math.round(cur*100)); } catch(e){} };
    const fade = (to, ms, done) => { clearInterval(fadeT); const from = cur, t0 = Date.now();
      fadeT = setInterval(()=>{ const k = Math.min(1, (Date.now()-t0)/ms); setV(from + (to-from)*k); if (k>=1){ clearInterval(fadeT); if (done) done(); } }, 60); };
    api.current = { fade, setV, playing: () => started };
    loadYT().then(YT => {
      if (dead || !host.current) return;
      const div = document.createElement("div"); host.current.innerHTML = ""; host.current.appendChild(div);
      const vars = {autoplay:1, playsinline:1, rel:0, modestbranding:1, start:prm.t||0};
      if (prm.list){ vars.listType = "playlist"; vars.list = prm.list; }
      p = new YT.Player(div, {width:"100%", height:"100%", videoId: prm.v || undefined, playerVars: vars, events:{
        onReady: (e) => { if (dead) return; setV(0); try { e.target.playVideo(); } catch(x){}
          timer = setTimeout(()=>{ if (!started && !dead){ setMsg("Tocca ▶ qui sopra per far partire l’audio su questo dispositivo."); onStatus && onStatus("attesa"); } }, 3500); },
        onStateChange: (e) => {
          if (e.data === 1){
            if (!started){ started = true; setMsg(""); onStatus && onStatus("ok");
              if (prm.list) try { p.setLoop(true); } catch(x){}
              const el = startedAt ? (Date.now() - Date.parse(startedAt))/1000 : 0; const dur = p.getDuration ? p.getDuration() : 0;
              if (!prm.list && el > 8 && dur > 30) p.seekTo(((prm.t||0) + el) % dur, true);
              fade(lv.current, 1500); }
          }
          if (e.data === 0 && !prm.list){ p.seekTo(prm.t||0, true); p.playVideo(); }
        },
        onError: (e) => { const c = e.data;
          setMsg(c===101||c===150 ? "Il proprietario di questo video non permette di riprodurlo fuori da YouTube: scegline un altro."
            : c===100 ? "Video non trovato, privato o rimosso." : "YouTube non riesce a riprodurre questo link.");
          onStatus && onStatus("errore"); } }});
    }).catch(()=>{ if (!dead){ setMsg("Non riesco a caricare YouTube: controlla la connessione."); onStatus && onStatus("errore"); } });
    return () => { dead = true; clearTimeout(timer); clearInterval(fadeT); try { p && p.destroy(); } catch(e){} api.current = null; };
  },[sound.id, sound.youtube]);
  useEffect(()=>{ lv.current = level; if (api.current && api.current.playing()) api.current.setV(level); },[level]);
  useEffect(()=>{ if (!stopping) return; if (api.current && api.current.playing()) api.current.fade(0, 1200, onStopped); else onStopped(); },[stopping]);
  return ReactDOM.createPortal(html`<div className=${"ytbox "+side} role="region" aria-label="Sottofondo da YouTube">
    <div className="ytbar"><span className="ytname" title=${sound.name}>♪ ${sound.name}</span>
      <button type="button" className="iconbtn" title="Sposta dall’altra parte" aria-label="Sposta il riquadro" onClick=${()=>setSide(side==="right"?"left":"right")}>⇄</button></div>
    <div className="ytframe" ref=${host}></div>
    ${msg && html`<p className="ytmsg">${msg}</p>`}
  </div>`, document.body);
}

function AudioControl({sb, me, sounds, audio, world}){
  const [enabled, setEnabled] = useState(false);
  const [vol, setVol] = useState(()=>lsGet("vol", 0.7));
  const [muted, setMuted] = useState(()=>lsGet("muted", false));
  const [open, setOpen] = useState(false);
  const [err, setErr] = useState("");
  const cur = useRef({el:null, id:null}); const token = useRef(0); const cache = useRef({}); const lastFx = useRef(null);
  const [yt, setYt] = useState(null); const [ytStatus, setYtStatus] = useState("");
  useEffect(()=>lsSet("vol",vol),[vol]); useEffect(()=>lsSet("muted",muted),[muted]);
  const box = useRef(null);
  useEffect(()=>{ if (!open) return; const h = e => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
    document.addEventListener("pointerdown", h); return ()=>document.removeEventListener("pointerdown", h); },[open]);
  const getUrl = useCallback(async (s) => {
    const c = cache.current[s.id]; if (c && c.path===s.path && c.exp > Date.now()) return c.url;
    const {data} = await sb.storage.from("suoni").createSignedUrl(s.path, 60*60*12);
    if (!data?.signedUrl) return null; cache.current[s.id] = {url:data.signedUrl, path:s.path, exp:Date.now()+11*3600*1000}; return data.signedUrl;
  },[sb]);
  const playsHere = !!audio && (audio.mode==="online" || me.isMaster);
  const active = enabled && !muted && playsHere;
  const amb = audio && sounds.find(s=>s.id===audio.ambient_id && s.kind==="ambiente");

  /* sottofondo con dissolvenza */
  useEffect(()=>{ const my = ++token.current;
    (async()=>{
      const target = active && amb ? amb : null;
      if ((cur.current.id||null) === (target?.id||null)) return;
      const prev = cur.current; const old = prev.el; cur.current = {el:null, id:target?.id||null};
      if (old) fadeVol(old, old.volume, 0, 1200, ()=>{ old.pause(); old.src = ""; });
      if (prev.yt) setYt(y => y && y.sound.id===prev.id ? {...y, stopping:true} : y);
      if (!target) return;
      if (target.youtube){ cur.current = {yt:true, id:target.id}; setYtStatus(""); setErr(""); setYt({sound:target}); return; }
      const url = await getUrl(target); if (!url || my !== token.current) return;
      const el = new Audio(url); el.loop = true; el.volume = 0;
      try { await el.play(); } catch(e){ setErr("Il browser ha bloccato l’audio: tocca “Attiva l’audio”."); setEnabled(false); return; }
      if (my !== token.current){ el.pause(); return; }
      cur.current = {el, id:target.id}; setErr("");
      fadeVol(el, 0, vol * (target.volume ?? 1), 1500);
    })();
  },[active, amb?.id, amb?.path, amb?.youtube]);
  useEffect(()=>{ if (cur.current.el && amb) cur.current.el.volume = Math.min(1, vol * (amb.volume ?? 1)); },[vol, amb?.volume]);
  useEffect(()=>()=>{ if (cur.current.el) cur.current.el.pause(); },[]);

  /* effetti singoli */
  useEffect(()=>{
    if (!audio?.effect_id || !audio.effect_at) return;
    const key = audio.effect_id + "@" + audio.effect_at; if (lastFx.current === key) return; lastFx.current = key;
    if (!active || Date.now() - Date.parse(audio.effect_at) > 15000) return;
    const s = sounds.find(x=>x.id===audio.effect_id); if (!s) return;
    getUrl(s).then(u=>{ if (!u) return; const el = new Audio(u); el.volume = Math.min(1, vol * (s.volume ?? 1)); el.play().catch(()=>{}); });
  },[audio?.effect_at, active]);

  /* il PC del master cambia musica quando cambia la regione */
  useEffect(()=>{
    if (!me.isMaster || !audio?.auto_region || !world) return;
    const s = sounds.find(x=>x.kind==="ambiente" && x.region===world.region);
    if (s && s.id !== audio.ambient_id) sb.from("audio_state").update({ambient_id:s.id, ambient_started:new Date().toISOString(), updated_at:new Date().toISOString()}).eq("id",1);
  },[world?.region, audio?.auto_region, sounds.length]);

  const unlock = () => { try { const a = new Audio(SILENT_WAV); a.play().catch(()=>{}); } catch(e){} setEnabled(true); setMuted(false); setErr(""); };
  if (!audio) return null;
  const status = !playsHere ? "Al tavolo: la musica suona sul PC del master" : !enabled ? "Audio spento su questo dispositivo" : muted ? "Silenziato"
    : amb ? (amb.youtube && ytStatus==="attesa" ? "Tocca ▶ nel riquadro di YouTube per sentire "+amb.name : amb.youtube && ytStatus==="errore" ? "YouTube non riesce a riprodurre "+amb.name : "In riproduzione: "+amb.name) : "Nessun sottofondo";
  const ytSound = yt && amb && amb.id===yt.sound.id ? amb : yt?.sound;
  return html`<div className="audioctl" ref=${box}>
    <button type="button" className=${"btn small audiobtn"+(active&&amb?" on":"")} aria-expanded=${open} aria-label="Audio" title=${status}
      onClick=${()=>{ if (!enabled && playsHere) unlock(); setOpen(!open); }}><${SpeakerIcon} on=${active}/></button>
    ${open && html`<div className="audiopop" role="dialog" aria-label="Audio">
      <div className="eyebrow">Audio della sessione</div>
      <p style=${{margin:0}}>${status}</p>
      ${playsHere && !enabled && html`<button type="button" className="btn primary" onClick=${unlock}>Attiva l’audio</button>`}
      ${playsHere && enabled && html`<label className="lab">Volume su questo dispositivo
        <input id="vol" type="range" min="0" max="1" step="0.05" value=${vol} onInput=${e=>setVol(Number(e.target.value))}/></label>

const hpState = (hp, max) => { if (!max || max<=0) return "illeso"; if (hp<=0) return "a terra"; const f=hp/max; return f>=1?"illeso":f>0.5?"ferito":f>0.25?"malconcio":"allo stremo"; };

function chime(){
  try { const AC = window.AudioContext||window.webkitAudioContext; const ac = chime.ac || (chime.ac = new AC());
    const o=ac.createOscillator(), g=ac.createGain(); const t0=ac.currentTime; o.type="triangle";
    o.frequency.setValueAtTime(660,t0); o.frequency.setValueAtTime(990,t0+.14);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.18,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.5);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+.55); } catch(e){}
  try { navigator.vibrate && navigator.vibrate([120,60,120]); } catch(e){}
}

function TurnBanner({combat, fighters, chars, me, onEndTurn, onRollInit, goTable}){
  const myChars = new Set(chars.filter(c=>c.owner===me.id).map(c=>c.id));
  const nameOf = f => { const c = f.char_id && chars.find(x=>x.id===f.char_id); return (c && c.name) || f.name || "?"; };
  const waiting = fighters.filter(f=>f.char_id && myChars.has(f.char_id) && f.init==null);
  if (!combat.active && waiting.length) return html`<div className="turnbar prep"><div className="tb-in">
    <span>⚔️ Scontro in arrivo: tira l’iniziativa</span><span className="spacer"></span>
    ${waiting.map(f=>html`<button type="button" key=${f.id} className="btn primary small" onClick=${()=>onRollInit(f)}>Tira per ${nameOf(f)}</button>`)}</div></div>`;
  if (!combat.active) return null;
  const cur = fighters.find(f=>f.id===combat.turn_id);
  const mine = cur && cur.char_id && myChars.has(cur.char_id);
  return html`<div className=${"turnbar"+(mine?" mine":"")}><div className="tb-in">
    <span className="mono">Round ${combat.round}</span>
    <span>${mine ? html`<b>Tocca a te, ${nameOf(cur)}!</b>` : html`Turno di <b>${cur && !(cur.hidden && !me.isMaster) ? nameOf(cur) : "un avversario"}</b>`}</span>
    <span className="spacer"></span>
    ${mine && html`<button type="button" className="btn primary small" onClick=${onEndTurn}>Fine turno</button>`}
    <button type="button" className="btn small" onClick=${goTable}>${me.isMaster?"Plancia":"Iniziativa"}</button>
  </div></div>`;
}

function Initiative({combat, fighters, secrets, chars, me, act}){
  const M = me.isMaster;
  const ordered = orderFighters(fighters);
  const charOf = id => chars.find(c=>c.id===id);
  const [form, setForm] = useState({name:"", n:1, mod:0, hp:7, ac:12, hidden:false});
  const [confirmEnd, setConfirmEnd] = useState(false);
  const [err, setErr] = useState("");
  const run = async (fn) => { setErr(""); const m = await fn(); if (m) setErr(m); };
  const inIds = new Set(fighters.map(f=>f.char_id).filter(Boolean));
  const pcsOut = chars.filter(c=>!inIds.has(c.id) && (c.owner || M));
  const monstersNoInit = fighters.filter(f=>!f.char_id && f.init==null);
  const canRoll = f => M || (f.char_id && charOf(f.char_id)?.owner===me.id);

  return html`<section className="panel">
    <div className="panel-h"><h3>Iniziativa</h3>
      <span className="muted" style=${{fontSize:".85rem"}}>${combat.active ? `Round ${combat.round}` : fighters.length ? "In preparazione" : "Nessuno scontro"}</span></div>

    ${fighters.length===0 && html`<p className="muted" style=${{margin:0}}>${M ? "Aggiungi i personaggi e gli avversari, fai tirare l’iniziativa e avvia lo scontro." : "Quando il master prepara uno scontro, qui compare l’ordine dei turni."}</p>`}

    ${ordered.length>0 && html`<ol className="init-list">${ordered.map(f=>{
      const c = f.char_id && charOf(f.char_id); const s = c ? norm(c) : null; const Dd = s ? derived(s) : null;
      const sec = secrets[f.id]; const cur = combat.active && combat.turn_id===f.id;
      const conds = s ? s.cond : (f.conds||[]);
      return html`<li key=${f.id} className=${"ir"+(cur?" cur":"")+(f.hidden?" hid":"")+(c?" pc":"")}>
        <span className="ir-init mono">${M ? html`<${Num} id=${"init-"+f.id} value=${f.init??0} label="Iniziativa" onChange=${v=>act.setInit(f,v)}/>` : (f.init ?? "—")}</span>
        <div className="ir-main">
          <div className="ir-name">${cur && html`<span aria-label="turno attuale">▶ </span>`}${(s && s.name) || f.name}${f.hidden && html`<span className="chip" style=${{marginLeft:6}}>nascosto</span>`}</div>
          ${s ? html`<div className="ir-hp"><div className="hpbar"><i style=${{width:clamp(s.hp.cur/Dd.effMax*100,0,100)+"%"}}></i></div><span className="mono">${s.hp.cur}/${Dd.effMax}</span><span className="muted">CA ${s.ac}</span></div>`
            : M && sec ? html`<div className="ir-hp"><span className="muted">PF</span><${Num} id=${"mhp-"+f.id} value=${sec.hp??0} label="PF avversario" onChange=${v=>act.setMonsterHp(f,v)}/><span className="muted mono">/ ${sec.max_hp??"?"}</span>${sec.ac!=null && html`<span className="muted">CA ${sec.ac}</span>`}<span className="chip">${HP_STATE_LABEL[f.hp_state]||f.hp_state}</span></div>`
            : html`<div className="ir-hp"><span className=${"chip"+(f.hp_state!=="illeso"?" bad":"")}>${HP_STATE_LABEL[f.hp_state]||f.hp_state}</span></div>`}
          ${conds.length>0 && html`<div className="chips">${conds.map(x=>html`<span key=${x} className="chip bad">${x}${M && !s ? html` <button type="button" className="xbtn" aria-label=${"Togli "+x} onClick=${()=>act.toggleCond(f,x)}>×</button>`:null}</span>`)}</div>`}
        </div>
        <div className="ir-act">
          ${f.init==null && canRoll(f) && html`<button type="button" className="btn small" onClick=${()=>run(()=>act.rollInit(f))}>Tira</button>`}
          ${M && !s && html`<select className="field cond-sel" aria-label="Aggiungi condizione" value="" onChange=${e=>{ if(e.target.value) act.toggleCond(f,e.target.value); }}>
              <option value="">+ cond.</option>${CONDS.filter(x=>!conds.includes(x)).map(x=>html`<option key=${x} value=${x}>${x}</option>`)}</select>`}
          ${M && html`<button type="button" className="iconbtn" aria-label=${"Togli "+((s&&s.name)||f.name)+" dallo scontro"} onClick=${()=>run(()=>act.remove(f))}>×</button>`}
        </div>
      </li>`;})}</ol>`}

    ${M && !combat.active && html`<div className="setup">
      ${pcsOut.length>0 && html`<button type="button" className="btn" onClick=${()=>run(()=>act.addPCs(pcsOut))}>Aggiungi ${pcsOut.length===1?"1 personaggio":pcsOut.length+" personaggi"}</button>`}
      <form className="mform" onSubmit=${e=>{e.preventDefault(); if(!form.name.trim()) return; run(async()=>{ const m = await act.addMonsters(form); if(!m) setForm({...form, name:""}); return m; });}}>
        <label className="lab nm">Avversario<input id="m-name" className="field" placeholder="es. Bokoblin" value=${form.name} onChange=${e=>setForm({...form,name:e.target.value})}/></label>
        <label className="lab">Quanti<${Num} id="m-n" value=${form.n} min=${1} max=${20} onChange=${v=>setForm(x=>({...x,n:v}))}/></label>
        <label className="lab">Bonus iniz.<${Num} id="m-mod" value=${form.mod} min=${-5} max=${15} onChange=${v=>setForm(x=>({...x,mod:v}))}/></label>
        <label className="lab">PF<${Num} id="m-hp" value=${form.hp} min=${1} onChange=${v=>setForm(x=>({...x,hp:v}))}/></label>
        <label className="lab">CA<${Num} id="m-ac" value=${form.ac} min=${0} onChange=${v=>setForm(x=>({...x,ac:v}))}/></label>
        <label className="row hidchk"><input id="m-hid" type="checkbox" checked=${form.hidden} onChange=${e=>setForm({...form,hidden:e.target.checked})}/>Nascosto ai giocatori</label>
        <button className="btn">+ Aggiungi</button>
      </form>
      <div className="row">
        ${monstersNoInit.length>0 && html`<button type="button" className="btn" onClick=${()=>run(()=>act.rollMonsters(monstersNoInit))}>Tira iniziativa avversari (${monstersNoInit.length})</button>`}
        <span className="spacer"></span>
        ${fighters.length>0 && html`<button type="button" className="btn small danger" onClick=${()=>run(act.end)}>Svuota</button>`}
        <button type="button" className="btn primary" disabled=${fighters.length===0} onClick=${()=>run(act.start)}>Inizia lo scontro</button>
      </div>
    </div>`}

    ${M && combat.active && html`<div className="row">
      <button type="button" className="btn" onClick=${()=>run(()=>act.step(-1))}>← Indietro</button>
      <button type="button" className="btn primary" onClick=${()=>run(()=>act.step(1))}>Turno successivo →</button>
      <span className="spacer"></span>
      ${!confirmEnd ? html`<button type="button" className="btn danger" onClick=${()=>setConfirmEnd(true)}>Termina scontro</button>`
        : html`<span className="confirm">Terminare lo scontro?<button type="button" className="btn small danger" onClick=${()=>{setConfirmEnd(false); run(act.end);}}>Termina</button><button type="button" className="btn small" onClick=${()=>setConfirmEnd(false)}>Annulla</button></span>`}
    </div>`}
    ${err && html`<p className="err" role="alert">${err}</p>`}
  </section>`;
}

function PartyStatus({chars, names, adjustHp}){
  const pcs = [...chars].sort((a,b)=>(!a.owner - !b.owner) || String(a.name||"").localeCompare(String(b.name||"")));
  const [amt, setAmt] = useState({}); const [err, setErr] = useState("");
  const go = async (c, kind) => { const n = parseInt(amt[c.id],10); if (isNaN(n)||n<=0) return; setErr("");
    const m = await adjustHp(c.id, kind, n); if (m) setErr(m); else setAmt(x=>({...x,[c.id]:""})); };
  return html`<section className="panel">
    <div className="panel-h"><h3>Il gruppo</h3><span className="muted" style=${{fontSize:".82rem"}}>Danni e cure vanno subito sulla scheda</span></div>
    ${pcs.length===0 && html`<p className="muted" style=${{margin:0}}>Nessuna scheda ancora.</p>`}
    <div className="ps-list">${pcs.map(c=>{ const s=norm(c), D=derived(s); return html`<div key=${c.id} className="ps">
      <div className="ps-top"><b>${s.name||"Senza nome"}</b><span className="muted">${c.owner ? (names[c.owner]||"") : "PNG"}</span><span className="spacer"></span>
        <span className="mono">${s.hp.cur}/${D.effMax}${s.hp.temp?` +${s.hp.temp}`:""}</span></div>
      <div className="hpbar"><i style=${{width:clamp(s.hp.cur/D.effMax*100,0,100)+"%"}}></i></div>
      <div className="ps-bot">
        <span className="muted">CA <b className="mono">${s.ac}</b> · Perc. <b className="mono">${D.passPerc}</b>${D.dc!=null?html` · CD <b className="mono">${D.dc}</b>`:null}</span>
        <span className="spacer"></span>
        <input className="num ps-amt" id=${"ps-"+c.id} inputMode="numeric" placeholder="n" aria-label=${"Quantità per "+(s.name||"personaggio")} value=${amt[c.id]||""} onChange=${e=>setAmt(x=>({...x,[c.id]:e.target.value}))}/>
        <button type="button" className="btn small danger" onClick=${()=>go(c,"dmg")}>Danno</button>
        <button type="button" className="btn small" onClick=${()=>go(c,"heal")}>Cura</button>
      </div>
      ${(s.cond.length>0||s.insp||s.exh>0) && html`<div className="chips">${s.insp && html`<span className="chip gold">★ Ispirazione</span>`}${s.exh>0 && html`<span className="chip bad">Esaurimento ${s.exh}</span>`}${s.cond.map(x=>html`<span key=${x} className="chip bad">${x}</span>`)}</div>`}
    </div>`;})}</div>
    ${err && html`<p className="err" role="alert">${err}</p>`}
  </section>`;
}

function DiscordPanel({sb}){
  const [st, setSt] = useState(null); const [url, setUrl] = useState(""); const [turns, setTurns] = useState(true);
  const [msg, setMsg] = useState(""); const [busy, setBusy] = useState(false);
  const load = useCallback(async()=>{ const {data} = await sb.rpc("discord_status"); if (data){ setSt(data); setTurns(!!data.turns); } },[sb]);
  useEffect(()=>{ load(); },[load]);
  const save = async (u) => { setBusy(true); setMsg("");
    const {data, error} = await sb.rpc("set_discord", {p_url:u, p_turns:turns});
    setBusy(false);
    if (error) setMsg("Errore: "+error.message);
    else if (!data) setMsg("Questo non sembra l’indirizzo di un webhook Discord: deve iniziare con https://discord.com/api/webhooks/");
    else { setMsg(u ? "Collegato: nel canale dovrebbe essere comparso un messaggio di prova." : "Discord scollegato."); setUrl(""); load(); } };
  return html`<section className="panel">
    <div className="panel-h"><h3>Discord</h3><span className="state"><span className=${"dot "+(st?.connected?"ok":"")}></span>${st?.connected?"Collegato":"Non collegato"}</span></div>
    <p className="muted" style=${{margin:0,fontSize:".88rem"}}>Nel canale: Modifica canale → Integrazioni → Webhook → Nuovo webhook → Copia URL del webhook. Arrivano i tiri visibili (non quelli dietro lo schermo) e, se vuoi, i cambi di turno.</p>
    <div className="dice-form">
      <input id="dc-url" className="field" type="password" autoComplete="off" placeholder=${st?.connected?"Incolla un nuovo URL per cambiarlo":"https://discord.com/api/webhooks/…"} value=${url} onChange=${e=>setUrl(e.target.value)}/>
      <button type="button" className="btn primary" disabled=${busy||!url.trim()} onClick=${()=>save(url.trim())}>Collega</button>
    </div>
    <div className="row">
      <label className="row" style=${{gap:6,fontSize:".9rem"}}><input id="dc-turns" type="checkbox" checked=${turns} onChange=${e=>setTurns(e.target.checked)}/>Annuncia i turni di combattimento</label>
      <span className="spacer"></span>
      ${st?.connected && html`<button type="button" className="btn small" disabled=${busy} onClick=${async()=>{ setBusy(true); const {error} = await sb.rpc("set_discord_turns", {p_turns:turns}); setBusy(false); setMsg(error?"Errore: "+error.message:"Preferenza salvata."); load(); }}>Salva preferenza</button>`}
      ${st?.connected && html`<button type="button" className="btn small danger" disabled=${busy} onClick=${()=>save("")}>Scollega</button>`}
    </div>
    ${msg && html`<p className="muted" role="status" style=${{margin:0}}>${msg}</p>`}
  </section>`;
}

  const {combat, fighters, secrets, rolls} = camp;
  if (me.isMaster) return html`<div>
    <div className="party-head"><div><div className="eyebrow">Dietro lo schermo</div><h2>Plancia del master</h2></div></div>
    <div className="table3">
      <div className="col"><${Initiative} combat=${combat} fighters=${fighters} secrets=${secrets} chars=${chars} me=${me} act=${act}/></div>
      <div className="col"><${PartyStatus} chars=${chars} names=${names} adjustHp=${adjustHp}/><${WorldPanel} sb=${sb} world=${camp.world} setWorld=${camp.setWorld} chars=${chars}/><${DiceTray} onFree=${onFree} master=${true}/></div>
      <div className="col"><${Feed} rolls=${rolls}/><${SoundsPanel} sb=${sb} sounds=${camp.sounds} audio=${camp.audio} reload=${camp.loadAudio}/><${DiscordPanel} sb=${sb}/><${BackupPanel} sb=${sb} camp=${camp}/></div>
    </div></div>`;

/* ---------- app ---------- */
function Main({sb, me, onSignOut}){
  const camp = useCampaign(sb, true);
  const book = useSpellBook(camp.spellsCustom);
  const {chars, party, maps, members, ready, error, combat, fighters} = camp;
  const urls = useSignedUrls(sb, maps);
  const names = useMemo(()=>Object.fromEntries(members.map(m=>[m.user_id, m.name])),[members]);
  const [view, setView] = useState(()=>{ const h=(location.hash||"").slice(1); return ["mappa","gruppo","tavolo","cronache"].includes(h)?h:lsGet("view","gruppo"); });
  const [openId, setOpenId] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [msg, setMsg] = useState("");
  const shown = useRef(new Set());
  const hoUrls = useHandoutUrls(sb, camp.handouts);
  const [hoOpen, setHoOpen] = useState(null);
  const seenKey = h => h.id + "@" + (h.revealed_at || "");
  useEffect(()=>{
    if (me.isMaster || hoOpen) return;
    const seen = new Set(lsGet("seenHandouts", []));
    const fresh = camp.handouts.filter(h=>h.revealed && h.revealed_at && !seen.has(seenKey(h)) && Date.now() - Date.parse(h.revealed_at) < 12*3600*1000)
      .sort((a,b)=>a.revealed_at.localeCompare(b.revealed_at));
    if (fresh.length){ setHoOpen(fresh[0]); chime(); }
  },[camp.handouts, hoOpen]);
  const closeHandout = () => { if (hoOpen){ const seen = lsGet("seenHandouts", []); lsSet("seenHandouts", [...seen.slice(-200), seenKey(hoOpen)]); } setHoOpen(null); };
  useEffect(()=>{ if(view!=="scheda") lsSet("view",view); },[view]);

  const showToast = useCallback((r)=>{
    if (shown.current.has(r.id)) return; shown.current.add(r.id);
    setToasts(x=>[...x.slice(-2), r]);
    setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==r.id)), 9000);
  },[]);
  camp.onNewRoll.current = (row) => { if (row.user_id !== me.id && Date.now() - new Date(row.created_at).getTime() < 60000) showToast(row); };

  const onRoll = useCallback(async (r)=>{
    const call = r.type==="d20"
      ? sb.rpc("roll_d20", {p_label:r.label, p_mod:r.mod||0, p_mode:r.mode||"norm", p_pen:r.pen||0, p_char:r.charId||null, p_hidden:!!r.hidden})
      : sb.rpc("roll_formula", {p_label:r.label, p_formula:r.formula, p_char:r.charId||null, p_hidden:!!r.hidden});
    const {data, error:e} = await call;
    if (e || !data){ setMsg("Tiro non riuscito: "+(e?.message||"nessuna risposta")); return null; }
    camp.addRoll(data); showToast(data); return data.total;
  },[sb, showToast]);
  const onFree = (x) => onRoll({type:"formula", label:x.label, formula:x.formula, hidden:x.hidden});

  const create = async (npc) => { setMsg("");
    const data = {...blankSheet(), name: npc ? "Nuovo PNG" : ""};
    const {data:row, error:e} = await sb.from("characters").insert({owner: npc ? null : me.id, data}).select("id,owner,data").single();
    if (e){ setMsg("Non sono riuscito a creare la scheda: "+e.message); return; }
    camp.setChars(x=> x.some(c=>c.id===row.id) ? x : [...x, rowToChar(row)]);
    setOpenId(row.id); setView("scheda"); };

  const saveSheet = useCallback(async (id, sheet) => {
    const {id:_i, owner:_o, ...data} = sheet;
    const {data:rows, error:e} = await sb.from("characters").update({data, updated_at:new Date().toISOString()}).eq("id", id).select("id");
    if (e) return /fetch|network/i.test(e.message) ? "error" : "denied";
    if (!rows || !rows.length) return "denied";
    camp.setChars(x=>x.map(c=>c.id===id ? {...data, id, owner:c.owner} : c));
    return "ok";
  },[sb]);
  const delSheet = async (id) => { const {error:e} = await sb.from("characters").delete().eq("id", id); if (e) return false;
    camp.setChars(x=>x.filter(c=>c.id!==id)); return true; };

  const adjustHp = async (id, kind, n) => {
    const {data, error:e} = await sb.rpc("adjust_hp", {p_char:id, p_kind:kind, p_amount:n});
    if (e) return "Non riuscito: "+e.message;
    camp.setChars(x=>x.map(c=>c.id===id ? {...c, hp:data} : c)); return "";
  };

  /* combattimento */
  const errText = (e) => e ? (e.message || "Operazione non riuscita") : "";
  const hpTimers = useRef({});
  const act = {
    addPCs: async (list) => { const rows = list.map(c=>{ const D = derived(norm(c)); return {char_id:c.id, name:c.name||"PG", init_mod:D.init, dex:D.init}; });
      const {error:e} = await sb.from("combatants").insert(rows); await camp.loadFighters(); return errText(e); },
    addMonsters: async (f) => { const n = clamp(f.n,1,20);
      const rows = Array.from({length:n},(_,i)=>({name: n>1 ? `${f.name.trim()} ${i+1}` : f.name.trim(), init_mod:f.mod, dex:f.mod, hidden:!!f.hidden}));
      const {data, error:e} = await sb.from("combatants").insert(rows).select("id");
      if (e) return errText(e);
      const {error:e2} = await sb.from("combatant_secrets").insert(data.map(r=>({id:r.id, hp:f.hp, max_hp:f.hp, ac:f.ac})));
      await camp.loadFighters(); return errText(e2); },
    rollInit: async (f) => {
      let mod = f.init_mod||0, pen = 0;
      if (f.char_id){ const c = chars.find(x=>x.id===f.char_id); if (c){ const s=norm(c); mod = derived(s).init; pen = (s.exh||0)*2; } }
      const {error:e} = await sb.rpc("roll_initiative", {p_combatant:f.id, p_mod:mod, p_mode:"norm", p_pen:pen});
      await camp.loadFighters(); return errText(e); },
    rollMonsters: async (list) => { for (const f of list){ const {error:e} = await sb.rpc("roll_initiative", {p_combatant:f.id, p_mod:f.init_mod||0}); if (e){ await camp.loadFighters(); return errText(e);} }
      await camp.loadFighters(); return ""; },
    setInit: async (f, v) => { await sb.from("combatants").update({init:v}).eq("id", f.id); camp.loadFighters(); },
    remove: async (f) => { const {error:e} = await sb.from("combatants").delete().eq("id", f.id); await camp.loadFighters(); return errText(e); },
    setMonsterHp: (f, hp) => { clearTimeout(hpTimers.current[f.id]);
      hpTimers.current[f.id] = setTimeout(async ()=>{ const sec = camp.secrets[f.id] || {};
        await sb.from("combatant_secrets").update({hp}).eq("id", f.id);
        await sb.from("combatants").update({hp_state: hpState(hp, sec.max_hp)}).eq("id", f.id);
        camp.loadFighters(); }, 450); },
    toggleCond: async (f, x) => { const conds = (f.conds||[]).includes(x) ? f.conds.filter(y=>y!==x) : [...(f.conds||[]), x];
      await sb.from("combatants").update({conds}).eq("id", f.id); camp.loadFighters(); },
    start: async () => { const {error:e} = await sb.rpc("start_combat"); return errText(e); },
    step: async (dir) => { const {error:e} = await sb.rpc("step_turn", {p_dir:dir}); return errText(e); },
    end: async () => { const {error:e} = await sb.rpc("end_combat"); await camp.loadFighters(); return errText(e); },
  };
  const pinOps = {
    add: async (row) => { const {error:e} = await sb.from("pins").insert({...row, created_by:me.id}); await camp.loadPins(); return e ? "Segnaposto non salvato: "+e.message : ""; },
    update: async (id, patch) => { const {data, error:e} = await sb.from("pins").update(patch).eq("id", id).select("id"); await camp.loadPins();
      return e ? "Modifica non salvata: "+e.message : (!data || !data.length) ? "Puoi modificare solo i segnaposti che hai creato tu." : ""; },
    remove: async (id) => { const {data, error:e} = await sb.from("pins").delete().eq("id", id).select("id"); await camp.loadPins();
      return e ? "Non eliminato: "+e.message : (!data || !data.length) ? "Puoi eliminare solo i segnaposti che hai creato tu." : ""; },
  };
  const endMyTurn = async () => { const {error:e} = await sb.rpc("step_turn", {p_dir:1}); if (e) setMsg(errText(e)); };

  /* avviso quando tocca a me */
  const lastTurn = useRef(null);
  useEffect(()=>{
    if (!combat.active){ lastTurn.current = null; return; }
    if (combat.turn_id === lastTurn.current) return;
    lastTurn.current = combat.turn_id;
    const f = fighters.find(x=>x.id===combat.turn_id); const c = f && f.char_id && chars.find(x=>x.id===f.char_id);
    if (c && c.owner===me.id) chime();
  },[combat.active, combat.turn_id, fighters, chars]);

  const onMove = async (pos) => {
    const trail = (party?.trail||[]).slice();
    if (party && typeof party.x==="number") trail.push({plane:party.plane,x:party.x,y:party.y,label:party.label||"",at:party.at||0});
    return writeParty({...pos, by:me.id, at:Date.now(), trail: trail.slice(-20)});
  };
  const writeParty = async (state) => {
    const {data:rows, error:e} = await sb.from("party").update({state, updated_at:new Date().toISOString()}).eq("id",1).select("state");
    if (e || !rows?.length) return "Spostamento non salvato: controlla la connessione e riprova.";
    camp.setParty(rows[0].state); return "";
  };
  const onClearTrail = () => writeParty({...(party||{}), trail:[]});
  const onUpload = async (plane, file) => {
    if (file.size > 45*1024*1024) return "Immagine troppo grande: resta sotto i 45 MB.";
    const ext = (file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path = `${plane}-${Date.now()}.${ext}`;
    const up = await sb.storage.from("mappe").upload(path, file, {contentType: file.type || "image/jpeg", upsert:false});
    if (up.error) return "Caricamento non riuscito: "+up.error.message;
    const prev = maps[plane];
    const {error:e} = await sb.from("maps").upsert({plane, path, updated_at:new Date().toISOString()});
    if (e) return "Mappa caricata ma non registrata: "+e.message;
    if (prev && prev!==path) sb.storage.from("mappe").remove([prev]);
    camp.reload(); return "";
  };

  const openChar = chars.find(c=>c.id===openId);
  const mine = chars.find(c=>c.owner===me.id);
  const goMine = () => { if (mine){ setOpenId(mine.id); setView("scheda"); } else { setView("gruppo"); setOpenId(null); } };
  const nav = [["gruppo","Il gruppo"],["tavolo", me.isMaster?"Plancia":"Tavolo"],["scheda","La mia scheda"],["mappa","Mappa"],["cronache","Cronache"]];
  const saveFor = useMemo(()=> openId ? (sheet)=>saveSheet(openId, sheet) : null, [openId, saveSheet]);

  return html`<${SpellsCtx.Provider} value=${book}><div>
    <header className="bar"><div className="bar-in">
      <div className="brand"><${Mark} size=${26}/><span>Taccuino di Hyrule</span></div>
      <nav className="nav">${nav.map(([k,l])=>html`<button type="button" key=${k} aria-current=${view===k && (k!=="scheda" || (mine && openId===mine.id))}
        onClick=${()=> k==="scheda" ? goMine() : (setView(k), setOpenId(null))}>${l}${k==="tavolo" && combat.active ? html` <span className="live" aria-label="scontro in corso"></span>` : null}</button>`)}</nav>
      <${AudioControl} sb=${sb} me=${me} sounds=${camp.sounds} audio=${camp.audio} world=${camp.world}/>
      <div className="userbox"><${Who} id=${me.id} name=${names[me.id]||me.email}/><span>${names[me.id]||me.email}${me.isMaster?" · master":""}</span>
        <button type="button" className="btn small" onClick=${onSignOut}>Esci</button></div>
    </div>
    <${WorldStrip} world=${camp.world} chars=${chars} me=${me}/>
    <${TurnBanner} combat=${combat} fighters=${fighters} chars=${chars} me=${me} onEndTurn=${endMyTurn}
      onRollInit=${async f=>{ const m = await act.rollInit(f); if (m) setMsg(m); }} goTable=${()=>{setView("tavolo"); setOpenId(null);}}/>
    </header>
    <main className=${"wrap"+(view==="tavolo"?" wide":"")}>
      ${msg && html`<p className="notice err" role="alert">${msg} <button type="button" className="btn small" onClick=${()=>setMsg("")}>Chiudi</button></p>`}
      ${view==="gruppo" && html`<${Party} chars=${chars} me=${me} names=${names} party=${party} ready=${ready} error=${error} world=${camp.world}
          onOpen=${id=>{setOpenId(id); setView("scheda");}} onCreate=${()=>create(false)} onCreateNpc=${()=>create(true)} goMap=${()=>setView("mappa")}/>`}
      ${view==="cronache" && html`<${Chronicles} sb=${sb} me=${me} camp=${camp} names=${names} hoUrls=${hoUrls} onOpenHandout=${h=>setHoOpen(h)}/>`}
      ${view==="tavolo" && html`<${TableView} sb=${sb} me=${me} chars=${chars} names=${names} camp=${camp} onFree=${onFree} act=${act} adjustHp=${adjustHp}/>`}
      ${view==="scheda" && (openChar
          ? html`<${Sheet} key=${openId} remote=${openChar} onSave=${saveFor} onDelete=${()=>delSheet(openId)} onRoll=${onRoll}
              onBack=${()=>{setView("gruppo"); setOpenId(null);}}
              editable=${me.isMaster || openChar.owner===me.id} canDelete=${me.isMaster || openChar.owner===me.id}
              ownerName=${openChar.owner ? (names[openChar.owner]||"Giocatore") : "PNG del master"} world=${camp.world}/>`
          : html`<div className="empty"><h3>Scheda non trovata</h3><p className="muted">Forse è stata eliminata.</p><button className="btn" onClick=${()=>setView("gruppo")}>Torna al gruppo</button></div>`)}
      ${view==="mappa" && html`<${MapView} me=${me} party=${party} mapUrls=${urls} names=${names} onMove=${onMove} onClearTrail=${onClearTrail} onUpload=${onUpload} pins=${camp.pins} pinOps=${pinOps}/>`}
    </main>
    ${hoOpen && html`<${HandoutModal} h=${hoOpen} url=${hoUrls[hoOpen.id]} onClose=${closeHandout}/>`}
    <${Toasts} toasts=${toasts}/>
  </div><//>`;
}

function App(){
  const configured = typeof SUPABASE_URL==="string" && /^https:\/\/.+/.test(SUPABASE_URL) && !SUPABASE_URL.includes("IL-TUO-PROGETTO") && !String(SUPABASE_KEY).startsWith("LA-TUA");
  const sb = useMemo(()=> configured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null, [configured]);
  const [session, setSession] = useState(undefined);
  const [me, setMe] = useState(null);
  const [member, setMember] = useState(null);

  useEffect(()=>{ if (!sb) return;
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e, s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  },[sb]);

  const userId = session?.user?.id;
  const checkMember = useCallback(async ()=>{
    if (!sb || !userId) { setMe(null); setMember(null); return; }
    const [{data:isM}, {data:row}] = await Promise.all([ sb.rpc("is_master"), sb.from("members").select("user_id").eq("user_id", userId).maybeSingle() ]);
    setMe({id:userId, email:session.user.email, isMaster: !!isM});
    setMember(!!row);
  },[sb, userId]);
  useEffect(()=>{ checkMember(); },[checkMember]);

  if (!configured) return html`<${Gate}><div className="gate-card"><h3>Manca la configurazione</h3>
    <p className="muted" style=${{margin:0}}>Apri questo file con un editor di testo e incolla in alto l’indirizzo del progetto Supabase e la chiave anon (o publishable), al posto dei segnaposto.</p></div><//>`;
  if (!sb) return html`<${Gate}><div className="gate-card"><p className="err">Non riesco a caricare la libreria di Supabase: controlla la connessione e ricarica.</p></div><//>`;
  if (session===undefined || (session && member===null)) return html`<${Gate}><p className="muted" style=${{textAlign:"center"}}>Apertura del taccuino…</p><//>`;
  if (!session) return html`<${Login} sb=${sb}/>`;
  if (!member) return html`<${Join} sb=${sb} user=${session.user} onJoined=${checkMember}/>`;
  return html`<${Main} sb=${sb} me=${me} onSignOut=${()=>sb.auth.signOut()}/>`;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);

</script>
</body>
</html>
