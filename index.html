      <label className="lab" style=${{width:80}}>Tacche<${Num} id="clk-seg" value=${form.segments} min=${2} max=${12} onChange=${v=>setForm(x=>({...x, segments:v}))}/></label>
      <label className="lab" style=${{flex:"1 1 180px"}}>Nota<input id="clk-note" className="field" placeholder="facoltativa, la vedono tutti" value=${form.note} onChange=${e=>setForm({...form, note:e.target.value})}/></label>
      <label className="row" style=${{gap:4,fontSize:".85rem"}}><input id="clk-vis" type="checkbox" checked=${form.visible} onChange=${e=>setForm({...form, visible:e.target.checked})}/>visibile</label>
      <button className="btn" disabled=${busy || !form.name.trim()}>+ Crea</button>
    </form>`}
    ${err && html`<p className="err" role="alert">${err}</p>`}
  </section>`;
}

function WorldPanel({sb, world, setWorld, chars}){

  const haz = climate(world);
  const save = async (patch) => { setErr(""); setMsg("");
    const {data, error} = await sb.from("world").update({...patch, updated_at:new Date().toISOString()}).eq("id",1).select().single();
    if (error) setErr("Non salvato: "+error.message); else setWorld(data); };
  const addMin = (n) => { let m = world.minutes + n, d = world.day; while (m >= 1440){ m -= 1440; d++; } save({minutes:m, day:d}); };
  const rollWeather = (region) => { const tbl = (REGION[region]||REGIONS[0])?.w; if (!tbl || !tbl.length) return world.weather; const tot = tbl.reduce((a,b)=>a+b[1],0); let r = Math.random()*tot;
    for (const [w,p] of tbl){ if ((r -= p) < 0) return w; } return tbl[0][0]; };
  const announce = async () => { setErr(""); setMsg("");
    const text = `🕰️ Giorno ${world.day}, ${fmtTime(world.minutes)} (${dayPart(world.minutes).toLowerCase()})` + (CFG.modules.clima && REGIONS.length ? ` · ${world.region} · ${world.weather}` : "") + (haz.kind ? ` · ${HAZ_LABEL[haz.kind]}` : "");
    const {error} = await sb.rpc("announce_world", {p_text:text}); if (error) setErr(error.message); else setMsg("Annunciato su Discord (se è collegato)."); };

      <button type="button" className="btn small" onClick=${()=>addMin(480)}>+8 ore (riposo)</button>

    </div>
    <form className="row" onSubmit=${e=>{e.preventDefault(); const m = /^(\d{1,2})[:.](\d{2})$/.exec(timeIn.trim()); if (m && +m[1]<24 && +m[2]<60){ save({minutes:+m[1]*60 + +m[2]}); setTimeIn(""); } else setErr("Scrivi l’ora come 14:30");}}>
      <label className="lab" style=${{width:90}}>Giorno<${Num} id="w-day" value=${world.day} min=${1} onChange=${v=>save({day:v})}/></label>
      <label className="lab" style=${{width:110}}>Ora<input id="w-time" className="field mono" placeholder=${fmtTime(world.minutes)} value=${timeIn} onChange=${e=>setTimeIn(e.target.value)}/></label>
      <button className="btn small" style=${{alignSelf:"end"}}>Imposta</button>
    </form>
    ${CFG.modules.clima && REGIONS.length===0 && html`<p className="muted" style=${{margin:0,fontSize:".88rem"}}>Nessuna regione: aggiungile in Impostazioni della campagna.</p>`}
    ${CFG.modules.clima && REGIONS.length>0 && html`    <div className="row">
      <label className="lab" style=${{flex:"1 1 160px"}}>Regione<select id="w-region" className="field" value=${world.region} onChange=${e=>{ const r=e.target.value; save({region:r, weather:rollWeather(r)}); }}>
        ${!REGION[world.region] && html`<option value=${world.region}>${world.region||"—"}</option>`}${REGIONS.map(r=>html`<option key=${r.k} value=${r.k}>${r.k}</option>`)}</select></label>

        ${[...new Set([...(REGION[world.region]?.w||[]).map(x=>x[0]), world.weather])].map(w=>html`<option key=${w} value=${w}>${w}</option>`)}</select></label>
      <button type="button" className="btn small" style=${{alignSelf:"end"}} onClick=${()=>save({weather:rollWeather(world.region)})}>Tira il meteo</button>

    ${err && html`<p className="err" role="alert">${err}</p>`}
    ${msg && html`<p className="muted" role="status" style=${{margin:0}}>${msg}</p>`}
  </section>`;
}

/* ---------- backup ---------- */
function BackupPanel({sb, camp}){
  const [msg, setMsg] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const [pending, setPending] = useState(null); const fileIn = useRef(null);
  const download = async () => { setErr(""); setMsg(""); setBusy(true);
    try {
      const q = async (t, sel="*") => { const {data, error} = await sb.from(t).select(sel); if (error) throw new Error(t+": "+error.message); return data; };
      const [characters, party, maps, pins, world, members, handouts, codex, codex_secrets, journal, recipes, sounds, spells_custom, campaign, scenes, scene_state, tokens, areas, clocks] = await Promise.all([
        q("characters","id,owner,data,updated_at"), q("party","state"), q("maps","plane,path"), q("pins"), q("world"), q("members","user_id,name"),
        q("handouts"), q("codex"), q("codex_secrets"), q("journal"), q("recipes"), q("sounds"), q("spells_custom"), q("campaign","config"), q("scenes").catch(()=>[]), q("scene_state").catch(()=>[]), q("tokens").catch(()=>[]), q("areas").catch(()=>[]), q("clocks").catch(()=>[])]);
      const backup = {app:"taccuino", version:4, campaign: campaign[0]?.config || null, exported_at:new Date().toISOString(),
        characters, party: party[0]?.state || null, maps, pins, world: world[0] || null, members, handouts, codex, codex_secrets, journal, recipes, sounds, spells_custom, scenes, scene_state, tokens, areas, clocks};
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
      const d = new Date(); const name = `${slugKey(CFG.name, new Set())}-backup-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      setMsg(`Backup scaricato: ${characters.length} schede, ${pins.length} segnaposti, ${codex.length} voci del codex, ${journal.length} sessioni del diario, ${handouts.length} handout, ${spells_custom.length} incantesimi del gruppo.`);
    } catch(e){ setErr("Backup non riuscito: "+e.message); }
    setBusy(false); };
  const readFile = async (file) => { setErr(""); setMsg(""); setPending(null); if (!file) return;
    try { const b = JSON.parse(await file.text()); if (!["taccuino","taccuino-hyrule"].includes(b.app) || !Array.isArray(b.characters)) throw new Error("non è un backup del Taccuino");
      setPending({b, name:file.name}); }
    catch(e){ setErr("File non valido: "+e.message); }
    if (fileIn.current) fileIn.current.value = ""; };
  const restore = async () => { const b = pending.b; setBusy(true); setErr(""); setMsg(""); const problems = [];
    let okChars = 0;
    for (const c of b.characters){
      let r = await sb.from("characters").upsert({id:c.id, owner:c.owner, data:c.data, updated_at:c.updated_at||new Date().toISOString()});
      if (r.error && c.owner){ r = await sb.from("characters").upsert({id:c.id, owner:null, data:c.data}); if (!r.error) problems.push(`${c.data?.name||"una scheda"} è tornata senza proprietario (account non trovato)`); }
      if (r.error) problems.push(`${c.data?.name||"una scheda"}: ${r.error.message}`); else okChars++;
    }
    if (Array.isArray(b.pins) && b.pins.length){ const {error} = await sb.from("pins").upsert(b.pins.map(p=>({...p, created_by:p.created_by||null})));
      if (error){ const {error:e2} = await sb.from("pins").upsert(b.pins.map(p=>({...p, created_by:null}))); if (e2) problems.push("segnaposti: "+e2.message); } }
    if (b.campaign && typeof b.campaign==="object"){ const {error} = await sb.from("campaign").update({config:b.campaign, updated_at:new Date().toISOString()}).eq("id",1); if (error) problems.push("impostazioni: "+error.message); }
    if (b.party !== undefined){ const {error} = await sb.from("party").update({state:b.party}).eq("id",1); if (error) problems.push("posizione: "+error.message); }
    if (b.world){ const {day, minutes, region, weather} = b.world; const {error} = await sb.from("world").update({day, minutes, region, weather}).eq("id",1); if (error) problems.push("orologio: "+error.message); }
    if (Array.isArray(b.maps) && b.maps.length){ const {error} = await sb.from("maps").upsert(b.maps); if (error) problems.push("mappe: "+error.message); }
    const up = async (table, rows, label, fix) => { if (!Array.isArray(rows) || !rows.length) return;
      let {error} = await sb.from(table).upsert(rows); if (error && fix){ ({error} = await sb.from(table).upsert(rows.map(fix))); }
      if (error) problems.push(label+": "+error.message); };
    await up("handouts", b.handouts, "handout");
    await up("codex", b.codex, "codex");
    await up("codex_secrets", b.codex_secrets, "note segrete del codex");
    await up("journal", b.journal, "diario", r=>({...r, author:null}));
    await up("recipes", b.recipes, "ricettario");
    await up("sounds", b.sounds, "suoni");
    await up("spells_custom", b.spells_custom, "incantesimi del gruppo", r=>({...r, created_by:null}));
    await up("scenes", b.scenes, "mappe da battaglia");
    await up("scene_state", b.scene_state, "nebbia delle mappe");
    await up("tokens", b.tokens, "pedine", r=>({...r, combatant_id:null}));
    await up("areas", b.areas, "aree", r=>({...r, created_by:null}));
    await up("clocks", b.clocks, "orologi di scena");
    await camp.reload(); setBusy(false); setPending(null);
    setMsg(`Ripristinate ${okChars} schede su ${b.characters.length}.` + (problems.length ? " Attenzione: "+problems.join("; ")+"." : ""));
  };
  return html`<section className="panel">
    <div className="panel-h"><h3>Backup</h3></div>
    <p className="muted" style=${{margin:0,fontSize:".88rem"}}>Salva sul tuo computer impostazioni della campagna, schede, posizione del gruppo, segnaposti, orologio, codex, diario, handout, ricettario, incantesimi aggiunti dal gruppo ed elenco dei suoni. Fallo prima di ogni aggiornamento importante. Immagini e file audio restano su Supabase e non sono nel file.</p>
    <div className="row">
      <button type="button" className="btn primary" disabled=${busy} onClick=${download}>Scarica backup</button>
      <button type="button" className="btn" disabled=${busy} onClick=${()=>fileIn.current?.click()}>Ripristina da file…</button>
      <input ref=${fileIn} id="bk-file" type="file" accept="application/json,.json" hidden onChange=${e=>readFile(e.target.files[0])}/>
    </div>
    ${pending && html`<div className="confirm" style=${{display:"grid",gap:8}}>
      <span><b>${pending.name}</b> del ${new Date(pending.b.exported_at).toLocaleString("it")}: ${pending.b.characters.length} schede, ${(pending.b.pins||[]).length} segnaposti. Il ripristino sovrascrive le schede con lo stesso identificativo e la posizione del gruppo; quelle nuove create dopo il backup restano.</span>
      <span className="row"><button type="button" className="btn small danger" disabled=${busy} onClick=${restore}>${busy?"Ripristino…":"Ripristina"}</button><button type="button" className="btn small" onClick=${()=>setPending(null)}>Annulla</button></span>
    </div>`}
    ${err && html`<p className="err" role="alert">${err}</p>`}
    ${msg && html`<p className="muted" role="status" style=${{margin:0}}>${msg}</p>`}
  </section>`;
}

const CODEX_KINDS = [["fazione","Fazioni"],["personaggio","Personaggi"],["luogo","Luoghi"],["scoperta","Scoperte"]];
const CODEX_ONE = {fazione:"Fazione", personaggio:"Personaggio", luogo:"Luogo", scoperta:"Scoperta"};
const REP = {"-3":"Ostile","-2":"Diffidente","-1":"Freddo","0":"Neutrale","1":"Cordiale","2":"Amico","3":"Alleato"};
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("it",{day:"numeric",month:"long",year:"numeric"}) : "";

function useHandoutUrls(sb, handouts){
  const [urls, setUrls] = useState({});
  const key = handouts.filter(h=>h.image_path).map(h=>h.id+":"+h.image_path+":"+h.revealed).join("|");
  useEffect(()=>{ let off = false;
    (async()=>{ const out = {};
      for (const h of handouts.filter(h=>h.image_path)){
        const {data} = await sb.storage.from("handouts").createSignedUrl(h.image_path, 60*60*12);
        if (data?.signedUrl) out[h.id] = data.signedUrl;
      }
      if (!off) setUrls(out); })();
    return ()=>{ off = true; };
  },[sb, key]);
  return urls;
}

function HandoutModal({h, url, onClose}){
  useEffect(()=>{ const k = e => { if (e.key==="Escape") onClose(); }; window.addEventListener("keydown", k); return ()=>window.removeEventListener("keydown", k); },[]);
  return html`<div className="modal-back" role="dialog" aria-modal="true" aria-label=${h.title} onClick=${e=>{ if (e.target===e.currentTarget) onClose(); }}>
    <div className="modal handout">
      <div className="eyebrow">Handout${h.revealed_at ? " · "+fmtDate(h.revealed_at) : ""}</div>
      <h2>${h.title || "Senza titolo"}</h2>

      <div className="row"><span className="spacer"></span><button type="button" className="btn primary" onClick=${onClose} autoFocus>Chiudi</button></div>
    </div>

}

function HandoutsTab({sb, me, handouts, members, urls, onOpen, reload}){
  const M = me.isMaster;
  const [editing, setEditing] = useState(null); const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const [announce, setAnnounce] = useState(true); const [confirmDel, setConfirmDel] = useState(null);
  const names = Object.fromEntries(members.map(m=>[m.user_id, m.name]));
  const list = [...handouts].sort((a,b)=> (b.revealed_at||b.created_at).localeCompare(a.revealed_at||a.created_at));
  const save = async (f) => { setBusy(true); setErr("");
    try {
      let image_path = editing?.image_path || null;
      if (f.removeImage) image_path = null;
      if (f.file){ const ext = (f.file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
        const path = `h-${Date.now()}.${ext}`; const up = await sb.storage.from("handouts").upload(path, f.file, {contentType:f.file.type||"image/jpeg"});
        if (up.error) throw new Error("immagine: "+up.error.message); image_path = path; }
      const row = {title:f.title.trim(), body:f.body, audience:f.audience, image_path};
      const r = editing?.id ? await sb.from("handouts").update(row).eq("id", editing.id) : await sb.from("handouts").insert(row);
      if (r.error) throw new Error(r.error.message);
      if (editing?.image_path && editing.image_path !== image_path) sb.storage.from("handouts").remove([editing.image_path]);
      setEditing(null); reload();
    } catch(e){ setErr("Non salvato: "+e.message); }
    setBusy(false); };
  const reveal = async (h, on) => { setErr("");
    const {error} = await sb.from("handouts").update({revealed:on, revealed_at: on ? new Date().toISOString() : h.revealed_at}).eq("id", h.id);
    if (error){ setErr(error.message); return; }
    if (on && announce && h.audience.length===0) await sb.rpc("announce_world", {p_text:`📜 Nuovo handout nel Taccuino: **${h.title}**`});
    reload(); };
  const del = async (h) => { const {error} = await sb.from("handouts").delete().eq("id", h.id); if (error) setErr(error.message);
    else if (h.image_path) sb.storage.from("handouts").remove([h.image_path]); setConfirmDel(null); reload(); };

  if (editing) return html`<${HandoutForm} initial=${editing} members=${members.filter(m=>m.user_id!==me.id)} busy=${busy} onSave=${save} onCancel=${()=>setEditing(null)}/>`;
  return html`<div style=${{display:"grid",gap:12}}>
    ${M && html`<div className="row"><button type="button" className="btn primary" onClick=${()=>setEditing({})}>+ Nuovo handout</button>
      <span className="spacer"></span><label className="row" style=${{gap:6,fontSize:".88rem"}}><input id="ho-ann" type="checkbox" checked=${announce} onChange=${e=>setAnnounce(e.target.checked)}/>Avvisa su Discord quando rivelo a tutti</label></div>`}
    ${list.length===0 && html`<div className="empty"><h3>Nessun handout</h3><p className="muted">${M ? "Prepara lettere, mappe parziali, murali o indizi come bozza e rivelali al momento giusto: compariranno a tutto schermo sui dispositivi dei giocatori." : "Quando il master rivela una lettera, un indizio o un’immagine, la ritrovi qui."}</p></div>`}
    <div className="ho-grid">${list.map(h=>html`<article key=${h.id} className=${"ho-card"+(h.revealed?"":" draft")}>
      ${urls[h.id] ? html`<button type="button" className="ho-thumb" onClick=${()=>onOpen(h)}><img src=${urls[h.id]} alt=""/></button>` : null}
      <div className="ho-meta">
        <div className="eyebrow">${h.revealed ? "Rivelato "+(h.revealed_at?fmtDate(h.revealed_at):"") : "Bozza · solo tu la vedi"}${h.audience.length ? " · per "+h.audience.map(id=>names[id]||"?").join(", ") : ""}</div>
        <h3><button type="button" className="linkish" onClick=${()=>onOpen(h)}>${h.title||"Senza titolo"}</button></h3>
        ${h.body && html`<p className="muted clamp">${h.body}</p>`}
      </div>
      ${M && html`<div className="row">
        ${h.revealed ? html`<button type="button" className="btn small" onClick=${()=>reveal(h,false)}>Nascondi</button>`
          : html`<button type="button" className="btn small primary" onClick=${()=>reveal(h,true)}>Rivela</button>`}
        ${h.revealed && html`<button type="button" className="btn small" title="Lo rimostra a schermo a tutti" onClick=${()=>reveal(h,true)}>Rimostra</button>`}
        <button type="button" className="btn small" onClick=${()=>setEditing({...h, removeImage:false})}>Modifica</button>
        <span className="spacer"></span>
        ${confirmDel===h.id ? html`<span className="confirm">Eliminare?<button type="button" className="btn small danger" onClick=${()=>del(h)}>Elimina</button><button type="button" className="btn small" onClick=${()=>setConfirmDel(null)}>No</button></span>`
          : html`<button type="button" className="btn small danger" onClick=${()=>setConfirmDel(h.id)}>Elimina</button>`}
      </div>`}
    </article>`)}</div>
    ${err && html`<p className="err" role="alert">${err}</p>`}
  </div>`;
}

function CodexTab({sb, me, codex, secrets, reload}){
  const M = me.isMaster;
  const [kind, setKind] = useState(()=>lsGet("codexKind","fazione"));
  const [editing, setEditing] = useState(null); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const [notes, setNotes] = useState({}); const [q, setQ] = useState("");
  useEffect(()=>lsSet("codexKind",kind),[kind]);
  const list = codex.filter(c=>c.kind===kind && (!q || (c.name+" "+c.summary).toLowerCase().includes(q.toLowerCase())))
    .sort((a,b)=> (b.revealed - a.revealed) || a.name.localeCompare(b.name));
  const save = async (f) => { setBusy(true); setErr("");
    const row = {kind:f.kind, name:f.name.trim(), summary:f.summary, reputation:f.reputation, revealed:f.revealed, updated_at:new Date().toISOString()};
    let id = f.id, r;
    if (id) r = await sb.from("codex").update(row).eq("id", id);
    else { r = await sb.from("codex").insert(row).select("id").single(); id = r.data?.id; }
    if (!r.error && id) r = await sb.from("codex_secrets").upsert({id, notes:f.secret||""});
    setBusy(false); if (r.error) { setErr("Non salvato: "+r.error.message); return; }
    setEditing(null); reload(); };
  const quick = async (c, patch) => { const {error} = await sb.from("codex").update({...patch, updated_at:new Date().toISOString()}).eq("id", c.id); if (error) setErr(error.message); reload(); };
  const saveNote = async (c) => { const t = notes[c.id]; if (t===undefined) return;
    const {data, error} = await sb.rpc("set_codex_note", {p_id:c.id, p_text:t}); if (error || !data) setErr("Nota non salvata"+(error?": "+error.message:""));
    else { setNotes(x=>{ const y={...x}; delete y[c.id]; return y; }); reload(); } };
  const del = async (c) => { const {error} = await sb.from("codex").delete().eq("id", c.id); if (error) setErr(error.message); setEditing(null); reload(); };

  if (editing) return html`<${CodexForm} initial=${editing} busy=${busy} onSave=${save} onCancel=${()=>setEditing(null)} onDelete=${editing.id ? ()=>del(editing) : null}/>`;
  return html`<div style=${{display:"grid",gap:12}}>
    <div className="row">
      <div className="planes" role="group" aria-label="Sezione del codex">${CODEX_KINDS.map(([k,n])=>html`<button type="button" key=${k} aria-pressed=${kind===k} onClick=${()=>setKind(k)}>${n} <span className="muted">${codex.filter(c=>c.kind===k).length}</span></button>`)}</div>
      <span className="spacer"></span>
      <input id="cx-q" className="field" style=${{maxWidth:220}} placeholder="Cerca…" value=${q} onChange=${e=>setQ(e.target.value)}/>
      ${M && html`<button type="button" className="btn primary" onClick=${()=>setEditing({kind, name:"", summary:"", reputation:0, revealed:false, secret:""})}>+ Nuova voce</button>`}
    </div>
    ${list.length===0 && html`<div className="empty"><p className="muted">${M ? `Nessuna voce in “${CODEX_KINDS.find(k=>k[0]===kind)[1]}”. Le voci nuove restano nascoste finché non le riveli.` : "Ancora niente qui: le voci compaiono quando il gruppo le scopre."}</p></div>`}
    <div className="cx-grid">${list.map(c=>html`<article key=${c.id} className=${"cx-card"+(c.revealed?"":" draft")}>
      <div className="row" style=${{alignItems:"baseline"}}>
        <h3 style=${{flex:"1 1 auto"}}>${c.name||"Senza nome"}</h3>
        ${!c.revealed && html`<span className="chip">nascosta</span>`}
      </div>
      ${c.kind==="fazione" && html`<div className="rep" aria-label=${"Reputazione: "+REP[c.reputation]}>
        <div className="rep-bar">${[-3,-2,-1,0,1,2,3].map(v=>html`<span key=${v} className=${"rep-seg"+(v===c.reputation?" on":"")+(v<0?" neg":v>0?" pos":"")}></span>`)}</div>
        <span className=${"chip"+(c.reputation<0?" bad":c.reputation>0?" gold":"")}>${REP[c.reputation]}</span>
        ${M && html`<span className="row" style=${{gap:4}}><button type="button" className="iconbtn" aria-label="Peggiora la reputazione" disabled=${c.reputation<=-3} onClick=${()=>quick(c,{reputation:c.reputation-1})}>−</button><button type="button" className="iconbtn" aria-label="Migliora la reputazione" disabled=${c.reputation>=3} onClick=${()=>quick(c,{reputation:c.reputation+1})}>+</button></span>`}
      </div>`}
      ${c.summary && html`<p style=${{margin:0,whiteSpace:"pre-wrap"}}>${c.summary}</p>`}
      ${M && secrets[c.id]?.notes && html`<div className="secret"><span className="eyebrow">Solo per te</span><p style=${{margin:0,whiteSpace:"pre-wrap"}}>${secrets[c.id].notes}</p></div>`}
      ${c.revealed && html`<label className="lab">Note del gruppo
        <textarea className="field" style=${{minHeight:60}} value=${notes[c.id] ?? c.party_notes} placeholder="Cosa sappiamo, cosa ci hanno promesso…" onChange=${e=>setNotes(x=>({...x,[c.id]:e.target.value}))} onBlur=${()=>saveNote(c)}></textarea></label>`}
      ${M && html`<div className="row">
        <button type="button" className="btn small" onClick=${()=>quick(c,{revealed:!c.revealed})}>${c.revealed?"Nascondi":"Rivela al gruppo"}</button>
        <button type="button" className="btn small" onClick=${()=>setEditing({...c, secret:secrets[c.id]?.notes||""})}>Modifica</button></div>`}
    </article>`)}</div>
    ${err && html`<p className="err" role="alert">${err}</p>`}
  </div>`;
}

function JournalTab({sb, me, journal, names, world, reload}){

const SPELL_SCHOOLS = ["Abiurazione","Ammaliamento","Divinazione","Evocazione","Illusione","Invocazione","Necromanzia","Trasmutazione"];
const SPELL_CLASSES = ["Bardo","Chierico","Druido","Mago","Paladino","Ranger","Stregone","Warlock"];
const SRD_NOTE = "Questo lavoro include materiale tratto dal System Reference Document 5.2 (“SRD 5.2”) di Wizards of the Coast LLC, disponibile su https://www.dndbeyond.com/srd. L’SRD 5.2 è concesso in licenza Creative Commons Attribuzione 4.0 Internazionale (https://creativecommons.org/licenses/by/4.0/legalcode). Testi tradotti in italiano e adattati (unità in metri) per il Taccuino.";
const SpellsCtx = React.createContext(null);
let SRD_CACHE = null, SRD_PROMISE = null;
function loadSrd(){
  if (!SRD_PROMISE) SRD_PROMISE = fetch("spells.json").then(r=>{ if (!r.ok) throw new Error("errore "+r.status); return r.json(); })
    .then(j=>(SRD_CACHE = Array.isArray(j) ? j : j.spells)).catch(e=>{ SRD_PROMISE = null; throw e; });
  return SRD_PROMISE;
}
const fold = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`]/g,"'").toLowerCase().replace(/\s+/g," ").trim();
const spellLevelLabel = (s) => s.level===0 ? `Trucchetto${s.school?" di "+s.school:""}` : `${s.school||"Incantesimo"} di ${s.level}° livello`;
const spellSummary = (s) => [String(s.casting||"").split(",")[0], s.range, String(s.duration||"").replace(/^Concentrazione, f/,"F")].filter(Boolean).join(" · ");

function useSpellBook(customRows){
  const [srd, setSrd] = useState(SRD_CACHE); const [err, setErr] = useState("");
  useEffect(()=>{ if (srd) return; let off = false;
    loadSrd().then(x=>{ if (!off) setSrd(x); }).catch(e=>{ if (!off) setErr("Compendio non disponibile: "+e.message); });
    return ()=>{ off = true; }; },[]);
  return useMemo(()=>{
    const base = (srd||[]).map(s=>({...s, key:s.idx, f:fold(s.name), fe:fold(s.name_en)}));
    const custom = (customRows||[]).map(s=>({...s, key:"c:"+s.id, custom:true, f:fold(s.name), fe:""}));
    const all = [...base, ...custom].sort((a,b)=>a.level-b.level || a.name.localeCompare(b.name,"it"));
    const byKey = new Map(all.map(s=>[s.key,s])); const byName = new Map();
    for (const s of [...base, ...custom]){ if (s.fe) byName.set(s.fe, s); byName.set(s.f, s); }
    const find = (x) => (x && ((x.ref && byKey.get(x.ref)) || byName.get(fold(x.name)))) || null;
    const search = (q, n=8) => { const t = fold(q); if (!t) return [];
      const score = s => s.f.startsWith(t) ? 0 : s.f.includes(" "+t) ? 1 : s.fe.startsWith(t) ? 2 : s.f.includes(t) ? 3 : s.fe.includes(t) ? 4 : 9;
      return all.map(s=>[score(s),s]).filter(([k])=>k<9).sort((a,b)=>a[0]-b[0] || a[1].name.localeCompare(b[1].name,"it")).slice(0,n).map(x=>x[1]); };
    return {all, find, search, byKey, ready: !!srd, err};
  },[srd, customRows, err]);
}

function SpellBody({s, names}){
  const comp = s.components + (s.material ? ` (${s.material})` : "");
  const para = (t, i) => { const m = /^([A-ZÀ-Ý0-9][^.:]{1,38})([.:]) (.+)$/s.exec(t);
    return i>0 && m && m[1].split(" ").length<=4 && m[1].length<=32 ? html`<p key=${i}><b>${m[1]}${m[2]}</b> ${m[3]}</p>` : html`<p key=${i}>${t}</p>`; };
  return html`<div className="sp-body">
    <div className="eyebrow">${spellLevelLabel(s)}${s.ritual?" (rituale)":""}</div>
    <dl className="sp-meta">
      <div><dt>Tempo di lancio</dt><dd>${s.casting||"—"}</dd></div>
      <div><dt>Gittata</dt><dd>${s.range||"—"}</dd></div>
      <div><dt>Componenti</dt><dd>${comp||"—"}</dd></div>
      <div><dt>Durata</dt><dd>${s.duration||"—"}</dd></div>
    </dl>
    <div className="sp-desc">${String(s.description||"").split("\n").filter(Boolean).map(para)}</div>
    ${s.higher && html`<div className="sp-desc">${s.level===0 ? String(s.higher).split("\n").map((t,k)=>para(t,k+1)) : html`<p><b>Usando uno slot di livello superiore.</b> ${s.higher}</p>`}</div>`}
    <div className="sp-foot">${s.classes?.length ? html`<span>Classi: ${s.classes.join(", ")}</span>` : null}
      <span className="muted">${s.custom ? "Aggiunto dal gruppo"+(names?.[s.created_by] ? " · "+names[s.created_by] : "") : "SRD 5.2 · CC BY 4.0"}</span></div>
  </div>`;
}

function SpellModal({s, onClose, names, children}){
  useEffect(()=>{ const k = e => { if (e.key==="Escape") onClose(); }; window.addEventListener("keydown", k); return ()=>window.removeEventListener("keydown", k); },[]);

const canHover = () => { try { return window.matchMedia("(hover: hover) and (pointer: fine)").matches; } catch(e){ return false; } };

function SpellName({x, ro, onType, onPick}){
  const book = useContext(SpellsCtx);
  const [open, setOpen] = useState(false); const [hi, setHi] = useState(0);
  const [pop, setPop] = useState(null); const [modal, setModal] = useState(false);
  const wrap = useRef(null); const inp = useRef(null); const tm = useRef(0);
  const match = book ? book.find(x) : null;
  const rawSugg = !ro && open && book && x.name.trim().length>=2 ? book.search(x.name, 8) : [];
  const sugg = (rawSugg.length===1 && match && rawSugg[0].key===match.key && fold(x.name)===rawSugg[0].f) ? [] : rawSugg;
  const pick = (s) => { onPick(s); setOpen(false); };
  const showPop = () => { clearTimeout(tm.current);
    tm.current = setTimeout(()=>{ if (!wrap.current || document.activeElement===inp.current) return;
      const r = wrap.current.getBoundingClientRect(); const w = Math.min(440, window.innerWidth-32);
      const left = Math.max(16, Math.min(r.left, window.innerWidth - w - 16));
      const below = window.innerHeight - r.bottom > 320 || r.top < window.innerHeight/2;
      setPop(below ? {left, top:r.bottom+6, w} : {left, bottom:window.innerHeight - r.top + 6, w}); }, 350); };
  const hidePop = () => { clearTimeout(tm.current); tm.current = setTimeout(()=>setPop(null), 180); };
  useEffect(()=>()=>clearTimeout(tm.current),[]);
  const onKey = (e) => {
    if (!sugg.length) return;
    if (e.key==="ArrowDown"){ e.preventDefault(); setHi(h=>(h+1)%sugg.length); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); setHi(h=>(h-1+sugg.length)%sugg.length); }
    else if (e.key==="Enter"){ e.preventDefault(); pick(sugg[Math.min(hi, sugg.length-1)]); }
    else if (e.key==="Escape"){ setOpen(false); } };
  const lid = "sp-sug-"+x.id;
  return html`<div className="sp-name" ref=${wrap} onMouseEnter=${()=>{ if (match && canHover()) showPop(); }} onMouseLeave=${hidePop}>
    <input ref=${inp} id=${"sp-n-"+x.id} className="field" value=${x.name||""} placeholder="Incantesimo (scrivi per cercare)" aria-label="Nome incantesimo"
      role="combobox" aria-expanded=${sugg.length>0} aria-controls=${lid} aria-autocomplete="list" autoComplete="off"
      onFocus=${()=>{ setOpen(true); setPop(null); }} onBlur=${()=>setTimeout(()=>setOpen(false),120)} onKeyDown=${onKey}
      onChange=${e=>{ onType(e.target.value); setOpen(true); setHi(0); }}/>
    ${match && html`<span role="button" tabIndex="0" className="sp-info" title="Cosa fa" aria-label=${"Descrizione di "+match.name}
      onClick=${()=>{ setPop(null); setModal(true); }} onKeyDown=${e=>{ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); setModal(true); } }}>i</span>`}
    ${sugg.length>0 && html`<ul className="sp-sug" id=${lid} role="listbox">${sugg.map((s,k)=>html`<li key=${s.key} role="option" aria-selected=${k===hi}
      onMouseDown=${e=>{ e.preventDefault(); pick(s); }} onMouseEnter=${()=>setHi(k)}>
      <span className="sp-lv">${s.level===0?"T":s.level}</span><span className="sp-sn"><b>${s.name}</b><span className="muted">${s.custom?"homebrew":s.name_en} · ${s.school}</span></span></li>`)}</ul>`}
    ${pop && match && ReactDOM.createPortal(html`<div className="sp-pop" style=${{left:pop.left, top:pop.top, bottom:pop.bottom, width:pop.w}}
      onMouseEnter=${()=>clearTimeout(tm.current)} onMouseLeave=${hidePop}>
      <h3 style=${{margin:0}}>${match.name}</h3><${SpellBody} s=${match}/></div>`, document.body)}
    ${modal && match && html`<${SpellModal} s=${match} onClose=${()=>setModal(false)}/>`}
  </div>`;
}

/* ---------- impostazioni della campagna (solo master) ---------- */
const wToText = (w) => w.map(([n,p,note])=>`${n} ${p}${note?" — "+note:""}`).join("\n");
const textToW = (t) => String(t||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
  const m = /^(.+?)(?:\s+(\d{1,2}))?\s*(?:[—–]|\s-\s|:)\s*(.+)$/.exec(l) || /^(.+?)(?:\s+(\d{1,2}))?$/.exec(l);
  return [m[1].trim(), Math.max(1, parseInt(m[2]||"1",10)), (m[3]||"").trim()]; });
const toForm = (cfg) => { const c = JSON.parse(JSON.stringify(normCfg(cfg))); c.regions.forEach(r=>{ r._wt = wToText(r.w); }); return c; };

function CampaignSettings({sb, me, config, setConfig}){
  const [f, setF] = useState(()=>toForm(config)); const [dirty, setDirty] = useState(false);
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(""); const [msg, setMsg] = useState("");
  const [code, setCode] = useState(null); const [codeIn, setCodeIn] = useState(""); const [codeMsg, setCodeMsg] = useState("");
  const [confirmPreset, setConfirmPreset] = useState(false);
  useEffect(()=>{ if (!dirty) setF(toForm(config)); },[JSON.stringify(config)]);
  useEffect(()=>{ sb.rpc("get_invite_code").then(({data, error})=>{ if (!error){ setCode(data||""); setCodeIn(data||""); } }); },[sb]);
  const up = (fn) => { setF(p=>{ const c = JSON.parse(JSON.stringify(p)); fn(c); return c; }); setDirty(true); setMsg(""); };
  const move = (arr, i, d) => { const j = i+d; if (j<0 || j>=arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
  const save = async () => { setErr(""); setMsg("");

function fadeVol(el, from, to, ms, done){
  const t0 = performance.now(); el.volume = Math.max(0, Math.min(1, from));
  const step = (t) => { const k = Math.min(1, (t - t0) / ms); el.volume = Math.max(0, Math.min(1, from + (to - from) * k));
    if (k < 1) requestAnimationFrame(step); else if (done) done(); };
  requestAnimationFrame(step);
}

/* ---------- YouTube ---------- */
function parseYtTime(s){ if (!s) return 0; if (/^\d+$/.test(s)) return Number(s);
  const m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(s); return m ? (Number(m[1]||0)*3600 + Number(m[2]||0)*60 + Number(m[3]||0)) : 0; }
function parseYtLink(input){
  const u = String(input||"").trim(); if (!u) return null;
  if (/^[\w-]{11}$/.test(u)) return {v:u};
  let url; try { url = new URL(/^https?:\/\//i.test(u) ? u : "https://"+u); } catch(e){ return null; }
  const host = url.hostname.replace(/^www\.|^m\.|^music\./,"");
  if (!["youtube.com","youtu.be","youtube-nocookie.com"].includes(host)) return null;
  let v = "";
  if (host==="youtu.be") v = url.pathname.slice(1).split("/")[0];
  else { const m = /^\/(?:shorts|embed|live|v)\/([\w-]{11})/.exec(url.pathname); v = m ? m[1] : (url.searchParams.get("v")||""); }
  if (v && !/^[\w-]{11}$/.test(v)) v = "";
  const list = (url.searchParams.get("list")||"").replace(/[^\w-]/g,"");
  const t = parseYtTime(url.searchParams.get("t") || url.searchParams.get("start") || "");
  if (!v && !list) return null;
  const out = {}; if (v) out.v = v; if (list) out.list = list; if (t) out.t = t; return out;
}
const ytToString = (p) => new URLSearchParams(Object.entries(p).map(([k,v])=>[k,String(v)])).toString();
const ytRead = (s) => { const q = new URLSearchParams(s||""); return {v:q.get("v")||"", list:q.get("list")||"", t:Number(q.get("t")||0)}; };
const ytWatchUrl = (s) => { const p = ytRead(s); return p.v ? `https://www.youtube.com/watch?v=${p.v}${p.list?"&list="+p.list:""}` : `https://www.youtube.com/playlist?list=${p.list}`; };

let YT_PROMISE = null;
function loadYT(){
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (!YT_PROMISE) YT_PROMISE = new Promise((res, rej) => {
    const fail = (e) => { YT_PROMISE = null; rej(e); };
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch(e){} res(window.YT); };
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.async = true;
    s.onerror = () => fail(new Error("rete")); document.head.appendChild(s);
    setTimeout(()=>{ if (!(window.YT && window.YT.Player)) fail(new Error("tempo scaduto")); }, 20000);
  });
  return YT_PROMISE;
}

/* Riquadro di YouTube: deve restare visibile (regole di YouTube), almeno 200×200. */
function YtPlayer({sound, level, startedAt, stopping, onStopped, onStatus}){
  const host = useRef(null); const api = useRef(null); const lv = useRef(level);
  const [msg, setMsg] = useState(""); const [side, setSide] = useState(()=>lsGet("ytSide","right"));
  useEffect(()=>lsSet("ytSide", side),[side]);
  useEffect(()=>{
    let dead = false, p = null, started = false, timer = 0, fadeT = 0, cur = 0;
    const prm = ytRead(sound.youtube);
    const setV = (v) => { cur = Math.max(0, Math.min(1, v)); try { p && p.setVolume(Math.round(cur*100)); } catch(e){} };
    const fade = (to, ms, done) => { clearInterval(fadeT); const from = cur, t0 = Date.now();
      fadeT = setInterval(()=>{ const k = Math.min(1, (Date.now()-t0)/ms); setV(from + (to-from)*k); if (k>=1){ clearInterval(fadeT); if (done) done(); } }, 60); };
    api.current = { fade, setV, playing: () => started };
    loadYT().then(YT => {
      if (dead || !host.current) return;
      const div = document.createElement("div"); host.current.innerHTML = ""; host.current.appendChild(div);
      const vars = {autoplay:1, playsinline:1, rel:0, modestbranding:1, start:prm.t||0};
      if (prm.list){ vars.listType = "playlist"; vars.list = prm.list; }
      p = new YT.Player(div, {width:"100%", height:"100%", videoId: prm.v || undefined, playerVars: vars, events:{
        onReady: (e) => { if (dead) return; setV(0); try { e.target.playVideo(); } catch(x){}
          timer = setTimeout(()=>{ if (!started && !dead){ setMsg("Tocca ▶ qui sopra per far partire l’audio su questo dispositivo."); onStatus && onStatus("attesa"); } }, 3500); },
        onStateChange: (e) => {
          if (e.data === 1){
            if (!started){ started = true; setMsg(""); onStatus && onStatus("ok");
              if (prm.list) try { p.setLoop(true); } catch(x){}
              const el = startedAt ? (Date.now() - Date.parse(startedAt))/1000 : 0; const dur = p.getDuration ? p.getDuration() : 0;
              if (!prm.list && el > 8 && dur > 30) p.seekTo(((prm.t||0) + el) % dur, true);
              fade(lv.current, 1500); }
          }
          if (e.data === 0 && !prm.list){ p.seekTo(prm.t||0, true); p.playVideo(); }
        },
        onError: (e) => { const c = e.data;
          setMsg(c===101||c===150 ? "Il proprietario di questo video non permette di riprodurlo fuori da YouTube: scegline un altro."
            : c===100 ? "Video non trovato, privato o rimosso." : "YouTube non riesce a riprodurre questo link.");
          onStatus && onStatus("errore"); } }});
    }).catch(()=>{ if (!dead){ setMsg("Non riesco a caricare YouTube: controlla la connessione."); onStatus && onStatus("errore"); } });
    return () => { dead = true; clearTimeout(timer); clearInterval(fadeT); try { p && p.destroy(); } catch(e){} api.current = null; };
  },[sound.id, sound.youtube]);
  useEffect(()=>{ lv.current = level; if (api.current && api.current.playing()) api.current.setV(level); },[level]);
  useEffect(()=>{ if (!stopping) return; if (api.current && api.current.playing()) api.current.fade(0, 1200, onStopped); else onStopped(); },[stopping]);
  return ReactDOM.createPortal(html`<div className=${"ytbox "+side} role="region" aria-label="Sottofondo da YouTube">
    <div className="ytbar"><span className="ytname" title=${sound.name}>♪ ${sound.name}</span>
      <button type="button" className="iconbtn" title="Sposta dall’altra parte" aria-label="Sposta il riquadro" onClick=${()=>setSide(side==="right"?"left":"right")}>⇄</button></div>
    <div className="ytframe" ref=${host}></div>
    ${msg && html`<p className="ytmsg">${msg}</p>`}
  </div>`, document.body);
}

    document.addEventListener("pointerdown", h); return ()=>document.removeEventListener("pointerdown", h); },[open]);
  const getUrl = useCallback(async (s) => {
    const c = cache.current[s.id]; if (c && c.path===s.path && c.exp > Date.now()) return c.url;
    const {data} = await sb.storage.from("suoni").createSignedUrl(s.path, 60*60*12);
    if (!data?.signedUrl) return null; cache.current[s.id] = {url:data.signedUrl, path:s.path, exp:Date.now()+11*3600*1000}; return data.signedUrl;
  },[sb]);
  const playsHere = !!audio && (audio.mode==="online" || me.isMaster);
  const active = enabled && !muted && playsHere;
  const amb = audio && sounds.find(s=>s.id===audio.ambient_id && s.kind==="ambiente");

  /* sottofondo con dissolvenza */
  useEffect(()=>{ const my = ++token.current;
    (async()=>{
      const target = active && amb ? amb : null;
      if ((cur.current.id||null) === (target?.id||null)) return;
      const prev = cur.current; const old = prev.el; cur.current = {el:null, id:target?.id||null};
      if (old) fadeVol(old, old.volume, 0, 1200, ()=>{ old.pause(); old.src = ""; });
      if (prev.yt) setYt(y => y && y.sound.id===prev.id ? {...y, stopping:true} : y);
      if (!target) return;
      if (target.youtube){ cur.current = {yt:true, id:target.id}; setYtStatus(""); setErr(""); setYt({sound:target}); return; }
      const url = await getUrl(target); if (!url || my !== token.current) return;
      const el = new Audio(url); el.loop = true; el.volume = 0;
      try { await el.play(); } catch(e){ setErr("Il browser ha bloccato l’audio: tocca “Attiva l’audio”."); setEnabled(false); return; }
      if (my !== token.current){ el.pause(); return; }
      cur.current = {el, id:target.id}; setErr("");
      fadeVol(el, 0, vol * (target.volume ?? 1), 1500);
    })();
  },[active, amb?.id, amb?.path, amb?.youtube]);
  useEffect(()=>{ if (cur.current.el && amb) cur.current.el.volume = Math.min(1, vol * (amb.volume ?? 1)); },[vol, amb?.volume]);
  useEffect(()=>()=>{ if (cur.current.el) cur.current.el.pause(); },[]);

  /* effetti singoli */
  useEffect(()=>{
    if (!audio?.effect_id || !audio.effect_at) return;
    const key = audio.effect_id + "@" + audio.effect_at; if (lastFx.current === key) return; lastFx.current = key;
    if (!active || Date.now() - Date.parse(audio.effect_at) > 15000) return;
    const s = sounds.find(x=>x.id===audio.effect_id); if (!s) return;
    getUrl(s).then(u=>{ if (!u) return; const el = new Audio(u); el.volume = Math.min(1, vol * (s.volume ?? 1)); el.play().catch(()=>{}); });
  },[audio?.effect_at, active]);

  /* il PC del master cambia musica quando cambia la regione */
  useEffect(()=>{
    if (!me.isMaster || !audio?.auto_region || !world) return;
    const s = sounds.find(x=>x.kind==="ambiente" && x.region===world.region);
    if (s && s.id !== audio.ambient_id) sb.from("audio_state").update({ambient_id:s.id, ambient_started:new Date().toISOString(), updated_at:new Date().toISOString()}).eq("id",1);
  },[world?.region, audio?.auto_region, sounds.length]);

  const unlock = () => { try { const a = new Audio(SILENT_WAV); a.play().catch(()=>{}); } catch(e){} setEnabled(true); setMuted(false); setErr(""); };
  if (!audio) return null;
  const status = !playsHere ? "Al tavolo: la musica suona sul PC del master" : !enabled ? "Audio spento su questo dispositivo" : muted ? "Silenziato"
    : amb ? (amb.youtube && ytStatus==="attesa" ? "Tocca ▶ nel riquadro di YouTube per sentire "+amb.name : amb.youtube && ytStatus==="errore" ? "YouTube non riesce a riprodurre "+amb.name : "In riproduzione: "+amb.name) : "Nessun sottofondo";
  const ytSound = yt && amb && amb.id===yt.sound.id ? amb : yt?.sound;
  return html`<div className="audioctl" ref=${box}>
    <button type="button" className=${"btn small audiobtn"+(active&&amb?" on":"")} aria-expanded=${open} aria-label="Audio" title=${status}
      onClick=${()=>{ if (!enabled && playsHere) unlock(); setOpen(!open); }}><${SpeakerIcon} on=${active}/></button>
    ${open && html`<div className="audiopop" role="dialog" aria-label="Audio">
      <div className="eyebrow">Audio della sessione</div>
      <p style=${{margin:0}}>${status}</p>
      ${playsHere && !enabled && html`<button type="button" className="btn primary" onClick=${unlock}>Attiva l’audio</button>`}
      ${playsHere && enabled && html`<label className="lab">Volume su questo dispositivo
        <input id="vol" type="range" min="0" max="1" step="0.05" value=${vol} onInput=${e=>setVol(Number(e.target.value))}/></label>
        <label className="row" style=${{gap:6}}><input id="mute" type="checkbox" checked=${muted} onChange=${e=>setMuted(e.target.checked)}/>Silenzia</label>`}
      ${err && html`<p className="err">${err}</p>`}
      <button type="button" className="btn small" onClick=${()=>setOpen(false)}>Chiudi</button>
    </div>`}
    ${yt && html`<${YtPlayer} key=${yt.sound.id+"|"+yt.sound.youtube} sound=${ytSound} level=${Math.min(1, vol*(ytSound.volume ?? 1))} startedAt=${audio.ambient_started}
      stopping=${!!yt.stopping} onStopped=${()=>setYt(y=>y && y.stopping ? null : y)} onStatus=${setYtStatus}/>`}
  </div>`;
}

          <div className="lab">Chi mangia<div className="row" style=${{gap:10}}>${chars.map(c=>html`<label key=${c.id} className="row" style=${{gap:5}}><input type="checkbox" checked=${cooking.targets.includes(c.id)}

          <div className="row"><span className="spacer"></span><button type="button" className="btn" onClick=${()=>setCooking(null)}>Annulla</button>

            <button type="button" className="btn small" onClick=${()=>setEditing({...r})}>Modifica</button>`}

const HP_STATE_LABEL = {"illeso":"Illeso","ferito":"Ferito","malconcio":"Malconcio","allo stremo":"Allo stremo","a terra":"A terra"};
const hpState = (hp, max) => { if (!max || max<=0) return "illeso"; if (hp<=0) return "a terra"; const f=hp/max; return f>=1?"illeso":f>0.5?"ferito":f>0.25?"malconcio":"allo stremo"; };
const orderFighters = (fs) => [...fs].sort((a,b)=> ((b.init??-9999)-(a.init??-9999)) || ((b.dex||0)-(a.dex||0)) || String(a.created_at).localeCompare(String(b.created_at)) || String(a.id).localeCompare(String(b.id)));

function chime(){
  try { const AC = window.AudioContext||window.webkitAudioContext; const ac = chime.ac || (chime.ac = new AC());
    const o=ac.createOscillator(), g=ac.createGain(); const t0=ac.currentTime; o.type="triangle";
    o.frequency.setValueAtTime(660,t0); o.frequency.setValueAtTime(990,t0+.14);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.18,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.5);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+.55); } catch(e){}
  try { navigator.vibrate && navigator.vibrate([120,60,120]); } catch(e){}
}

function Toasts({toasts}){
  return html`<div className="toasts" aria-live="polite">${toasts.map(r=>html`<div key=${r.id} className=${"toast"+(r.nat===20?" crit":r.nat===1?" fumble":"")}>
    <span className="t">${r.who} · ${r.label}${r.hidden?" (nascosto)":""}</span><span className="tot">${r.total}</span><span className="d">${r.detail}</span></div>`)}</div>`;
}

function Feed({rolls}){
  const [, tick] = useState(0);
  useEffect(()=>{ const t = setInterval(()=>tick(x=>x+1), 30000); return ()=>clearInterval(t); },[]);
  return html`<section className="panel">
    <div className="panel-h"><h3>Tiri del gruppo</h3></div>
    ${rolls.length===0 ? html`<p className="muted" style=${{margin:0}}>Ancora nessun tiro. Tocca un valore sulla scheda o usa i dadi.</p>` :
    html`<ol className="feed">${rolls.slice(0,60).map(r=>html`<li key=${r.id} className=${"fi"+(r.nat===20?" crit":r.nat===1?" fumble":"")+(r.hidden?" hid":"")}>
      <div className="fi-main"><div><b>${r.who}</b> <span className="muted">· ${r.label}</span></div><div className="fi-det mono">${r.detail}</div></div>
      <div className="fi-side"><span className="fi-tot mono">${r.total}</span><span className="fi-meta">${r.hidden?"nascosto · ":""}${ago(new Date(r.created_at).getTime())}</span></div></li>`)}</ol>`}
  </section>`;
}

function DiceTray({onFree, master}){
  const [f,setF] = useState(""); const [hid,setHid] = useState(false); const [label,setLabel] = useState(""); const [bad,setBad] = useState(false);
  const roll = (formula) => onFree({formula, label: label.trim() || ("Tiro "+formula), hidden: master && hid});
  return html`<section className="panel">
    <div className="panel-h"><h3>Dadi</h3>${master && html`<label className="row" style=${{gap:6,fontSize:".88rem"}}><input id="dice-hid" type="checkbox" checked=${hid} onChange=${e=>setHid(e.target.checked)}/>Dietro lo schermo</label>`}</div>
    <div className="dice">${[4,6,8,10,12,20,100].map(n=>html`<button type="button" key=${n} className="die" onClick=${()=>roll("1d"+n)}>d${n}</button>`)}</div>
    <form className="dice-form" onSubmit=${e=>{e.preventDefault(); const v=f.trim(); if (v && rollFormula(v)){ setBad(false); roll(v);} else setBad(true);}}>
      <input id="dice-f" className="field mono" placeholder="es. 3d6+2" aria-label="Formula" value=${f} onChange=${e=>{setF(e.target.value); setBad(false);}}/>
      <input id="dice-l" className="field" placeholder="Per cosa? (facoltativo)" aria-label="Descrizione del tiro" value=${label} onChange=${e=>setLabel(e.target.value)}/>

    </form>
    ${bad && html`<p className="err">Scrivi una formula come 2d6+3 o 1d20-1.</p>`}
  </section>`;
}

function TurnBanner({combat, fighters, chars, me, onEndTurn, onRollInit, goTable, onNext}){
  const myChars = new Set(chars.filter(c=>c.owner===me.id).map(c=>c.id));
  const nameOf = f => { const c = f.char_id && chars.find(x=>x.id===f.char_id); return (c && c.name) || f.name || "?"; };
  const waiting = fighters.filter(f=>f.char_id && myChars.has(f.char_id) && f.init==null);
  if (!combat.active && waiting.length) return html`<div className="turnbar prep"><div className="tb-in">
    <span>⚔️ Scontro in arrivo: tira l’iniziativa</span><span className="spacer"></span>
    ${waiting.map(f=>html`<button type="button" key=${f.id} className="btn primary small" onClick=${()=>onRollInit(f)}>Tira per ${nameOf(f)}</button>`)}</div></div>`;
  if (!combat.active) return null;
  const cur = fighters.find(f=>f.id===combat.turn_id);
  const mine = cur && cur.char_id && myChars.has(cur.char_id);
  const ev = cur && cur.kind === "evento";
  return html`<div className=${"turnbar"+(mine?" mine":"")+(ev?" ev":"")}><div className="tb-in">
    <span className="mono">Round ${combat.round}</span>
    <span>${mine ? html`<b>Tocca a te, ${nameOf(cur)}!</b>` : ev ? html`⚡ <b>${cur.name}</b>${cur.note ? html` <span className="muted">— ${cur.note}</span>` : null}`
      : html`Turno di <b>${cur && !(cur.hidden && !me.isMaster) ? nameOf(cur) : "un avversario"}</b>`}</span>
    <span className="spacer"></span>
    ${mine && html`<button type="button" className="btn primary small" onClick=${onEndTurn}>Fine turno</button>`}
    ${me.isMaster && onNext && html`<button type="button" className=${"btn small"+(ev?" primary":"")} onClick=${onNext}>Turno successivo →</button>`}
    <button type="button" className="btn small" onClick=${goTable}>${me.isMaster?"Plancia":"Iniziativa"}</button>
  </div></div>`;
}

function Initiative({combat, fighters, secrets, chars, me, act}){

      <label className="row hidchk"><input id="ev-hid" type="checkbox" checked=${evf.hidden} onChange=${e=>setEvf({...evf,hidden:e.target.checked})}/>Solo per me</label>
      <button className="btn">+ Evento</button>
      <p className="muted" style=${{margin:0,fontSize:".8rem",flexBasis:"100%"}}>Un evento fisso arriva ogni round al suo punteggio, dopo le creature con lo stesso punteggio. Non ha PF e non tira.</p>

    ${fighters.length===0 && html`<p className="muted" style=${{margin:0}}>${M ? "Aggiungi i personaggi e gli avversari, fai tirare l’iniziativa e avvia lo scontro." : "Quando il master prepara uno scontro, qui compare l’ordine dei turni."}</p>`}

      const sec = secrets[f.id]; const cur = combat.active && combat.turn_id===f.id;
      const conds = s ? s.cond : (f.conds||[]); const ev = f.kind === "evento";
      if (ev) return html`<li key=${f.id} className=${"ir ev"+(cur?" cur":"")+(f.hidden?" hid":"")}>
        <span className="ir-init mono">${M ? html`<${Num} id=${"init-"+f.id} value=${f.init??0} label="Iniziativa dell’evento" onChange=${v=>act.setInit(f,v)}/>` : (f.init ?? "—")}</span>

          <div className="ir-name">${cur && html`<span aria-label="turno attuale">▶ </span>`}⚡ ${f.name}${f.hidden && html`<span className="chip" style=${{marginLeft:6}}>solo master</span>`}</div>

      return html`<li key=${f.id} className=${"ir"+(cur?" cur":"")+(f.hidden?" hid":"")+(c?" pc":"")}>
        <span className="ir-init mono">${M ? html`<${Num} id=${"init-"+f.id} value=${f.init??0} label="Iniziativa" onChange=${v=>act.setInit(f,v)}/>` : (f.init ?? "—")}</span>

      <form className="mform" onSubmit=${e=>{e.preventDefault(); if(!form.name.trim()) return; run(async()=>{ const m = await act.addMonsters(form); if(!m) setForm({...form, name:""}); return m; });}}>

        <label className="lab">CA<${Num} id="m-ac" value=${form.ac} min=${0} onChange=${v=>setForm(x=>({...x,ac:v}))}/></label>
        <label className="row hidchk"><input id="m-hid" type="checkbox" checked=${form.hidden} onChange=${e=>setForm({...form,hidden:e.target.checked})}/>Nascosto ai giocatori</label>

      ${evOpen ? evForm : html`<div><button type="button" className="btn small" onClick=${()=>setEvOpen(true)}>+ Evento fisso (es. sussulti a 20)</button></div>`}
      <div className="row">
        ${monstersNoInit.length>0 && html`<button type="button" className="btn" onClick=${()=>run(()=>act.rollMonsters(monstersNoInit))}>Tira iniziativa avversari (${monstersNoInit.length})</button>`}
        <span className="spacer"></span>
        ${fighters.length>0 && html`<button type="button" className="btn small danger" onClick=${()=>run(act.end)}>Svuota</button>`}
        <button type="button" className="btn primary" disabled=${fighters.length===0} onClick=${()=>run(act.start)}>Inizia lo scontro</button>
      </div>
    </div>`}

    ${M && combat.active && html`<div className="setup">${evOpen ? evForm : html`<div><button type="button" className="btn small" onClick=${()=>setEvOpen(true)}>+ Evento fisso</button></div>`}</div>`}

      <button type="button" className="btn" onClick=${()=>run(()=>act.step(-1))}>← Indietro</button>

    </div>`}

  const [amt, setAmt] = useState({}); const [err, setErr] = useState("");
  const go = async (c, kind) => { const n = parseInt(amt[c.id],10); if (isNaN(n)||n<=0) return; setErr("");
    const m = await adjustHp(c.id, kind, n); if (m) setErr(m); else setAmt(x=>({...x,[c.id]:""})); };
  return html`<section className="panel">
    <div className="panel-h"><h3>Il gruppo</h3><span className="muted" style=${{fontSize:".82rem"}}>Danni e cure vanno subito sulla scheda</span></div>
    ${pcs.length===0 && html`<p className="muted" style=${{margin:0}}>Nessuna scheda ancora.</p>`}
    <div className="ps-list">${pcs.map(c=>{ const s=norm(c), D=derived(s); return html`<div key=${c.id} className="ps">
      <div className="ps-top"><b>${s.name||"Senza nome"}</b><span className="muted">${c.owner ? (names[c.owner]||"") : "PNG"}</span><span className="spacer"></span>
        <span className="mono">${s.hp.cur}/${D.effMax}${s.hp.temp?` +${s.hp.temp}`:""}</span></div>
      <div className="hpbar"><i style=${{width:clamp(s.hp.cur/D.effMax*100,0,100)+"%"}}></i></div>
      <div className="ps-bot">
        <span className="muted">CA <b className="mono">${s.ac}</b> · Perc. <b className="mono">${D.passPerc}</b>${D.dc!=null?html` · CD <b className="mono">${D.dc}</b>`:null}</span>
        <span className="spacer"></span>
        <input className="num ps-amt" id=${"ps-"+c.id} inputMode="numeric" placeholder="n" aria-label=${"Quantità per "+(s.name||"personaggio")} value=${amt[c.id]||""} onChange=${e=>setAmt(x=>({...x,[c.id]:e.target.value}))}/>
        <button type="button" className="btn small danger" onClick=${()=>go(c,"dmg")}>Danno</button>
        <button type="button" className="btn small" onClick=${()=>go(c,"heal")}>Cura</button>
      </div>
      ${(s.cond.length>0||s.insp||s.exh>0) && html`<div className="chips">${s.insp && html`<span className="chip gold">★ Ispirazione</span>`}${s.exh>0 && html`<span className="chip bad">Esaurimento ${s.exh}</span>`}${s.cond.map(x=>html`<span key=${x} className="chip bad">${x}</span>`)}</div>`}
    </div>`;})}</div>
    ${err && html`<p className="err" role="alert">${err}</p>`}
  </section>`;
}

function DiscordPanel({sb}){
  const [st, setSt] = useState(null); const [url, setUrl] = useState(""); const [turns, setTurns] = useState(true);
  const [msg, setMsg] = useState(""); const [busy, setBusy] = useState(false);
  const load = useCallback(async()=>{ const {data} = await sb.rpc("discord_status"); if (data){ setSt(data); setTurns(!!data.turns); } },[sb]);
  useEffect(()=>{ load(); },[load]);
  const save = async (u) => { setBusy(true); setMsg("");
    const {data, error} = await sb.rpc("set_discord", {p_url:u, p_turns:turns});
    setBusy(false);
    if (error) setMsg("Errore: "+error.message);
    else if (!data) setMsg("Questo non sembra l’indirizzo di un webhook Discord: deve iniziare con https://discord.com/api/webhooks/");
    else { setMsg(u ? "Collegato: nel canale dovrebbe essere comparso un messaggio di prova." : "Discord scollegato."); setUrl(""); load(); } };
  return html`<section className="panel">
    <div className="panel-h"><h3>Discord</h3><span className="state"><span className=${"dot "+(st?.connected?"ok":"")}></span>${st?.connected?"Collegato":"Non collegato"}</span></div>
    <p className="muted" style=${{margin:0,fontSize:".88rem"}}>Nel canale: Modifica canale → Integrazioni → Webhook → Nuovo webhook → Copia URL del webhook. Arrivano i tiri visibili (non quelli dietro lo schermo) e, se vuoi, i cambi di turno.</p>
    <div className="dice-form">
      <input id="dc-url" className="field" type="password" autoComplete="off" placeholder=${st?.connected?"Incolla un nuovo URL per cambiarlo":"https://discord.com/api/webhooks/…"} value=${url} onChange=${e=>setUrl(e.target.value)}/>
      <button type="button" className="btn primary" disabled=${busy||!url.trim()} onClick=${()=>save(url.trim())}>Collega</button>
    </div>
    <div className="row">
      <label className="row" style=${{gap:6,fontSize:".9rem"}}><input id="dc-turns" type="checkbox" checked=${turns} onChange=${e=>setTurns(e.target.checked)}/>Annuncia i turni di combattimento</label>
      <span className="spacer"></span>
      ${st?.connected && html`<button type="button" className="btn small" disabled=${busy} onClick=${async()=>{ setBusy(true); const {error} = await sb.rpc("set_discord_turns", {p_turns:turns}); setBusy(false); setMsg(error?"Errore: "+error.message:"Preferenza salvata."); load(); }}>Salva preferenza</button>`}
      ${st?.connected && html`<button type="button" className="btn small danger" disabled=${busy} onClick=${()=>save("")}>Scollega</button>`}
    </div>
    ${msg && html`<p className="muted" role="status" style=${{margin:0}}>${msg}</p>`}
  </section>`;
}
