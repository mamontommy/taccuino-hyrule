/* ---------- app ---------- */
function Main({sb, me, onSignOut}){
  const camp = useCampaign(sb, true);
  applyCfg(camp.config);
  useEffect(()=>{ document.title = CFG.name; BRAND = CFG.name; },[CFG.name]);
  const book = useSpellBook(camp.spellsCustom);
  const saveCfg = useCallback(async (fn) => {
    const c = JSON.parse(JSON.stringify(normCfg(camp.config))); const extra = fn(c);
    const {data, error} = await sb.from("campaign").update({config:normCfg(c), updated_at:new Date().toISOString()}).eq("id",1).select("config").maybeSingle();
    if (error || !data) return {error: "Non salvato"+(error ? ": "+error.message : ": solo il master può cambiare le mappe.")};
    camp.setConfig(data.config); return {extra};
  },[sb, camp.config]);
  const sceneOps = useMemo(()=>({
    setScene: async (plane, patch) => { camp.setScenes(x=>({...x, [plane]: {...(x[plane]||{plane, grid:{}, walls:[], lights:[]}), ...patch}}));
      const {error} = await sb.from("scenes").upsert({plane, ...patch, updated_at:new Date().toISOString()}); if (error){ camp.loadScenes(); return "Non salvato: "+error.message; } return ""; },
    setState: async (plane, patch) => { camp.setSceneStates(x=>({...x, [plane]: {...(x[plane]||{plane, fog_mode:"none", fog:[], doors:{}, explored:[]}), ...patch}}));
      const {error} = await sb.from("scene_state").upsert({plane, ...patch, updated_at:new Date().toISOString()});
      if (error){ camp.loadScenes(); return "Non salvato: "+error.message+("locks" in patch && /locks|schema cache|column/i.test(error.message) ? " (esegui fase10.sql)" : ""); } return ""; },
    addTokens: async (plane, rows) => { const {error} = await sb.from("tokens").insert(rows.map(r=>({...r, plane}))); await camp.loadTokens(); return error ? "Pedine non aggiunte: "+error.message : ""; },
    updateToken: async (id, patch) => { camp.setTokens(x=>x.map(t=>t.id===id ? {...t, ...patch} : t));
      const {error} = await sb.from("tokens").update({...patch, updated_at:new Date().toISOString()}).eq("id", id); if (error){ camp.loadTokens(); return "Non salvato: "+error.message; } return ""; },
    deleteToken: async (id) => { camp.setTokens(x=>x.filter(t=>t.id!==id)); const {error} = await sb.from("tokens").delete().eq("id", id); if (error){ camp.loadTokens(); return error.message; } return ""; },
    moveToken: async (id, x, y) => { camp.setTokens(xs=>xs.map(t=>t.id===id ? {...t, x, y} : t));
      if (me.isMaster){ const {error} = await sb.from("tokens").update({x, y, updated_at:new Date().toISOString()}).eq("id", id); if (error){ camp.loadTokens(); return "Pedina non spostata: "+error.message; } return ""; }
      const {data, error} = await sb.rpc("move_token", {p_id:id, p_x:x, p_y:y}); if (error || !data){ camp.loadTokens(); return "Pedina non spostata"+(error?": "+error.message:": puoi muovere solo la tua."); } return ""; },
    addArea: async (plane, row) => { const {data, error} = await sb.from("areas").insert({...row, plane, created_by:me.id}).select("*").maybeSingle();
      if (error) return "Area non salvata"+(/relation|does not exist/.test(error.message) ? ": esegui fase9.sql" : ": "+error.message);
      if (data) camp.setAreas(x=> x.some(a=>a.id===data.id) ? x : [...x, data]); return ""; },
    deleteArea: async (id) => { camp.setAreas(x=>x.filter(a=>a.id!==id)); const {error} = await sb.from("areas").delete().eq("id", id); if (error){ camp.loadAreas(); return error.message; } return ""; },
    setLight: async (id, light) => { camp.setTokens(x=>x.map(t=>t.id===id ? {...t, light: light || null} : t));
      const {data, error} = await sb.rpc("set_token_light", {p_id:id, p_light:light||0});
      if (error || !data){ camp.loadTokens(); return "Luce non salvata"+(error ? (/function|schema cache/i.test(error.message) ? ": esegui fase10.sql" : ": "+error.message) : ""); } return ""; },
    setAura: async (id, aura, color) => { camp.setTokens(x=>x.map(t=>t.id===id ? {...t, aura: aura || null, aura_color: color} : t));
      const {data, error} = await sb.rpc("set_token_aura", {p_id:id, p_aura:aura||0, p_color:color||null}); if (error || !data){ camp.loadTokens(); return "Aura non salvata"+(error?": "+error.message:""); } return ""; },
    markExplored: async (plane, cells) => { const {error} = await sb.rpc("mark_explored", {p_plane:plane, p_cells:cells}); return error ? error.message : ""; },
    toggleDoor: async (plane, idx) => { const {data, error} = await sb.rpc("toggle_door", {p_plane:plane, p_idx:idx}); if (error || !data) return "Porta non aggiornata"+(error?": "+error.message:": è chiusa a chiave.");
      camp.setSceneStates(x=>{ const s0 = x[plane]; if (!s0) return x; const d = {...(s0.doors||{})}; d[idx] = !d[idx]; return {...x, [plane]: {...s0, doors:d}}; }); return ""; },
  }),[sb, me.isMaster]);
  const cfgOps = useMemo(()=> me.isMaster ? {
    addPlane: async (name, dark) => { let key = ""; const r = await saveCfg(c=>{ key = slugKey(name, new Set(c.planes.map(p=>p.k))); c.planes.push({k:key, name, dark:!!dark});
        if (dark){ c.modules.buio = true; if (!c.pinKinds.some(k=>k.light)) c.pinKinds.push({k:slugKey("luce", new Set(c.pinKinds.map(p=>p.k))), name:"Fonte di luce", done:"Accesa", icon:"luce", light:true}); } });
      return r.error ? {error:r.error} : {key}; },
    renamePlane: async (k, name) => { const r = await saveCfg(c=>{ const p = c.planes.find(x=>x.k===k); if (p) p.name = String(name).trim().slice(0,40); }); return r.error || ""; },
    setDark: async (k, dark) => { const r = await saveCfg(c=>{ const p = c.planes.find(x=>x.k===k); if (p) p.dark = !!dark;
        if (dark){ c.modules.buio = true; if (!c.pinKinds.some(x=>x.light)) c.pinKinds.push({k:slugKey("luce", new Set(c.pinKinds.map(p=>p.k))), name:"Fonte di luce", done:"Accesa", icon:"luce", light:true}); } });
      return r.error || ""; },
  } : null, [me.isMaster, saveCfg]);
  const {chars, party, maps, members, ready, error, combat, fighters} = camp;
  const urls = useSignedUrls(sb, maps);
  const names = useMemo(()=>Object.fromEntries(members.map(m=>[m.user_id, m.name])),[members]);
  const [view, setView] = useState(()=>{ const h=(location.hash||"").slice(1); return ["mappa","gruppo","tavolo","cronache","campagna"].includes(h)?h:lsGet("view","gruppo"); });
  const [openId, setOpenId] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [msg, setMsg] = useState("");
  const shown = useRef(new Set());
  const hoUrls = useHandoutUrls(sb, camp.handouts);
  const [hoOpen, setHoOpen] = useState(null);
  const seenKey = h => h.id + "@" + (h.revealed_at || "");
  useEffect(()=>{
    if (me.isMaster || hoOpen) return;
    const seen = new Set(lsGet("seenHandouts", []));
    const fresh = camp.handouts.filter(h=>h.revealed && h.revealed_at && !seen.has(seenKey(h)) && Date.now() - Date.parse(h.revealed_at) < 12*3600*1000)
      .sort((a,b)=>a.revealed_at.localeCompare(b.revealed_at));
    if (fresh.length){ setHoOpen(fresh[0]); chime(); }
  },[camp.handouts, hoOpen]);
  const closeHandout = () => { if (hoOpen){ const seen = lsGet("seenHandouts", []); lsSet("seenHandouts", [...seen.slice(-200), seenKey(hoOpen)]); } setHoOpen(null); };
  useEffect(()=>{ if(view!=="scheda") lsSet("view",view); },[view]);

  const showToast = useCallback((r)=>{
    if (shown.current.has(r.id)) return; shown.current.add(r.id);
    setToasts(x=>[...x.slice(-2), r]);
    setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==r.id)), 9000);
  },[]);
  camp.onNewRoll.current = (row) => { if (row.user_id !== me.id && Date.now() - new Date(row.created_at).getTime() < 60000) showToast(row); };

  const onRoll = useCallback(async (r)=>{
    const call = r.type==="d20"
      ? sb.rpc("roll_d20", {p_label:r.label, p_mod:r.mod||0, p_mode:r.mode||"norm", p_pen:r.pen||0, p_char:r.charId||null, p_hidden:!!r.hidden})
      : sb.rpc("roll_formula", {p_label:r.label, p_formula:r.formula, p_char:r.charId||null, p_hidden:!!r.hidden});
    const {data, error:e} = await call;
    if (e || !data){ setMsg("Tiro non riuscito: "+(e?.message||"nessuna risposta")); return null; }
    camp.addRoll(data); showToast(data); return data.total;
  },[sb, showToast]);
  const onFree = (x) => onRoll({type:"formula", label:x.label, formula:x.formula, hidden:x.hidden});

  const create = async (npc) => { setMsg("");
    const data = {...blankSheet(), name: npc ? "Nuovo PNG" : ""};
    const {data:row, error:e} = await sb.from("characters").insert({owner: npc ? null : me.id, data}).select("id,owner,data").single();
    if (e){ setMsg("Non sono riuscito a creare la scheda: "+e.message); return; }
    camp.setChars(x=> x.some(c=>c.id===row.id) ? x : [...x, rowToChar(row)]);
    setOpenId(row.id); setView("scheda"); };

  const saveSheet = useCallback(async (id, sheet) => {
    const {id:_i, owner:_o, ...data} = sheet;
    const {data:rows, error:e} = await sb.from("characters").update({data, updated_at:new Date().toISOString()}).eq("id", id).select("id");
    if (e) return /fetch|network/i.test(e.message) ? "error" : "denied";
    if (!rows || !rows.length) return "denied";
    camp.setChars(x=>x.map(c=>c.id===id ? {...data, id, owner:c.owner} : c));
    return "ok";
  },[sb]);
  const delSheet = async (id) => { const {error:e} = await sb.from("characters").delete().eq("id", id); if (e) return false;
    camp.setChars(x=>x.filter(c=>c.id!==id)); return true; };

  const adjustHp = async (id, kind, n) => {
    const {data, error:e} = await sb.rpc("adjust_hp", {p_char:id, p_kind:kind, p_amount:n});
    if (e) return "Non riuscito: "+e.message;
    camp.setChars(x=>x.map(c=>c.id===id ? {...c, hp:data} : c)); return "";
  };

  /* combattimento */
  const errText = (e) => e ? (e.message || "Operazione non riuscita") : "";
  const hpTimers = useRef({});
  const act = {
    addPCs: async (list) => { const rows = list.map(c=>{ const D = derived(norm(c)); return {char_id:c.id, name:c.name||"PG", init_mod:D.init, dex:D.init}; });
      const {error:e} = await sb.from("combatants").insert(rows); await camp.loadFighters(); return errText(e); },
    addMonsters: async (f) => { const n = clamp(f.n,1,20);
      const rows = Array.from({length:n},(_,i)=>({name: n>1 ? `${f.name.trim()} ${i+1}` : f.name.trim(), init_mod:f.mod, dex:f.mod, hidden:!!f.hidden}));
      const {data, error:e} = await sb.from("combatants").insert(rows).select("id");
      if (e) return errText(e);
      const {error:e2} = await sb.from("combatant_secrets").insert(data.map(r=>({id:r.id, hp:f.hp, max_hp:f.hp, ac:f.ac})));
      await camp.loadFighters(); return errText(e2); },
    rollInit: async (f) => {
      let mod = f.init_mod||0, pen = 0;
      if (f.char_id){ const c = chars.find(x=>x.id===f.char_id); if (c){ const s=norm(c); mod = derived(s).init; pen = (s.exh||0)*2; } }
      const {error:e} = await sb.rpc("roll_initiative", {p_combatant:f.id, p_mod:mod, p_mode:"norm", p_pen:pen});
      await camp.loadFighters(); return errText(e); },
    rollMonsters: async (list) => { for (const f of list){ const {error:e} = await sb.rpc("roll_initiative", {p_combatant:f.id, p_mod:f.init_mod||0}); if (e){ await camp.loadFighters(); return errText(e);} }
      await camp.loadFighters(); return ""; },
    setInit: async (f, v) => { await sb.from("combatants").update({init:v}).eq("id", f.id); camp.loadFighters(); },
    remove: async (f) => { const {error:e} = await sb.from("combatants").delete().eq("id", f.id); await camp.loadFighters(); return errText(e); },
    setMonsterHp: (f, hp) => { clearTimeout(hpTimers.current[f.id]);
      hpTimers.current[f.id] = setTimeout(async ()=>{ const sec = camp.secrets[f.id] || {};
        await sb.from("combatant_secrets").update({hp}).eq("id", f.id);
        await sb.from("combatants").update({hp_state: hpState(hp, sec.max_hp)}).eq("id", f.id);
        camp.loadFighters(); }, 450); },
    toggleCond: async (f, x) => { const conds = (f.conds||[]).includes(x) ? f.conds.filter(y=>y!==x) : [...(f.conds||[]), x];
      await sb.from("combatants").update({conds}).eq("id", f.id); camp.loadFighters(); },
    start: async () => { const {error:e} = await sb.rpc("start_combat"); return errText(e); },
    step: async (dir) => { const {error:e} = await sb.rpc("step_turn", {p_dir:dir}); return errText(e); },
    end: async () => { const {error:e} = await sb.rpc("end_combat"); await camp.loadFighters(); return errText(e); },
    addEvent: async (f) => { const {error:e} = await sb.from("combatants").insert({name:f.name.trim().slice(0,60), init:clamp(Number(f.init)||0,-10,40), dex:-99, kind:"evento", note:String(f.note||"").trim().slice(0,200), hidden:!!f.hidden});
      await camp.loadFighters(); return e ? "Evento non aggiunto: "+e.message+(/kind|note|schema cache|column/i.test(e.message) ? " (esegui fase10.sql)" : "") : ""; },
  };
  const clockOps = useMemo(()=> me.isMaster ? (()=>{ const o = {
    add: async (row) => { const {error} = await sb.from("clocks").insert({filled:0, ...row, sort: (camp.clocks.reduce((m,k)=>Math.max(m, k.sort||0), 0) + 1)});
      await camp.loadClocks(); return error ? "Orologio non creato: "+error.message : ""; },
    update: async (id, patch) => { camp.setClocks(x=>x.map(k=>k.id===id ? {...k, ...patch} : k));
      const {error} = await sb.from("clocks").update({...patch, updated_at:new Date().toISOString()}).eq("id", id); if (error){ camp.loadClocks(); return "Non salvato: "+error.message; } return ""; },
    step: (k, d) => o.update(k.id, {filled: clamp((Number(k.filled)||0) + d, 0, k.segments)}),
    remove: async (id) => { camp.setClocks(x=>x.filter(k=>k.id!==id)); const {error} = await sb.from("clocks").delete().eq("id", id); if (error){ camp.loadClocks(); return error.message; } return ""; } };
    return o; })() : null, [me.isMaster, sb, camp.clocks]);
  /* avviso ai giocatori quando un orologio avanza o compare */
  const clkSeen = useRef(null);
  useEffect(()=>{ if (!ready) return; const prev = clkSeen.current; clkSeen.current = Object.fromEntries(camp.clocks.map(k=>[k.id, k.filled]));
    if (!prev || me.isMaster) return; let ring = false;
    for (const k of camp.clocks){ if (!k.visible) continue; const was = prev[k.id];
      if (was === undefined || k.filled > was){ ring = true;
        showToast({id:"clk"+k.id+":"+k.filled+":"+(was===undefined?"n":""), who:"⏳ "+k.name, label: was === undefined ? "nuovo orologio" : k.filled >= k.segments ? "completo!" : "avanza", total:`${k.filled}/${k.segments}`, detail:k.note||""}); } }
    if (ring) chime();
  },[camp.clocks, ready]);
  const pinOps = {
    add: async (row) => { const {error:e} = await sb.from("pins").insert({...row, created_by:me.id}); await camp.loadPins(); return e ? "Segnaposto non salvato: "+e.message : ""; },
    update: async (id, patch) => { const {data, error:e} = await sb.from("pins").update(patch).eq("id", id).select("id"); await camp.loadPins();
      return e ? "Modifica non salvata: "+e.message : (!data || !data.length) ? "Puoi modificare solo i segnaposti che hai creato tu." : ""; },
    remove: async (id) => { const {data, error:e} = await sb.from("pins").delete().eq("id", id).select("id"); await camp.loadPins();
      return e ? "Non eliminato: "+e.message : (!data || !data.length) ? "Puoi eliminare solo i segnaposti che hai creato tu." : ""; },
  };
  const endMyTurn = async () => { const {error:e} = await sb.rpc("step_turn", {p_dir:1}); if (e) setMsg(errText(e)); };

  /* avviso quando tocca a me */
  const lastTurn = useRef(null);
  useEffect(()=>{
    if (!combat.active){ lastTurn.current = null; return; }
    if (combat.turn_id === lastTurn.current) return;
    lastTurn.current = combat.turn_id;
    const f = fighters.find(x=>x.id===combat.turn_id); const c = f && f.char_id && chars.find(x=>x.id===f.char_id);
    if ((c && c.owner===me.id) || (f && f.kind === "evento")) chime();
  },[combat.active, combat.turn_id, fighters, chars]);

  const onMove = async (pos) => {
    const trail = (party?.trail||[]).slice();
    if (party && typeof party.x==="number") trail.push({plane:party.plane,x:party.x,y:party.y,label:party.label||"",at:party.at||0});
    return writeParty({...pos, by:me.id, at:Date.now(), trail: trail.slice(-20)});
  };
  const writeParty = async (state) => {
    const {data:rows, error:e} = await sb.from("party").update({state, updated_at:new Date().toISOString()}).eq("id",1).select("state");
    if (e || !rows?.length) return "Spostamento non salvato: controlla la connessione e riprova.";
    camp.setParty(rows[0].state); return "";
  };
  const onClearTrail = () => writeParty({...(party||{}), trail:[]});
  const onUpload = async (plane, file) => {
    if (file.size > 45*1024*1024) return "Immagine troppo grande: resta sotto i 45 MB.";
    const ext = (file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path = `${plane}-${Date.now()}.${ext}`;
    const up = await sb.storage.from("mappe").upload(path, file, {contentType: file.type || "image/jpeg", upsert:false});
    if (up.error) return "Caricamento non riuscito: "+up.error.message;
    const prev = maps[plane];
    const {error:e} = await sb.from("maps").upsert({plane, path, updated_at:new Date().toISOString()});
    if (e) return "Mappa caricata ma non registrata: "+e.message;
    if (prev && prev!==path) sb.storage.from("mappe").remove([prev]);
    camp.reload(); return "";
  };

  const openChar = chars.find(c=>c.id===openId);
  const mine = chars.find(c=>c.owner===me.id);
  const goMine = () => { if (mine){ setOpenId(mine.id); setView("scheda"); } else { setView("gruppo"); setOpenId(null); } };
  const nav = [["gruppo","Il gruppo"],["tavolo", me.isMaster?"Plancia":"Tavolo"],["scheda","La mia scheda"],["mappa", PLANES.length>1?"Mappe":"Mappa"],["cronache","Cronache"]];
  const saveFor = useMemo(()=> openId ? (sheet)=>saveSheet(openId, sheet) : null, [openId, saveSheet]);

  return html`<${SpellsCtx.Provider} value=${book}><div>
    <header className="bar"><div className="bar-in">
      <div className="brand"><${Mark} size=${26}/><span>${CFG.name}</span></div>
      <nav className="nav">${nav.map(([k,l])=>html`<button type="button" key=${k} aria-current=${view===k && (k!=="scheda" || (mine && openId===mine.id))}
        onClick=${()=> k==="scheda" ? goMine() : (setView(k), setOpenId(null))}>${l}${k==="tavolo" && combat.active ? html` <span className="live" aria-label="scontro in corso"></span>` : null}</button>`)}</nav>
      <${AudioControl} sb=${sb} me=${me} sounds=${camp.sounds} audio=${camp.audio} world=${camp.world}/>
      <div className="userbox"><${Who} id=${me.id} name=${names[me.id]||me.email}/><span>${names[me.id]||me.email}${me.isMaster?" · master":""}</span>
        ${me.isMaster && html`<button type="button" className="btn small" aria-pressed=${view==="campagna"} title="Impostazioni della campagna" onClick=${()=>{ setView("campagna"); setOpenId(null); }}>⚙ Campagna</button>`}
        <button type="button" className="btn small" onClick=${onSignOut}>Esci</button></div>
    </div>
    <${WorldStrip} world=${camp.world} chars=${chars} me=${me}/>
    <${ClocksBar} clocks=${camp.clocks} me=${me} ops=${clockOps}/>
    <${TurnBanner} combat=${combat} fighters=${fighters} chars=${chars} me=${me} onEndTurn=${endMyTurn} onNext=${endMyTurn}
      onRollInit=${async f=>{ const m = await act.rollInit(f); if (m) setMsg(m); }} goTable=${()=>{setView("tavolo"); setOpenId(null);}}/>
    </header>
    <main className=${"wrap"+(view==="tavolo"?" wide":"")}>
      ${msg && html`<p className="notice err" role="alert">${msg} <button type="button" className="btn small" onClick=${()=>setMsg("")}>Chiudi</button></p>`}
      ${view==="gruppo" && html`<${Party} chars=${chars} me=${me} names=${names} party=${party} ready=${ready} error=${error} world=${camp.world}
          onOpen=${id=>{setOpenId(id); setView("scheda");}} onCreate=${()=>create(false)} onCreateNpc=${()=>create(true)} goMap=${()=>setView("mappa")}/>`}
      ${view==="campagna" && (me.isMaster ? html`<${CampaignSettings} sb=${sb} me=${me} config=${camp.config} setConfig=${camp.setConfig}/>` : html`<p className="muted">Solo il master può cambiare le impostazioni.</p>`)}
      ${view==="cronache" && html`<${Chronicles} sb=${sb} me=${me} camp=${camp} names=${names} hoUrls=${hoUrls} onOpenHandout=${h=>setHoOpen(h)}/>`}
      ${view==="tavolo" && html`<${TableView} sb=${sb} me=${me} chars=${chars} names=${names} camp=${camp} onFree=${onFree} act=${act} adjustHp=${adjustHp} clockOps=${clockOps}/>`}
      ${view==="scheda" && (openChar
          ? html`<${Sheet} key=${openId} remote=${openChar} onSave=${saveFor} onDelete=${()=>delSheet(openId)} onRoll=${onRoll}
              onBack=${()=>{setView("gruppo"); setOpenId(null);}}
              editable=${me.isMaster || openChar.owner===me.id} canDelete=${me.isMaster || openChar.owner===me.id}
              ownerName=${openChar.owner ? (names[openChar.owner]||"Giocatore") : "PNG del master"} world=${camp.world}/>`
          : html`<div className="empty"><h3>Scheda non trovata</h3><p className="muted">Forse è stata eliminata.</p><button className="btn" onClick=${()=>setView("gruppo")}>Torna al gruppo</button></div>`)}
      ${view==="mappa" && html`<${MapView} me=${me} party=${party} mapUrls=${urls} names=${names} onMove=${onMove} onClearTrail=${onClearTrail} onUpload=${onUpload} pins=${camp.pins} pinOps=${pinOps} cfgOps=${cfgOps}
          scenes=${camp.scenes} sceneStates=${camp.sceneStates} tokens=${camp.tokens} areas=${camp.areas} sceneOps=${sceneOps} chars=${chars} fighters=${fighters} combat=${combat}/>`}
    </main>
    ${hoOpen && html`<${HandoutModal} h=${hoOpen} url=${hoUrls[hoOpen.id]} onClose=${closeHandout}/>`}
    <${Toasts} toasts=${toasts}/>
  </div><//>`;
}

function App(){
  const configured = typeof SUPABASE_URL==="string" && /^https:\/\/.+/.test(SUPABASE_URL) && !SUPABASE_URL.includes("IL-TUO-PROGETTO") && !String(SUPABASE_KEY).startsWith("LA-TUA");
  const sb = useMemo(()=> configured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null, [configured]);
  const [session, setSession] = useState(undefined);
  const [me, setMe] = useState(null);
  const [member, setMember] = useState(null);
  const [, setBrandTick] = useState(0);
  useEffect(()=>{ if (!sb) return; sb.rpc("campaign_title").then(({data})=>{ if (data){ BRAND = data; document.title = data; setBrandTick(x=>x+1); } }).catch(()=>{}); },[sb]);

  useEffect(()=>{ if (!sb) return;
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e, s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  },[sb]);

  const userId = session?.user?.id;
  const checkMember = useCallback(async ()=>{
    if (!sb || !userId) { setMe(null); setMember(null); return; }
    const [{data:isM}, {data:row}] = await Promise.all([ sb.rpc("is_master"), sb.from("members").select("user_id").eq("user_id", userId).maybeSingle() ]);
    setMe({id:userId, email:session.user.email, isMaster: !!isM});
    setMember(!!row);
  },[sb, userId]);
  useEffect(()=>{ checkMember(); },[checkMember]);

  if (!configured) return html`<${Gate}><div className="gate-card"><h3>Manca la configurazione</h3>
    <p className="muted" style=${{margin:0}}>Apri questo file con un editor di testo e incolla in alto l’indirizzo del progetto Supabase e la chiave anon (o publishable), al posto dei segnaposto.</p></div><//>`;
  if (!sb) return html`<${Gate}><div className="gate-card"><p className="err">Non riesco a caricare la libreria di Supabase: controlla la connessione e ricarica.</p></div><//>`;
  if (session===undefined || (session && member===null)) return html`<${Gate}><p className="muted" style=${{textAlign:"center"}}>Apertura del taccuino…</p><//>`;
  if (!session) return html`<${Login} sb=${sb}/>`;
  if (!member) return html`<${Join} sb=${sb} user=${session.user} onJoined=${checkMember}/>`;
  return html`<${Main} sb=${sb} me=${me} onSignOut=${()=>sb.auth.signOut()}/>`;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);

</script>
</body>
</html>
