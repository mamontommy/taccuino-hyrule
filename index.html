<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2923">
<title>Taccuino di Hyrule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: un taccuino da campo — barra di navigazione fissa, schede come fogli a griglia, mappa come tavola a tutta larghezza */
:root{
  --bg:#ECEEE6; --surface:#F8F9F3; --sunk:#E2E6DC; --ink:#1E2923; --muted:#5B675F; --line:#C7CEC1;
  --accent:#2C6B5E; --accent-ink:#F4F8F5; --gold:#A8761B; --heart:#B03E37; --warn:#9A5B12;
  --f-display:"Marcellus SC","Cinzel",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --sunk:#151C18; --ink:#E3E8DF; --muted:#94A197; --line:#2D3832;
  --accent:#6DB3A1; --accent-ink:#0F1613; --gold:#D8A442; --heart:#E26A60; --warn:#E0A256; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --sunk:#151C18; --ink:#E3E8DF; --muted:#94A197; --line:#2D3832;
  --accent:#6DB3A1; --accent-ink:#0F1613; --gold:#D8A442; --heart:#E26A60; --warn:#E0A256; color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.45 var(--f-body)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.3rem;letter-spacing:.04em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.nav{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.nav button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;text-wrap:balance;margin:0}
h2{font-size:1.5rem}
h3{font-size:1.05rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--heart);border-color:color-mix(in srgb,var(--heart) 45%,var(--line))}
.btn.small{padding:4px 9px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;font-weight:700}

input.field,select.field,textarea.field,.num{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px;min-width:0;width:100%}
textarea.field{resize:vertical;min-height:110px;line-height:1.5}
.num{text-align:center;padding:5px 4px}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled .btn,fieldset:disabled .roll{cursor:default}
label.lab{display:grid;gap:3px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}

/* status */
.state{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.busy{background:var(--gold)} .dot.err{background:var(--heart)}

/* notice */
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:16px;background:var(--surface)}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--surface);display:grid;gap:10px;justify-items:center}
.empty p{max-width:52ch;margin:0}

/* party grid */
.party-head{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.where{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:18px;flex-wrap:wrap}
.where b{font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:grid;gap:10px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--muted)}
.card .nm{font-family:var(--f-display);font-size:1.2rem;line-height:1.15}
.who{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.who img{width:18px;height:18px;border-radius:50%}
.hpbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.hpbar i{display:block;height:100%;background:var(--heart)}
.hpbar i.temp{background:var(--gold)}
.stats{display:flex;gap:14px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--sunk)}
.chip.bad{border-color:color-mix(in srgb,var(--heart) 50%,var(--line));color:var(--heart)}
.chip.gold{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));color:var(--gold)}

/* sheet */
.sheet-top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin-bottom:14px}
.ident{display:grid;grid-template-columns:2fr repeat(4,1fr) 70px;gap:8px}
.ident .lab:first-child input{font-family:var(--f-display);font-size:1.3rem}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-block:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.modebar{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sunk)}
.modebar button{border:0;background:none;padding:5px 11px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.modebar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}

.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.vital{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;display:grid;gap:2px;background:var(--bg)}
.vital .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.vital .v{font-family:var(--f-mono);font-size:1.35rem;font-weight:600}
.vital input.num{font-size:1.2rem;font-weight:600;border:0;background:transparent;padding:0}
.vital.insp[data-on="true"]{border-color:var(--gold);color:var(--gold)}
button.vital{cursor:pointer;font:inherit;color:inherit}

.hpbox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.hpbig{display:flex;align-items:baseline;gap:6px;font-family:var(--f-mono)}
.hpbig .cur{font-size:2.2rem;font-weight:600;color:var(--heart);line-height:1}
.hpbig .max{color:var(--muted)}
.hpctl{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px}
.hpsub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ab{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:4px;justify-items:center;background:var(--bg)}
.ab .k{font-family:var(--f-display);font-size:.95rem;letter-spacing:.08em}
.roll{border:1px solid transparent;background:none;border-radius:6px;cursor:pointer;font-family:var(--f-mono);font-weight:600;padding:2px 6px}
.roll:hover{border-color:var(--line);background:var(--surface)}
.ab .mod{font-size:1.5rem}
.ab input.num{width:56px}
.save{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}

.pip{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;padding:0;flex:none;display:inline-grid;place-items:center}
.pip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.pip.exp[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}
.pip.bad[aria-pressed="true"]{background:var(--heart);border-color:var(--heart)}
.pip.half{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}

.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 18px}
.sk{display:grid;grid-template-columns:22px 1fr auto auto;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.sk .ab3{font-size:.72rem;color:var(--muted);letter-spacing:.08em}

.list{display:grid;gap:6px}
.li{display:grid;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.li.atk{grid-template-columns:minmax(0,2fr) 70px minmax(0,1.2fr) auto auto auto}
.li.res{grid-template-columns:minmax(0,1fr) auto 60px 92px auto}
.li.item{grid-template-columns:minmax(0,2fr) 60px minmax(0,2fr) auto}
.li.spell{grid-template-columns:auto minmax(0,2fr) 60px minmax(0,2fr) auto auto}
.li input.field{padding:4px 6px}
.pips{display:flex;gap:4px;flex-wrap:wrap}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;gap:6px;background:var(--bg)}
.slot .lv{font-family:var(--f-display);font-size:.9rem}

.conds{display:flex;flex-wrap:wrap;gap:6px}
.cond{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg);cursor:pointer;font-size:.85rem}
.cond[aria-pressed="true"]{background:color-mix(in srgb,var(--heart) 16%,var(--surface));border-color:var(--heart);color:var(--heart)}

.coins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.hy{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rest{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--heart);border-radius:8px;font-size:.9rem}

/* rolls */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:grid;gap:8px;width:min(320px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;box-shadow:0 6px 24px rgb(0 0 0/.25);animation:pop .18s ease-out}
.toast .t{font-weight:700}
.toast .tot{grid-row:span 2;font-family:var(--f-mono);font-size:1.8rem;font-weight:600;align-self:center}
.toast .d{font-family:var(--f-mono);font-size:.78rem;opacity:.8}
.toast.crit .tot{color:var(--gold)} .toast.fumble .tot{color:var(--heart)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}

/* map */
.planes{display:flex;gap:4px;flex-wrap:wrap}
.planes button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.planes button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.planes .here{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.mapbox{position:relative;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk);height:clamp(360px,68vh,780px);touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox.moving{cursor:crosshair}
.layer{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;--inv:1}
.layer img{display:block;width:100%;height:auto;pointer-events:none;max-width:none}
.trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.trail polyline{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;opacity:.85}
.tdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--gold);border:2px solid var(--surface);transform:scale(var(--inv));opacity:.75}
.marker{position:absolute;width:0;height:0;pointer-events:none}
.marker .m{position:absolute;left:0;top:0;transform:translate(-50%,-100%) scale(var(--inv));transform-origin:50% 100%;display:grid;justify-items:center}
.marker .lbl{position:absolute;top:6px;left:0;transform:translateX(-50%) scale(var(--inv));transform-origin:50% 0;white-space:nowrap;background:var(--ink);color:var(--bg);font-size:.8rem;padding:2px 8px;border-radius:999px;font-weight:600}
.marker .ring{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--gold);transform:scale(var(--inv));animation:ring 2.2s ease-out infinite}
.marker.pending .m{opacity:.8}
@keyframes ring{0%{opacity:.9;transform:scale(calc(var(--inv)*.3))}100%{opacity:0;transform:scale(calc(var(--inv)*1.4))}}
@media (prefers-reduced-motion: reduce){.marker .ring{animation:none;opacity:.5}.toast{animation:none}}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:2}
.mapctl .iconbtn{width:36px;height:36px;background:var(--surface)}
.maphint{position:absolute;left:10px;top:10px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;max-width:calc(100% - 70px)}
.nomap{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;
  background-color:var(--sunk);
  background-image:repeating-radial-gradient(circle at 30% 40%,transparent 0 22px,color-mix(in srgb,var(--line) 70%,transparent) 22px 23px);}
.nomap .empty{max-width:440px}
.pendbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px;border:1px solid var(--gold);border-radius:10px;background:var(--surface)}
.pendbar input{flex:1 1 200px}
.mapfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.9rem}

@media (max-width:860px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .ident{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ident .lab:first-child{grid-column:1/-1}
}
@media (max-width:560px){
  .sheet-top{grid-template-columns:1fr}
  .li.atk{grid-template-columns:minmax(0,1fr) auto auto auto}
  .li.atk > :first-child{grid-column:1/4}
  .li.atk > :nth-child(2){width:64px}
  .li.res{grid-template-columns:minmax(0,1fr) 60px 88px auto}
  .li.res .pips{grid-column:1/-1;order:5}
  .li.item{grid-template-columns:minmax(0,1fr) 56px auto}
  .li.item .note{grid-column:1/-1;order:5}
  .li.spell{grid-template-columns:auto minmax(0,1fr) 54px auto auto}
  .li.spell .note{grid-column:1/-1;order:6}
  .coins{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brand span{font-size:1.1rem}
}

/* accesso */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-box{width:min(420px,100%);display:grid;gap:16px}
.gate-box .brand{justify-content:center;font-size:1.6rem;margin:0}
.gate-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:20px;display:grid;gap:12px}
.gate-card form{display:grid;gap:12px}
.gate-tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk)}
.gate-tabs button{border:0;background:none;padding:7px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.gate-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.err{color:var(--heart);font-size:.9rem;margin:0}
.ok{color:var(--accent);font-size:.9rem;margin:0}
.initials{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:.65rem;font-weight:700;color:#fff;flex:none}
.userbox{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.nav{overflow-x:auto;max-width:100%}
.nav button{white-space:nowrap}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--heart);vertical-align:middle;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.wrap.wide{max-width:1500px}

/* banner del turno */
.turnbar{border-top:1px solid var(--line);background:var(--sunk)}
.turnbar.mine{background:color-mix(in srgb,var(--gold) 22%,var(--surface));border-top-color:var(--gold)}
.turnbar.prep{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.tb-in{max-width:1500px;margin:0 auto;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.95rem}

/* tavolo e plancia */
.table3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.85fr);gap:16px;align-items:start}
.table2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
@media (max-width:1180px){.table3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.table3 .col:last-child{grid-column:1/-1}}
@media (max-width:760px){.table3,.table2{grid-template-columns:minmax(0,1fr)}}

.feed{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:70vh;overflow-y:auto}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.fi.crit{border-color:var(--gold)} .fi.crit .fi-tot{color:var(--gold)}
.fi.fumble{border-color:var(--heart)} .fi.fumble .fi-tot{color:var(--heart)}
.fi.hid{border-style:dashed;opacity:.85}
.fi-main{min-width:0;display:grid;gap:2px}
.fi-det{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.fi-side{display:grid;justify-items:end}
.fi-tot{font-size:1.5rem;font-weight:600;line-height:1}
.fi-meta{font-size:.72rem;color:var(--muted)}

.dice{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.die{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 0;cursor:pointer;font-family:var(--f-mono);font-weight:600}
.die:hover{border-color:var(--accent);color:var(--accent)}
.dice-form{display:flex;gap:8px;flex-wrap:wrap}
.dice-form .field{flex:1 1 140px}
@media (max-width:420px){.dice{grid-template-columns:repeat(4,minmax(0,1fr))}}

.init-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ir{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

<script>
const {useState,useEffect,useRef,useMemo,useCallback,useContext} = React;
const html = htm.bind(React.createElement);

/* ---------- regole e dati ---------- */
const ABIL = [["for","Forza","FOR"],["des","Destrezza","DES"],["cos","Costituzione","COS"],["int","Intelligenza","INT"],["sag","Saggezza","SAG"],["car","Carisma","CAR"]];
const AB3 = Object.fromEntries(ABIL.map(a=>[a[0],a[2]]));
const SKILLS = [
 ["acro","Acrobazia","des"],["anim","Addestrare Animali","sag"],["arca","Arcano","int"],["atle","Atletica","for"],
 ["furt","Furtività","des"],["inda","Indagare","int"],["inga","Inganno","car"],["inti","Intimidire","car"],
 ["intr","Intrattenere","car"],["intu","Intuizione","sag"],["medi","Medicina","sag"],["natu","Natura","int"],
 ["perc","Percezione","sag"],["pers","Persuasione","car"],["rapi","Rapidità di Mano","des"],["reli","Religione","int"],
 ["sopr","Sopravvivenza","sag"],["stor","Storia","int"]];
const CONDS = ["Accecato","Affascinato","Afferrato","Assordato","Avvelenato","Incapacitato","Invisibile","Paralizzato","Pietrificato","Privo di sensi","Prono","Spaventato","Stordito","Trattenuto"];
const PLANES = [["cielo","Isole Celesti"],["superficie","Superficie"],["sottosuolo","Sottosuolo"]];
const PLANE_NAME = Object.fromEntries(PLANES);
const HD = [6,8,10,12];

const mod = s => Math.floor((Number(s)||0)/2) - 5;
const prof = lv => 2 + Math.floor((Math.max(1,Math.min(20,Number(lv)||1))-1)/4);
const sg = n => (n>=0?"+":"−")+Math.abs(n);
const clamp = (n,a,b)=> Math.max(a??-Infinity, Math.min(b??Infinity, n));
const uid = () => Math.random().toString(36).slice(2,10);
const d = n => 1 + Math.floor(Math.random()*n);

function blankSheet(){
  return {name:"", species:"", cls:"", subclass:"", background:"", level:1,
    abil:{for:10,des:10,cos:10,int:10,sag:10,car:10}, saves:{}, skills:{},
    ac:10, speed:9, initBonus:0, hp:{cur:10,max:10,temp:0}, hd:{die:8,spent:0}, death:{s:0,f:0},
    insp:false, exh:0, cond:[], attacks:[], spell:{abil:"", slots:Array.from({length:9},()=>({max:0,used:0}))},
    spells:[], res:[], items:[], coins:{mr:0,ma:0,me:0,mo:0,mp:0},
    hy:{emb:0, ten:0, meal:"", mealUntil:null, mealProtect:null, gear:{caldo:false, freddo:false}}, langs:"", profs:"", feats:"", story:"", notes:""};
}
function merge(base, src){
  if (Array.isArray(base)) return Array.isArray(src) ? JSON.parse(JSON.stringify(src)) : base;
  if (base && typeof base==="object"){
    const out = {...base};
    if (src && typeof src==="object") for (const k of Object.keys(src)) out[k] = (k in base) ? merge(base[k], src[k]) : JSON.parse(JSON.stringify(src[k]));
    return out;
  }
  return src===undefined || src===null ? base : src;
}
const norm = (raw) => {
  const s = merge(blankSheet(), raw||{});
  while (s.spell.slots.length<9) s.spell.slots.push({max:0,used:0});
  return s;
};
const setIn = (o, path, v) => {
  const [k,...rest] = path; const c = Array.isArray(o)?[...o]:{...o};
  c[k] = rest.length ? setIn(o?.[k] ?? {}, rest, v) : v; return c;
};
const derived = (s) => {
  const pb = prof(s.level);
  const m = Object.fromEntries(ABIL.map(([k])=>[k,mod(s.abil[k])]));
  const skill = (k,ab) => m[ab] + (s.skills[k]===2 ? 2*pb : s.skills[k]===1 ? pb : 0);
  const effMax = Math.max(1,(s.hp.max||0) - (s.hy.ten||0));
  const sa = s.spell.abil;
  return {pb, m, skill, effMax, init: m.des + (Number(s.initBonus)||0),
    passPerc: 10 + skill("perc","sag"),
    dc: sa ? 8 + pb + m[sa] : null, satk: sa ? pb + m[sa] : null};
};

function rollFormula(f){
  const re = /([+-]?)\s*(\d*)\s*[dD]\s*(\d+)|([+-]?)\s*(\d+)/g; let m, total=0, parts=[], any=false;
  const clean = String(f||"").replace(/−/g,"-");
  while ((m = re.exec(clean))){
    any = true;
    if (m[3]){ const sign = m[1]==="-"?-1:1, n = Math.min(50, Number(m[2]||1)), sides = Number(m[3]);
      const rs = Array.from({length:n},()=>d(sides)); total += sign*rs.reduce((a,b)=>a+b,0);
      parts.push((sign<0?"− ":"")+n+"d"+sides+"["+rs.join(",")+"]");
    } else { const sign = m[4]==="-"?-1:1; total += sign*Number(m[5]); parts.push((sign<0?"− ":"+ ")+m[5]); }
  }
  return any ? {total, detail: parts.join(" ")} : null;
}

const rtf = new Intl.RelativeTimeFormat("it",{numeric:"auto"});
function ago(t){ if(!t) return ""; const s = (t-Date.now())/1000;
  const a = Math.abs(s); if (a<60) return "adesso"; if (a<3600) return rtf.format(Math.round(s/60),"minute");
  if (a<86400) return rtf.format(Math.round(s/3600),"hour"); return rtf.format(Math.round(s/86400),"day"); }

function lsGet(k,def){ try{ const v = localStorage.getItem("taccuino:"+k); return v==null?def:JSON.parse(v);}catch(e){return def} }
function lsSet(k,v){ try{ localStorage.setItem("taccuino:"+k,JSON.stringify(v)) }catch(e){} }

function colorFor(id){ let h=0; for (const c of String(id||"")) h=(h*31+c.charCodeAt(0))>>>0; return `hsl(${h%360} 45% 42%)`; }
function initialsOf(n){ return (String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2)||"?").toUpperCase(); }

/* ---------- piccoli componenti ---------- */
function Num({id, value, onChange, min, max, className, label}){
  const [s,setS] = useState(String(value??0)); const f = useRef(false);
  useEffect(()=>{ if(!f.current) setS(String(value??0)) },[value]);
  return html`<input id=${id} aria-label=${label} className=${"num "+(className||"")} inputMode="numeric" value=${s}
    onFocus=${e=>{f.current=true; e.target.select()}} onBlur=${()=>{f.current=false; setS(String(value??0))}}
    onChange=${e=>{const v=e.target.value.replace("−","-"); setS(v); const n=parseInt(v,10); if(!isNaN(n)) onChange(clamp(n,min,max))}} />`;
}
function Txt({id,value,onChange,placeholder,className,label,area}){
  return area
    ? html`<textarea id=${id} aria-label=${label} className=${"field "+(className||"")} value=${value||""} placeholder=${placeholder} onChange=${e=>onChange(e.target.value)}></textarea>`
    : html`<input id=${id} aria-label=${label} className=${"field "+(className||"")} value=${value||""} placeholder=${placeholder} onChange=${e=>onChange(e.target.value)} />`;
}
function Pips({n, used, onSet, kind, label}){
  return html`<span className="pips" role="group" aria-label=${label}>${Array.from({length:n},(_,i)=>html`
    <button type="button" key=${i} className=${"pip "+(kind||"")} aria-pressed=${i<used} aria-label=${label+" "+(i+1)}
      onClick=${()=>onSet(i<used ? i : i+1)}></button>`)}</span>`;
}
function Who({id, name}){
  return html`<span className="initials" style=${{background:colorFor(id)}} aria-hidden="true">${initialsOf(name)}</span>`;
}
function Mark({size=28}){
  return html`<svg width=${size} height=${size} viewBox="0 0 32 32" aria-hidden="true">
    <path d="M9 30V3" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M10 4h16l-4.5 5.5L26 15H10z" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="9" cy="30" r="2.2" fill="var(--ink)"/></svg>`;
}

/* ---------- salvataggio scheda ---------- */
function useSheet(saveFn, remote){
  const [doc,setDoc] = useState(()=>norm(remote));
  const st = useRef({dirty:false,saving:false,timer:0,latest:null});
  const [status,setStatus] = useState("idle");
  useEffect(()=>{ if(remote && !st.current.dirty && !st.current.saving) setDoc(norm(remote)) },[remote]);
  const flush = useCallback(async()=>{
    const s = st.current; if (s.saving) return; s.saving = true; setStatus("saving");
    while (s.dirty){ s.dirty=false;
      const res = await saveFn(s.latest);
      if (res !== "ok"){ s.saving=false; setStatus(res); return; }
    }
    s.saving=false; setStatus("saved");
  },[saveFn]);
  useEffect(()=>()=>{ clearTimeout(st.current.timer); if(st.current.dirty) flush(); },[flush]);
  const change = useCallback((fn)=>{
    setDoc(prev=>{ const next = fn(prev); st.current.latest = next; st.current.dirty = true; return next; });
    setStatus("pending"); clearTimeout(st.current.timer); st.current.timer = setTimeout(flush, 700);
  },[flush]);
  return [doc, change, status];
}

function SaveState({status, ro}){
  if (ro) return html`<span className="state"><span className="dot"></span>Sola lettura</span>`;
  const map = {idle:["ok","Salvata"], saved:["ok","Salvata"], pending:["busy","Modifiche in corso…"], saving:["busy","Salvataggio…"],
    denied:["err","Non hai il permesso di modificare questa scheda"], error:["err","Salvataggio non riuscito: controlla la connessione"]};
  const [c,t] = map[status]||map.idle;
  return html`<span className="state" role="status"><span className=${"dot "+c}></span>${t}</span>`;
}

/* ---------- scheda personaggio ---------- */
function Sheet({remote, editable, onSave, onDelete, onRoll, onBack, ownerName, canDelete, world}){
  const [s, change, status] = useSheet(onSave, remote);
  const [tab, setTab] = useState(()=>lsGet("tab","comb"));
  const [mode, setMode] = useState("norm");
  const [hpAmt, setHpAmt] = useState("");
  const [sun, setSun] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const ro = !editable || status==="denied";
  const D = derived(s);
  const set = (path, v) => change(p => setIn(p, path.split("."), v));
  const upd = (fn) => change(p => fn(JSON.parse(JSON.stringify(p))));
  useEffect(()=>lsSet("tab",tab),[tab]);

  const charId = remote?.id;
  const r20 = (label, m) => { if (ro) return; onRoll({type:"d20", label, mod:m, mode, pen:(s.exh||0)*2, charId}); setMode("norm"); };
  const rDmg = (label, f) => { if (ro) return; if (!rollFormula(f)) return; onRoll({type:"formula", label, formula:f, charId}); };

  const applyHp = (kind) => {
    const n = parseInt(hpAmt,10); if (isNaN(n) || n<=0) return;
    upd(p => { if (kind==="dmg"){ let left=n; const t=Math.min(p.hp.temp||0,left); p.hp.temp-=t; left-=t; p.hp.cur=Math.max(0,p.hp.cur-left);}
               else if (kind==="heal"){ p.hp.cur=Math.min(D.effMax,p.hp.cur+n); if(p.hp.cur>0){p.death={s:0,f:0}} }
               else { p.hp.temp=Math.max(p.hp.temp||0,n); } return p; });
    setHpAmt("");
  };
  const spendHd = async () => {
    if (s.hd.spent >= s.level) return;
    const total = await onRoll({type:"formula", label:"Dado Vita", formula:`1d${s.hd.die}${D.m.cos>=0?"+":"-"}${Math.abs(D.m.cos)}`, charId});
    if (total == null) return;
    const gain = Math.max(1, total);
    upd(p=>{ p.hd.spent+=1; p.hp.cur=Math.min(D.effMax,p.hp.cur+gain); return p; });
  };
  const shortRest = () => upd(p=>{ p.res.forEach(r=>{ if(r.reset==="breve") r.used=0 }); return p; });
  const longRest = () => upd(p=>{
    if (sun) p.hy.ten = 0;
    const eff = Math.max(1,(p.hp.max||0)-(p.hy.ten||0));
    p.hp.cur = eff; p.hp.temp = 0; p.hd.spent = 0; p.death={s:0,f:0};
    p.spell.slots.forEach(x=>x.used=0); p.res.forEach(r=>r.used=0);
    p.exh = Math.max(0,(p.exh||0)-1); return p; });

  const listOps = (key, make) => ({
    add: () => upd(p=>{ p[key].push(make()); return p; }),
    set: (i,k,v) => upd(p=>{ p[key][i][k]=v; return p; }),
    del: (i) => upd(p=>{ p[key].splice(i,1); return p; }),
    patch: (i,o) => upd(p=>{ Object.assign(p[key][i], o); return p; }),
  });
  const atk = listOps("attacks", ()=>({id:uid(),name:"",bonus:"+0",dmg:"1d6",notes:""}));
  const res = listOps("res", ()=>({id:uid(),name:"",max:1,used:0,reset:"lungo"}));
  const itm = listOps("items", ()=>({id:uid(),name:"",qty:1,notes:""}));
  const spl = listOps("spells", ()=>({id:uid(),name:"",lvl:0,prep:true,conc:false,notes:""}));

  const tabs = [["comb","Combattimento"],["abil","Abilità"],["magia","Magia"],["zaino","Zaino"],["note","Note e storia"]];

  return html`<div>
    <div className="row" style=${{marginBottom:10}}>
      <button className="btn small" onClick=${onBack}>← Il gruppo</button>
      <span className="spacer"></span>
      ${ownerName && html`<span className="who"><${Who} id=${remote.owner} name=${ownerName}/>${ownerName}</span>`}
      <${SaveState} status=${status} ro=${!editable}/>
    </div>
    <fieldset disabled=${ro}>
    <div className="sheet-top">
      <div className="ident">
        <label className="lab">Nome<input id="pg-name" className="field" value=${s.name} placeholder="Nome del personaggio" onChange=${e=>set("name",e.target.value)}/></label>
        <label className="lab">Specie<${Txt} id="pg-sp" value=${s.species} placeholder="es. Rito" onChange=${v=>set("species",v)}/></label>
        <label className="lab">Classe<${Txt} id="pg-cl" value=${s.cls} placeholder="es. Ranger" onChange=${v=>set("cls",v)}/></label>
        <label className="lab">Sottoclasse<${Txt} id="pg-sub" value=${s.subclass} onChange=${v=>set("subclass",v)}/></label>
        <label className="lab">Background<${Txt} id="pg-bg" value=${s.background} onChange=${v=>set("background",v)}/></label>
        <label className="lab">Livello<${Num} id="pg-lv" value=${s.level} min=${1} max=${20} onChange=${v=>set("level",v)}/></label>
      </div>
      <div style=${{display:"grid",gap:6,justifyItems:"end"}}>
        <span className="eyebrow">Prossimo tiro d20</span>
        <div className="modebar" role="group" aria-label="Modalità del prossimo tiro">
          ${[["dis","Svantaggio"],["norm","Normale"],["adv","Vantaggio"]].map(([k,l])=>html`<button type="button" key=${k} aria-pressed=${mode===k} onClick=${()=>setMode(k)}>${l}</button>`)}
        </div>
      </div>
    </div>

    <div className="tabs" role="tablist">${tabs.map(([k,l])=>html`<button type="button" role="tab" key=${k} aria-selected=${tab===k} onClick=${()=>setTab(k)}>${l}</button>`)}</div>

    ${tab==="comb" && html`<div className="grid2">
      <div style=${{display:"grid",gap:16}}>
        <section className="panel">
          <div className="hpbox">
            <div>
              <div className="eyebrow">Punti ferita</div>
              <div className="hpbig"><span className="cur">${s.hp.cur}</span><span className="max">/ ${D.effMax}</span>${s.hp.temp>0 && html`<span className="chip gold">+${s.hp.temp} temp</span>`}</div>
              ${s.hy.ten>0 && html`<div className="muted" style=${{fontSize:".8rem"}}>Max ridotti di ${s.hy.ten} dalla Tenebra</div>`}
            </div>
            <div style=${{display:"grid",gap:6}}>
              <div className="hpctl">
                <input id="hp-amt" className="num" inputMode="numeric" placeholder="n" aria-label="Quantità" value=${hpAmt} onChange=${e=>setHpAmt(e.target.value)} onKeyDown=${e=>{if(e.key==="Enter")applyHp("dmg")}}/>
                <button type="button" className="btn danger" onClick=${()=>applyHp("dmg")}>Danno</button>
                <button type="button" className="btn" onClick=${()=>applyHp("heal")}>Cura</button>
              </div>
              <button type="button" className="btn small" onClick=${()=>applyHp("temp")}>Imposta PF temporanei</button>
            </div>
          </div>
          <div className="hpsub">
            <label className="lab">PF attuali<${Num} id="hp-cur" value=${s.hp.cur} min=${0} onChange=${v=>set("hp.cur",v)}/></label>
            <label className="lab">PF massimi<${Num} id="hp-max" value=${s.hp.max} min=${1} onChange=${v=>set("hp.max",v)}/></label>
            <label className="lab">Temporanei<${Num} id="hp-tmp" value=${s.hp.temp} min=${0} onChange=${v=>set("hp.temp",v)}/></label>
          </div>
          ${s.hp.cur===0 && html`<div className="row"><span className="eyebrow">Tiri contro la morte</span>
            <span className="muted">Successi</span><${Pips} n=${3} used=${s.death.s} label="Successo" onSet=${v=>set("death.s",v)}/>
            <span className="muted">Fallimenti</span><${Pips} n=${3} used=${s.death.f} kind="bad" label="Fallimento" onSet=${v=>set("death.f",v)}/>
            <button type="button" className="btn small" onClick=${()=>r20("TS contro morte",0)}>Tira</button></div>`}
        </section>

        <div className="vitals">
          <div className="vital"><span className="k">CA</span><${Num} id="ac" value=${s.ac} min=${0} label="Classe Armatura" onChange=${v=>set("ac",v)}/></div>
          <button type="button" className="vital" onClick=${()=>r20("Iniziativa",D.init)}><span className="k">Iniziativa</span><span className="v">${sg(D.init)}</span></button>
          <div className="vital"><span className="k">Velocità m</span><${Num} id="spd" value=${s.speed} min=${0} label="Velocità in metri" onChange=${v=>set("speed",v)}/></div>
          <div className="vital"><span className="k">Competenza</span><span className="v">${sg(D.pb)}</span></div>
          <div className="vital"><span className="k">Perc. passiva</span><span className="v">${D.passPerc}</span></div>
          <button type="button" className="vital insp" data-on=${s.insp} aria-pressed=${s.insp} onClick=${()=>set("insp",!s.insp)}><span className="k">Ispirazione</span><span className="v">${s.insp?"★":"☆"}</span></button>
        </div>

        <section className="panel">
          <div className="panel-h"><h3>Caratteristiche</h3><span className="muted" style=${{fontSize:".82rem"}}>Tocca un valore per tirare</span></div>
          <div className="abil">${ABIL.map(([k,name,ab])=>html`<div className="ab" key=${k}>
            <span className="k" title=${name}>${ab}</span>
            <button type="button" className="roll mod" aria-label=${"Prova di "+name} onClick=${()=>r20("Prova di "+name,D.m[k])}>${sg(D.m[k])}</button>
            <${Num} id=${"ab-"+k} value=${s.abil[k]} min=${1} max=${30} label=${name} onChange=${v=>set("abil."+k,v)}/>
            <span className="save"><button type="button" className="pip" aria-pressed=${!!s.saves[k]} aria-label=${"Competenza TS "+name} onClick=${()=>set("saves."+k,!s.saves[k])}></button>
              TS <button type="button" className="roll" onClick=${()=>r20("TS "+name, D.m[k]+(s.saves[k]?D.pb:0))}>${sg(D.m[k]+(s.saves[k]?D.pb:0))}</button></span>
          </div>`)}</div>
        </section>

        <section className="panel">
          <div className="panel-h"><h3>Condizioni</h3>
            <span className="row" style=${{gap:6}}><span className="muted">Esaurimento</span>
              <button type="button" className="iconbtn" aria-label="Riduci esaurimento" onClick=${()=>set("exh",Math.max(0,s.exh-1))}>−</button>
              <span className="mono" style=${{minWidth:18,textAlign:"center"}}>${s.exh}</span>
              <button type="button" className="iconbtn" aria-label="Aumenta esaurimento" onClick=${()=>set("exh",Math.min(6,s.exh+1))}>+</button></span>
          </div>
          ${s.exh>0 && html`<div className="muted" style=${{fontSize:".85rem"}}>${s.exh>=6?"Livello 6: il personaggio muore.":`−${s.exh*2} a tutte le prove d20 (già applicato ai tiri) · −${(s.exh*1.5).toLocaleString("it")} m di velocità`}</div>`}
          <div className="conds">${CONDS.map(c=>html`<button type="button" key=${c} className="cond" aria-pressed=${s.cond.includes(c)}
            onClick=${()=>upd(p=>{ p.cond = p.cond.includes(c)? p.cond.filter(x=>x!==c) : [...p.cond,c]; return p; })}>${c}</button>`)}</div>
        </section>
      </div>

      <div style=${{display:"grid",gap:16}}>
        <section className="panel">
          <div className="panel-h"><h3>Attacchi</h3><button type="button" className="btn small" onClick=${atk.add}>+ Aggiungi</button></div>
          ${s.attacks.length===0 && html`<p className="muted" style=${{margin:0}}>Nessun attacco. Aggiungi armi e trucchetti offensivi: bonus per colpire e formula dei danni (es. 1d8+3).</p>`}
          <div className="list">${s.attacks.map((a,i)=>html`<div className="li atk" key=${a.id}>
            <${Txt} id=${"atk-n-"+a.id} value=${a.name} placeholder="Arma" label="Nome attacco" onChange=${v=>atk.set(i,"name",v)}/>
            <${Txt} id=${"atk-b-"+a.id} value=${a.bonus} placeholder="+5" label="Bonus per colpire" className="mono" onChange=${v=>atk.set(i,"bonus",v)}/>
            <${Txt} id=${"atk-d-"+a.id} value=${a.dmg} placeholder="1d8+3 taglienti" label="Danni" className="mono dmg" onChange=${v=>atk.set(i,"dmg",v)}/>
            <button type="button" className="btn small" onClick=${()=>r20(a.name||"Attacco", parseInt(String(a.bonus).replace("−","-"),10)||0)}>Colpire</button>
            <button type="button" className="btn small" onClick=${()=>rDmg((a.name||"Attacco")+" · danni", a.dmg)}>Danni</button>
            <button type="button" className="iconbtn" aria-label="Elimina attacco" onClick=${()=>atk.del(i)}>×</button>
          </div>`)}</div>
        </section>

        <section className="panel">
          <div className="panel-h"><h3>Dadi vita e riposi</h3></div>
          <div className="row">
            <label className="lab" style=${{width:90}}>Dado<select id="hd-die" className="field" value=${s.hd.die} onChange=${e=>set("hd.die",Number(e.target.value))}>${HD.map(x=>html`<option key=${x} value=${x}>d${x}</option>`)}</select></label>
            <div style=${{display:"grid",gap:4}}><span className="muted" style=${{fontSize:".78rem"}}>Disponibili ${s.level-s.hd.spent} su ${s.level}</span>
              <${Pips} n=${s.level} used=${s.level-s.hd.spent} label="Dado vita" onSet=${v=>set("hd.spent",s.level-v)}/></div>
            <button type="button" className="btn" onClick=${spendHd} disabled=${s.hd.spent>=s.level}>Spendi un dado</button>
          </div>
          <div className="rest">
            <button type="button" className="btn" onClick=${shortRest}>Riposo breve</button>
            <button type="button" className="btn primary" onClick=${longRest}>Riposo lungo</button>
            ${s.hy.ten>0 && html`<label className="row" style=${{gap:6,fontSize:".88rem"}}><input id="sun" type="checkbox" checked=${sun} onChange=${e=>setSun(e.target.checked)}/>al sole o presso una Radice Luminosa</label>`}
          </div>
          <p className="muted" style=${{margin:0,fontSize:".82rem"}}>Il riposo lungo ripristina PF, tutti i dadi vita, slot e risorse, e toglie un livello di esaurimento. Il breve ricarica le risorse segnate “breve”.</p>
        </section>

        <section className="panel">
          <div className="panel-h"><h3>Risorse di classe</h3><button type="button" className="btn small" onClick=${res.add}>+ Aggiungi</button></div>
          ${s.res.length===0 && html`<p className="muted" style=${{margin:0}}>Ira, Ki, Incanalare Divinità, slot del patto… tutto ciò che si consuma e si ricarica.</p>`}
          <div className="list">${s.res.map((r,i)=>html`<div className="li res" key=${r.id}>
            <${Txt} id=${"res-n-"+r.id} value=${r.name} placeholder="Risorsa" label="Nome risorsa" onChange=${v=>res.set(i,"name",v)}/>
            <${Pips} n=${Math.min(20,r.max)} used=${Math.min(r.max,r.max-r.used)} label=${r.name||"Uso"} onSet=${v=>res.set(i,"used",r.max-v)}/>
            <${Num} id=${"res-m-"+r.id} value=${r.max} min=${1} max=${20} label="Usi massimi" onChange=${v=>res.set(i,"max",v)}/>
            <select id=${"res-r-"+r.id} className="field" aria-label="Si ricarica con" value=${r.reset} onChange=${e=>res.set(i,"reset",e.target.value)}>
              <option value="breve">Breve</option><option value="lungo">Lungo</option></select>
            <button type="button" className="iconbtn" aria-label="Elimina risorsa" onClick=${()=>res.del(i)}>×</button>
          </div>`)}</div>
        </section>

        <section className="panel">
          <div className="panel-h"><h3>Hyrule</h3></div>
          <div className="hy">
            <label className="lab">Emblemi dei santuari<${Num} id="emb" value=${s.hy.emb} min=${0} onChange=${v=>set("hy.emb",v)}/>
              <span>${Math.min(3,Math.floor(s.hy.emb/4))} potenziamenti su 3 · ogni 4 emblemi</span></label>
            <label className="lab">PF max persi per la Tenebra<${Num} id="ten" value=${s.hy.ten} min=${0} onChange=${v=>set("hy.ten",v)}/>
              <span>Si recuperano con un riposo lungo al sole</span></label>
          </div>
          <label className="lab">Pasto attivo (8 ore)<${Txt} id="meal" value=${s.hy.meal} placeholder="es. Spiedino piccante: resistenza al freddo" onChange=${v=>set("hy.meal",v)}/>
            ${s.hy.meal && s.hy.mealUntil && html`<span className=${mealActive(s.hy.mealUntil, world) ? "" : "err"}>${mealActive(s.hy.mealUntil, world) ? "Dura fino a "+fmtUntil(s.hy.mealUntil) : "Scaduto ("+fmtUntil(s.hy.mealUntil)+")"}
              ${!mealActive(s.hy.mealUntil, world) && html` <button type="button" className="btn small" onClick=${()=>upd(p=>{ p.hy.meal=""; p.hy.mealUntil=null; p.hy.mealProtect=null; return p; })}>Togli</button>`}</span>`}</label>
          <div className="row" style=${{gap:14}}><span className="muted" style=${{fontSize:".85rem"}}>Abbigliamento adatto al clima:</span>
            <label className="row" style=${{gap:6}}><input id="gear-caldo" type="checkbox" checked=${!!s.hy.gear?.caldo} onChange=${e=>set("hy.gear.caldo",e.target.checked)}/>caldo</label>
            <label className="row" style=${{gap:6}}><input id="gear-freddo" type="checkbox" checked=${!!s.hy.gear?.freddo} onChange=${e=>set("hy.gear.freddo",e.target.checked)}/>freddo</label></div>
        </section>
      </div>
    </div>`}

    ${tab==="abil" && html`<div style=${{display:"grid",gap:16}}>
      <section className="panel">
        <div className="panel-h"><h3>Abilità</h3><span className="muted" style=${{fontSize:".82rem"}}>Il cerchio alterna: nessuna → competenza → maestria</span></div>
        <div className="skills">${SKILLS.map(([k,name,ab])=>{ const lvl=s.skills[k]||0; const b=D.skill(k,ab);
          return html`<div className="sk" key=${k}>
            <button type="button" className=${"pip "+(lvl===2?"exp":"")} aria-pressed=${lvl>0} aria-label=${name+": "+["nessuna competenza","competenza","maestria"][lvl]}
              onClick=${()=>set("skills."+k,(lvl+1)%3)}>${lvl===2?html`<span style=${{fontSize:10,color:"var(--surface)"}}>★</span>`:null}</button>
            <span>${name}</span><span className="ab3">${AB3[ab]}</span>
            <button type="button" className="roll" onClick=${()=>r20(name,b)}>${sg(b)}</button></div>`;})}</div>
      </section>
      <div className="grid2">
        <section className="panel"><h3>Competenze</h3><${Txt} area id="profs" value=${s.profs} placeholder="Armature, armi, strumenti (es. utensili da cuoco)" onChange=${v=>set("profs",v)}/></section>
        <section className="panel"><h3>Lingue</h3><${Txt} area id="langs" value=${s.langs} placeholder="Comune, Zora, Gerudo…" onChange=${v=>set("langs",v)}/></section>
      </div>
    </div>`}

    ${tab==="magia" && html`<div style=${{display:"grid",gap:16}}>
      <section className="panel">
        <div className="row">
          <label className="lab" style=${{width:180}}>Caratteristica da incantatore
            <select id="sp-ab" className="field" value=${s.spell.abil} onChange=${e=>set("spell.abil",e.target.value)}>
              <option value="">Nessuna</option>${ABIL.slice(3).map(([k,n])=>html`<option key=${k} value=${k}>${n}</option>`)}</select></label>
          ${D.dc!=null && html`<div className="vital" style=${{minWidth:100}}><span className="k">CD incantesimi</span><span className="v">${D.dc}</span></div>
            <button type="button" className="vital" style=${{minWidth:100}} onClick=${()=>r20("Attacco con incantesimo",D.satk)}><span className="k">Attacco</span><span className="v">${sg(D.satk)}</span></button>`}
        </div>
        <div className="eyebrow">Slot incantesimo</div>
        <div className="slots">${s.spell.slots.map((x,i)=>html`<div className="slot" key=${i}>
          <div className="row" style=${{justifyContent:"space-between",gap:4}}><span className="lv">${i+1}° liv.</span>
            <${Num} id=${"slot-"+i} value=${x.max} min=${0} max=${9} label=${"Slot di "+(i+1)+"° livello"} onChange=${v=>upd(p=>{p.spell.slots[i].max=v; p.spell.slots[i].used=Math.min(p.spell.slots[i].used,v); return p;})}/></div>
          ${x.max>0 ? html`<${Pips} n=${x.max} used=${x.max-x.used} label=${"Slot "+(i+1)+"°"} onSet=${v=>upd(p=>{p.spell.slots[i].used=x.max-v; return p;})}/>` : html`<span className="muted" style=${{fontSize:".75rem"}}>—</span>`}
        </div>`)}</div>
      </section>
      <section className="panel">
        <div className="panel-h"><h3>Incantesimi</h3><button type="button" className="btn small" onClick=${spl.add}>+ Aggiungi</button></div>
        ${s.spells.length===0 && html`<p className="muted" style=${{margin:0}}>Aggiungi trucchetti (livello 0) e incantesimi: scrivi le prime lettere del nome e scegli dall’elenco, livello e concentrazione si compilano da soli. Passa sopra al nome (o tocca la “i”) per leggere cosa fa. La spunta indica se è preparato, la C la concentrazione.</p>`}
        <div className="list">${[...s.spells].map((x,i)=>({x,i})).sort((a,b)=>a.x.lvl-b.x.lvl).map(({x,i})=>html`<div className="li spell" key=${x.id}>
          <button type="button" className="pip" aria-pressed=${x.prep} aria-label="Preparato" onClick=${()=>spl.set(i,"prep",!x.prep)}></button>
          <${SpellName} x=${x} ro=${ro} onType=${v=>spl.patch(i,{name:v, ref:""})}
            onPick=${sp=>spl.patch(i,{name:sp.name, ref:sp.key, lvl:sp.level, conc:!!sp.concentration, notes: x.notes || spellSummary(sp)})}/>
          <${Num} id=${"sp-l-"+x.id} value=${x.lvl} min=${0} max=${9} label="Livello" onChange=${v=>spl.set(i,"lvl",v)}/>
          <${Txt} id=${"sp-x-"+x.id} value=${x.notes} placeholder="Gittata, durata, danni…" label="Note" className="note" onChange=${v=>spl.set(i,"notes",v)}/>
          <button type="button" className="btn small" aria-pressed=${x.conc} style=${x.conc?{borderColor:"var(--gold)",color:"var(--gold)"}:null} title="Concentrazione" onClick=${()=>spl.set(i,"conc",!x.conc)}>C</button>
          <button type="button" className="iconbtn" aria-label="Elimina incantesimo" onClick=${()=>spl.del(i)}>×</button>
        </div>`)}</div>
      </section>
    </div>`}

    ${tab==="zaino" && html`<div style=${{display:"grid",gap:16}}>
      <section className="panel"><h3>Monete</h3>

      <section className="panel" style=${{gridColumn:"1/-1"}}><h3>Appunti di sessione</h3><${Txt} area id="notes" value=${s.notes} placeholder="Nomi, indizi, promesse fatte…" onChange=${v=>set("notes",v)}/></section>
    </div>`}

       : html`<div className="confirm"><span>Eliminare per sempre la scheda di ${s.name||"questo personaggio"}?</span>
          <button type="button" className="btn small danger" onClick=${async()=>{ const ok = await onDelete(); if (ok) onBack(); else setConfirmDel(false); }}>Elimina</button>

/* ---------- vista gruppo ---------- */
function PartyCard({c, ownerName, onOpen, mine, haz, world}){
  const s = norm(c); const D = derived(s);
  const cold = haz && haz.kind && c.owner && !isProtected(s, haz.kind, world);
  const meal = s.hy.meal && s.hy.mealUntil && mealActive(s.hy.mealUntil, world) ? s.hy.meal.split(":")[0] : null;
  const hpPct = clamp(s.hp.cur / D.effMax * 100, 0, 100);
  return html`<button type="button" className="card" onClick=${onOpen}>
    <div><div className="nm">${s.name || "Senza nome"}</div>
      <div className="muted" style=${{fontSize:".9rem"}}>${[s.species, [s.cls,s.subclass].filter(Boolean).join(" · "), "liv. "+s.level].filter(Boolean).join(" — ")}</div></div>
    <div className="who">${c.owner ? html`<${Who} id=${c.owner} name=${ownerName}/>` : null}${mine ? "La tua scheda" : c.owner ? (ownerName || "Giocatore") : "PNG del master"}</div>
    <div style=${{display:"grid",gap:4}}>
      <div className="row" style=${{justifyContent:"space-between",fontSize:".85rem"}}><span className="muted">PF</span>
        <span className="mono">${s.hp.cur} / ${D.effMax}${s.hp.temp?` (+${s.hp.temp})`:""}</span></div>
      <div className="hpbar"><i style=${{width:hpPct+"%"}}></i></div>
    </div>
    <div className="stats"><span>CA <b>${s.ac}</b></span><span>Iniz. <b>${sg(D.init)}</b></span><span>Perc. pass. <b>${D.passPerc}</b></span>${D.dc!=null && html`<span>CD <b>${D.dc}</b></span>`}</div>
    ${(s.cond.length>0 || s.insp || s.exh>0 || s.hy.ten>0 || cold || meal) && html`<div className="chips">
      ${cold && html`<span className="chip bad">Non protetto dal ${haz.kind}</span>`}
      ${meal && html`<span className="chip gold">Pasto: ${meal}</span>`}
      ${s.insp && html`<span className="chip gold">★ Ispirazione</span>`}
      ${s.exh>0 && html`<span className="chip bad">Esaurimento ${s.exh}</span>`}
      ${s.hy.ten>0 && html`<span className="chip bad">Tenebra −${s.hy.ten}</span>`}
      ${s.cond.map(x=>html`<span className="chip bad" key=${x}>${x}</span>`)}</div>`}
  </button>`;
}

function Party({chars, me, names, party, onOpen, onCreate, onCreateNpc, goMap, ready, error, world}){
  const haz = climate(world);
  const mine = chars.find(c=>c.owner===me.id);
  const sorted = [...chars].sort((a,b)=> (a.owner===me.id?-1:b.owner===me.id?1:0) || (!a.owner - !b.owner) || String(a.name||"").localeCompare(String(b.name||"")));
  return html`<div>
    <div className="party-head">
      <div><div className="eyebrow">La compagnia</div><h2>Il gruppo</h2></div>
      <span className="spacer"></span>
      ${ready && !mine && html`<button type="button" className="btn primary" onClick=${onCreate}>Crea la tua scheda</button>`}
      ${me.isMaster && html`<button type="button" className="btn" onClick=${onCreateNpc}>+ Scheda PNG</button>`}
    </div>
    ${party && typeof party.x==="number" && html`<div className="where"><${Mark} size=${26}/><div><div className="eyebrow">${PLANE_NAME[party.plane]||"Posizione"}</div><b>${party.label || "Posizione segnata sulla mappa"}</b></div>
      <span className="spacer"></span><span className="muted" style=${{fontSize:".85rem"}}>${ago(party.at)}</span>
      <button type="button" className="btn small" onClick=${goMap}>Apri la mappa</button></div>`}
    ${error && html`<p className="notice err" role="alert">${error}</p>`}
    ${!ready ? html`<p className="muted">Caricamento delle schede…</p>`
      : chars.length===0 ? html`<div className="empty"><${Mark} size=${40}/><h3>Nessun personaggio ancora</h3>
          <p className="muted">Ogni giocatore crea qui la propria scheda: la vedrà tutto il gruppo, ma potrà modificarla solo chi la possiede (e il master).</p>
          <button type="button" className="btn primary" onClick=${onCreate}>Crea la tua scheda</button></div>`
      : html`<div className="cards">${sorted.map(c=>html`<${PartyCard} key=${c.id} c=${c} haz=${haz} world=${world} ownerName=${names[c.owner]} mine=${c.owner===me.id} onOpen=${()=>onOpen(c.id)}/>`)}</div>`}
  </div>`;
}

/* ---------- segnaposti ---------- */
const PIN_KINDS = [
  ["santuario","Santuario","Completato"], ["radice","Radice Luminosa","Risvegliata"], ["statua","Statua della Dea","Visitata"],
  ["stalla","Stalla","Visitata"], ["villaggio","Villaggio","Visitato"], ["voragine","Voragine","Esplorata"],
  ["pericolo","Pericolo","Superato"], ["nota","Nota","Fatto"]];
const PIN_NAME = Object.fromEntries(PIN_KINDS.map(k=>[k[0],k[1]]));
const PIN_DONE = Object.fromEntries(PIN_KINDS.map(k=>[k[0],k[2]]));

function Glyph({kind, done, size=22}){
  const s = size, ink = "var(--ink)", fillDone = done ? "var(--gold)" : "var(--surface)";
  const body = {
    santuario: html`<rect x="5" y="5" width="14" height="14" rx="3" fill=${done?"var(--accent)":"var(--surface)"} stroke=${ink} stroke-width="1.8"/><circle cx="12" cy="12" r="2.6" fill=${done?"var(--surface)":"var(--accent)"}/>`,
    radice: html`<circle cx="12" cy="12" r="4.5" fill=${fillDone} stroke=${ink} stroke-width="1.6"/>${[0,45,90,135,180,225,270,315].map(a=>html`<line key=${a} x1=${12+7*Math.cos(a*Math.PI/180)} y1=${12+7*Math.sin(a*Math.PI/180)} x2=${12+10*Math.cos(a*Math.PI/180)} y2=${12+10*Math.sin(a*Math.PI/180)} stroke=${done?"var(--gold)":ink} stroke-width="1.6" stroke-linecap="round"/>`)}`,
    statua: html`<path d="M12 3l3 6 6 .8-4.5 4.2 1.2 6.5L12 17.3 6.3 20.5l1.2-6.5L3 9.8 9 9z" fill=${fillDone} stroke=${ink} stroke-width="1.5" stroke-linejoin="round"/>`,
    stalla: html`<path d="M4 11l8-6 8 6v8H4z" fill=${done?"var(--accent)":"var(--surface)"} stroke=${ink} stroke-width="1.7" stroke-linejoin="round"/><rect x="10" y="13" width="4" height="6" fill=${ink}/>`,
    villaggio: html`<path d="M3 19V12l5-4 5 4v7zM13 19v-5l4-3 4 3v5z" fill=${done?"var(--accent)":"var(--surface)"} stroke=${ink} stroke-width="1.5" stroke-linejoin="round"/>`,
    voragine: html`<ellipse cx="12" cy="12" rx="9" ry="6" fill="var(--ink)" stroke=${done?"var(--gold)":ink} stroke-width="1.8"/><ellipse cx="12" cy="12" rx="4.5" ry="2.6" fill="var(--heart)" opacity=".7"/>`,
    pericolo: html`<path d="M12 3l9.5 17h-19z" fill=${done?"var(--surface)":"var(--heart)"} stroke=${ink} stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9v5" stroke=${done?ink:"var(--surface)"} stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill=${done?ink:"var(--surface)"}/>`,
    nota: html`<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill=${done?"var(--accent)":"var(--surface)"} stroke=${ink} stroke-width="1.7"/><circle cx="12" cy="10" r="2.3" fill=${ink}/>`,
  }[kind] || null;
  return html`<svg width=${s} height=${s} viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
}

      <label className="lab grow">Nome<input id="pin-label" className="field" value=${f.label} placeholder="es. Santuario di Ja Baij" onChange=${e=>setF({...f,label:e.target.value})} autoFocus/></label>
    </div>
    <label className="lab">Nota<textarea id="pin-note" className="field" style=${{minHeight:60}} value=${f.note} placeholder="Cosa c’è, chi lo ha trovato, cosa manca…" onChange=${e=>setF({...f,note:e.target.value})}></textarea></label>
    <div className="row">
      ${master && html`<label className="row" style=${{gap:6,fontSize:".9rem"}}><input id="pin-done" type="checkbox" checked=${f.done} onChange=${e=>setF({...f,done:e.target.checked})}/>${PIN_DONE[f.kind]}</label>`}
      ${master && html`<label className="row" style=${{gap:6,fontSize:".9rem"}}><input id="pin-hidden" type="checkbox" checked=${f.hidden} onChange=${e=>setF({...f,hidden:e.target.checked})}/>Nascosto ai giocatori</label>`}

/* ---------- mappa ---------- */
function MapView({me, party, mapUrls, names, onMove, onClearTrail, onUpload, pins, pinOps}){
  const [plane, setPlane] = useState(party?.plane || lsGet("plane","superficie"));
  const [mode, setMode] = useState(null);           // null | "move" | "pin"
  const [pending, setPending] = useState(null);     // posizione del gruppo da confermare
  const [draft, setDraft] = useState(null);         // nuovo segnaposto {x,y}
  const [selId, setSelId] = useState(null);
  const [editing, setEditing] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [label, setLabel] = useState("");
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [hiddenKinds, setHiddenKinds] = useState(()=>lsGet("pinfilter", []));
  const [peek, setPeek] = useState(false);          // il master vede il buio come i giocatori
  const vp = useRef(null), layer = useRef(null), img = useRef(null), fileIn = useRef(null), dark = useRef(null);
  const t = useRef({s:1,x:0,y:0});
  const ptrs = useRef(new Map()); const gesture = useRef(null);
  const src = mapUrls[plane];
  const srcKey = src ? src.split("?")[0] : "";
  const M = me.isMaster;
  useEffect(()=>lsSet("plane",plane),[plane]);
  useEffect(()=>lsSet("pinfilter",hiddenKinds),[hiddenKinds]);
  useEffect(()=>{ setLoaded(false); setPending(null); setDraft(null); setSelId(null); },[srcKey, plane]);

  const planePins = pins.filter(p=>p.plane===plane);
  const shownPins = planePins.filter(p=>!hiddenKinds.includes(p.kind));
  const sel = pins.find(p=>p.id===selId);
  const canEditPin = p => p && (M || p.created_by===me.id);

  const apply = () => { const el = layer.current; if(!el) return; const {s,x,y} = t.current;
    el.style.transform = `translate(${x}px,${y}px) scale(${s})`; el.style.setProperty("--inv", String(1/s)); };
  const fit = () => { const v = vp.current, l = layer.current; if(!v||!l) return;
    const W = v.clientWidth, H = v.clientHeight, h = l.offsetHeight || 1; const s = Math.min(1, H/h);
    t.current = {s, x:(W - W*s)/2, y:(H - h*s)/2}; apply(); };
  const zoomAt = (f, px, py) => { const o = t.current; const s = clamp(o.s*f, 0.2, 10);
    t.current = {s, x: px - (px-o.x)*(s/o.s), y: py - (py-o.y)*(s/o.s)}; apply(); };
  const zoomBtn = f => { const v = vp.current; zoomAt(f, v.clientWidth/2, v.clientHeight/2); };
  const centerOn = (nx, ny) => { const v=vp.current, l=layer.current; if(!v||!l) return; const o=t.current; const s=Math.max(o.s,1.5);
    t.current = {s, x: v.clientWidth/2 - nx*l.offsetWidth*s, y: v.clientHeight/2 - ny*l.offsetHeight*s}; apply(); };

  useEffect(()=>{ const v = vp.current; if(!v) return;
    const onWheel = e => { if(!layer.current) return; e.preventDefault(); const r=v.getBoundingClientRect(); zoomAt(e.deltaY<0?1.15:1/1.15, e.clientX-r.left, e.clientY-r.top); };
    v.addEventListener("wheel", onWheel, {passive:false});
    const onResize = () => fit(); window.addEventListener("resize", onResize);
    return ()=>{ v.removeEventListener("wheel", onWheel); window.removeEventListener("resize", onResize); };
  },[srcKey]);

  /* buio del Sottosuolo */
  const isDeep = plane === "sottosuolo";
  const lightsKey = JSON.stringify([isDeep, loaded, peek, M, planePins.filter(p=>p.kind==="radice"&&p.done).map(p=>[p.x,p.y]), party?.plane===plane ? [party.x,party.y] : null]);
  useEffect(()=>{
    const c = dark.current, im = img.current; if (!c || !im || !isDeep || !loaded) return;
    const W = 900, H = Math.max(1, Math.round(W * (im.naturalHeight||1) / (im.naturalWidth||1)));
    c.width = W; c.height = H; const ctx = c.getContext("2d");
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(5,7,9,${M && !peek ? 0.55 : 0.95})`; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "destination-out";
    const hole = (x,y,r) => { const g = ctx.createRadialGradient(x*W,y*H,0,x*W,y*H,r*W);
      g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(.55,"rgba(0,0,0,.9)"); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x*W,y*H,r*W,0,Math.PI*2); ctx.fill(); };
    planePins.filter(p=>p.kind==="radice" && p.done).forEach(p=>hole(p.x,p.y,0.1));
    if (party && party.plane===plane && typeof party.x==="number") hole(party.x, party.y, 0.035);
    ctx.globalCompositeOperation = "source-over";
  },[lightsKey]);

  const toNorm = (e) => { const r = img.current.getBoundingClientRect(); return {x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.height}; };
  const down = e => { if (e.target.closest(".mapctl")) return; vp.current.setPointerCapture?.(e.pointerId);
    ptrs.current.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pinEl = e.target.closest("[data-pin]");
    gesture.current = {x:e.clientX, y:e.clientY, moved:false, multi: ptrs.current.size>1, pin: pinEl ? pinEl.getAttribute("data-pin") : null}; };
  const move = e => { const P = ptrs.current; if(!P.has(e.pointerId)) return; const prev = P.get(e.pointerId);
    const cur = {x:e.clientX,y:e.clientY};
    if (P.size===1){ t.current.x += cur.x-prev.x; t.current.y += cur.y-prev.y; apply(); }
    else if (P.size===2){ const [a,b] = [...P.entries()].map(([id,p])=> id===e.pointerId?cur:p); const [pa,pb]=[...P.values()];
      const d0 = Math.hypot(pa.x-pb.x,pa.y-pb.y), d1 = Math.hypot(a.x-b.x,a.y-b.y);
      const r = vp.current.getBoundingClientRect(); if (d0>0) zoomAt(d1/d0, (a.x+b.x)/2-r.left, (a.y+b.y)/2-r.top);
      if (gesture.current) gesture.current.multi = true; }
    P.set(e.pointerId,cur);
    const g = gesture.current; if (g && Math.hypot(cur.x-g.x,cur.y-g.y)>6) g.moved = true; };
  const up = e => { const P = ptrs.current; P.delete(e.pointerId); const g = gesture.current;
    if (P.size!==0) return; gesture.current = null;
    if (!g || g.moved || g.multi || !img.current) return;
    const n = toNorm(e); const inside = n.x>=0 && n.x<=1 && n.y>=0 && n.y<=1;
    if (mode==="move" && inside){ setPending(n); setLabel(party?.plane===plane ? (party?.label||"") : ""); return; }
    if (mode==="pin" && inside){ setDraft(n); setSelId(null); return; }
    if (g.pin){ setSelId(g.pin); setEditing(false); setConfirmDel(false); return; }
    setSelId(null); };

  const savePos = async () => { if(!pending) return; setBusy("pos"); setErr("");
    const msg = await onMove({plane, x:pending.x, y:pending.y, label:label.trim()});
    if (msg) setErr(msg); else { setPending(null); setMode(null); }
    setBusy(""); };
  const upload = async (file) => { if(!file) return; setBusy("up"); setErr("");
    const msg = await onUpload(plane, file); if (msg) setErr(msg);
    setBusy(""); if (fileIn.current) fileIn.current.value = ""; };
  const savePin = async (f) => { setBusy("pin"); setErr("");
    const row = {kind:f.kind, label:f.label.trim(), note:f.note.trim(), done:!!f.done, hidden: M && !!f.hidden};
    const msg = editing && sel ? await pinOps.update(sel.id, row) : await pinOps.add({...row, plane, x:draft.x, y:draft.y});
    setBusy(""); if (msg) { setErr(msg); return; }
    setDraft(null); setEditing(false); if (!sel) setMode(null); };
  const toggleKind = k => setHiddenKinds(x => x.includes(k) ? x.filter(y=>y!==k) : [...x,k]);

  const here = party && party.plane===plane && typeof party.x==="number";
  const trailPts = (party?.trail||[]).filter(p=>p.plane===plane);
  const line = [...trailPts, ...(here?[party]:[])];
  const byName = party?.by ? (names[party.by] || "") : "";
  const kindsHere = PIN_KINDS.filter(([k])=>planePins.some(p=>p.kind===k));
  const deepLit = planePins.filter(p=>p.kind==="radice"&&p.done).length, deepAll = planePins.filter(p=>p.kind==="radice").length;
  const setModeTo = m => { setMode(mode===m ? null : m); setPending(null); setDraft(null); };

  return html`<div>
    <div className="party-head">
      <div><div className="eyebrow">Tavola del mondo</div><h2>Mappa di Hyrule</h2></div>
      <span className="spacer"></span>
      <div className="planes" role="group" aria-label="Piano">${PLANES.map(([k,n])=>html`<button type="button" key=${k} aria-pressed=${plane===k} onClick=${()=>setPlane(k)}>
        ${party?.plane===k && typeof party.x==="number" && html`<span className="here" title="Il gruppo è qui"></span>`}${n}</button>`)}</div>
    </div>

    <div className=${"mapbox"+(mode?" moving":"")} ref=${vp} onPointerDown=${src?down:null} onPointerMove=${src?move:null} onPointerUp=${src?up:null} onPointerCancel=${src?up:null}>
      ${src ? html`
        <div className="layer" ref=${layer}>
          <img key=${plane} ref=${img} src=${src} alt=${"Mappa: "+PLANE_NAME[plane]} draggable="false" onLoad=${()=>{setLoaded(true); requestAnimationFrame(fit);}}
            onError=${()=>setErr("Immagine della mappa non trovata: il master può ricaricarla.")}/>
          ${isDeep && html`<canvas className="dark" ref=${dark} aria-hidden="true"></canvas>`}
          ${line.length>1 && html`<svg className="trail" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points=${line.map(p=>(p.x*100)+","+(p.y*100)).join(" ")}/></svg>`}
          ${trailPts.map((p,i)=>html`<span key=${i} className="tdot" title=${p.label||""} style=${{left:p.x*100+"%",top:p.y*100+"%"}}></span>`)}
          ${shownPins.map(p=>html`<span key=${p.id} data-pin=${p.id} className=${"pin"+(p.id===selId?" sel":"")+(p.hidden?" hid":"")+(p.kind==="radice"&&p.done?" lit":"")} style=${{left:p.x*100+"%",top:p.y*100+"%"}} title=${p.label||PIN_NAME[p.kind]}>
              <${Glyph} kind=${p.kind} done=${p.done}/>${p.label && html`<span className="pin-lbl">${p.label}</span>`}</span>`)}
          ${draft && html`<span className="pin draft" style=${{left:draft.x*100+"%",top:draft.y*100+"%"}}><${Glyph} kind="nota"/></span>`}
          ${here && !pending && html`<div className="marker" style=${{left:party.x*100+"%",top:party.y*100+"%"}}>

    <div className="mapfoot">

      ${src && html`<button type="button" className="btn" aria-pressed=${mode==="pin"} onClick=${()=>setModeTo("pin")}>${mode==="pin"?"Annulla segnaposto":"+ Segnaposto"}</button>`}
      ${party && typeof party.x==="number" ? html`<span className="muted">Il gruppo è ${party.plane===plane?"qui":"su "+(PLANE_NAME[party.plane]||"un altro piano")}${party.label?": "+party.label:""} · spostato ${ago(party.at)}${byName?" da "+byName:""}</span>`

    ${(kindsHere.length>0 || isDeep) && html`<div className="mapfoot">
      ${kindsHere.length>0 && html`<span className="muted" style=${{fontSize:".85rem"}}>Mostra:</span>`}
      ${kindsHere.map(([k,n])=>html`<button type="button" key=${k} className="kchip" aria-pressed=${!hiddenKinds.includes(k)} onClick=${()=>toggleKind(k)}><${Glyph} kind=${k} size=${16}/>${n} <span className="muted">${planePins.filter(p=>p.kind===k).length}</span></button>`)}
      ${isDeep && html`<span className="spacer"></span><span className="muted" style=${{fontSize:".85rem"}}>Radici risvegliate: <b className="mono">${deepLit}</b>${deepAll?` su ${deepAll}`:""}</span>
        ${M && src && html`<label className="row" style=${{gap:6,fontSize:".85rem"}}><input id="peek" type="checkbox" checked=${peek} onChange=${e=>setPeek(e.target.checked)}/>Vedi il buio come i giocatori</label>`}`}
    </div>`}
    ${err && html`<p className="notice" role="alert" style=${{marginTop:10,borderColor:"var(--heart)"}}>${err} <button type="button" className="btn small" onClick=${()=>setErr("")}>Chiudi</button></p>`}

/* ---------- accesso ---------- */
const AUTH_ERR = (m) => {
  const s = String(m||"");
  if (/invalid login/i.test(s)) return "Email o password sbagliate.";
  if (/already registered|already been registered/i.test(s)) return "Questa email è già registrata: usa “Accedi”.";
  if (/password.*(6|characters|short)/i.test(s)) return "La password deve avere almeno 6 caratteri.";
  if (/email not confirmed/i.test(s)) return "Email non ancora confermata. Chiedi al master di disattivare la conferma email in Supabase, oppure apri il link che ti è arrivato.";
  if (/rate limit/i.test(s)) return "Troppi tentativi ravvicinati: riprova tra qualche minuto.";
  if (/fetch|network/i.test(s)) return "Server non raggiungibile: controlla la connessione.";
  return s || "Qualcosa non ha funzionato, riprova.";
};

function Gate({children}){
  return html`<div className="gate"><div className="gate-box">
    <div className="brand"><${Mark} size=${34}/><span>Taccuino di Hyrule</span></div>${children}</div></div>`;
}

function Login({sb}){
  const [mode, setMode] = useState("in");
  const [email, setEmail] = useState(""); const [pw, setPw] = useState(""); const [name, setName] = useState("");
  const [err, setErr] = useState(""); const [info, setInfo] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async (e) => { e.preventDefault(); setErr(""); setInfo(""); setBusy(true);
    try {
      if (mode==="in"){ const {error} = await sb.auth.signInWithPassword({email:email.trim(), password:pw}); if (error) setErr(AUTH_ERR(error.message)); }
      else { const {data, error} = await sb.auth.signUp({email:email.trim(), password:pw, options:{data:{name:name.trim()}}});
        if (error) setErr(AUTH_ERR(error.message));
        else if (!data.session) setInfo("Account creato. Conferma l’indirizzo dal link che ti è arrivato per email, poi accedi."); }
    } catch(ex){ setErr(AUTH_ERR(ex.message)); }
    setBusy(false); };
  return html`<${Gate}>
    <div className="gate-card">
      <div className="gate-tabs" role="group" aria-label="Accesso">
        <button type="button" aria-pressed=${mode==="in"} onClick=${()=>{setMode("in"); setErr("");}}>Accedi</button>
        <button type="button" aria-pressed=${mode==="up"} onClick=${()=>{setMode("up"); setErr("");}}>Registrati</button>
      </div>
      <form onSubmit=${submit}>
        ${mode==="up" && html`<label className="lab">Il tuo nome (lo vedrà il gruppo)<input id="su-name" className="field" required value=${name} onChange=${e=>setName(e.target.value)} autoComplete="nickname"/></label>`}
        <label className="lab">Email<input id="li-email" className="field" type="email" required value=${email} onChange=${e=>setEmail(e.target.value)} autoComplete="email"/></label>
        <label className="lab">Password<input id="li-pw" className="field" type="password" required minLength="6" value=${pw} onChange=${e=>setPw(e.target.value)} autoComplete=${mode==="in"?"current-password":"new-password"}/></label>
        ${err && html`<p className="err" role="alert">${err}</p>`}
        ${info && html`<p className="ok" role="status">${info}</p>`}
        <button className="btn primary" disabled=${busy}>${busy ? "Un momento…" : mode==="in" ? "Accedi" : "Crea l’account"}</button>
      </form>
    </div>
    <p className="muted" style=${{textAlign:"center",margin:0,fontSize:".9rem"}}>${mode==="in" ? "Prima volta? Scegli “Registrati”: dopo ti verrà chiesto il codice del gruppo." : "Serve solo per riconoscerti e salvare la tua scheda."}</p>
  <//>`;
}

function Join({sb, user, onJoined}){
  const [name, setName] = useState(user.user_metadata?.name || "");
  const [code, setCode] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async (e) => { e.preventDefault(); setErr(""); setBusy(true);
    const {data, error} = await sb.rpc("join_campaign", {p_code: code.trim(), p_name: name.trim()});
    setBusy(false);
    if (error) setErr(AUTH_ERR(error.message)); else if (!data) setErr("Codice del gruppo sbagliato. Chiedilo al master."); else onJoined();
  };
  return html`<${Gate}>
    <div className="gate-card">
      <h3>Unisciti al gruppo</h3>
      <p className="muted" style=${{margin:0}}>Inserisci il codice che ti ha dato il master. Serve una volta sola.</p>
      <form onSubmit=${submit}>
        <label className="lab">Il tuo nome<input id="jn-name" className="field" required value=${name} onChange=${e=>setName(e.target.value)}/></label>
        <label className="lab">Codice del gruppo<input id="jn-code" className="field" required value=${code} onChange=${e=>setCode(e.target.value)} autoComplete="off"/></label>
        ${err && html`<p className="err" role="alert">${err}</p>`}
        <button className="btn primary" disabled=${busy}>${busy?"Un momento…":"Entra"}</button>
